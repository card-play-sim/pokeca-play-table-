<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式デッキコード取り込み</title><style>body{font-family:system-ui,sans-serif;background:#10282d;color:#f0f6f5;margin:0;padding:14px}main{max-width:760px;margin:auto}input,textarea,button{font:inherit;border:1px solid #5d8386;border-radius:9px;background:#24474d;color:white;padding:10px}input{width:90%;max-width:380px}textarea{width:95%;height:160px}button{margin:5px 4px 5px 0}.card{background:#1d3c42;padding:10px;margin:8px 0;border-radius:10px;display:flex;gap:12px;align-items:center}.card img{width:65px;height:90px;object-fit:contain}.warn{color:#ffcf8e}a{color:#a5eee1}</style></head><body><main><a href="./">← 対戦盤面</a><h1>公式デッキコード取り込み</h1><p>公式デッキコードを入力してください。</p><input id="code" placeholder="xxxxxx-xxxxxx-xxxxxx" autocomplete="off" autocapitalize="off"><button id="open">公式レシピを開く</button><p>公式ページのカード一覧をコピーして、下に貼り付けてください。直接取得できる環境では自動取得も試します。</p><button id="fetch">自動取得を試す</button><textarea id="recipe" placeholder="公式サイトのレシピ一覧を貼り付け"></textarea><button id="import">60枚を取り込む</button><p class="warn" id="status" role="status"></p><div id="cards"></div><button id="save" disabled>デッキを保存</button><p>カードの正式照合・効果接続が完了するまでは、AI対戦には使用できません。未確認カードを推測で補完しません。</p></main><script src="ui/deck-code-import.js"></script><script src="ui/verified-card-art.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let deck=null;const status=s=>$('status').textContent=s;const getCode=()=> $('code').value.trim();const url=()=> 'https://www.pokemon-card.com/deck/deck.html?deckID='+encodeURIComponent(getCode());$('open').onclick=()=>{if(!PokecaDeckCodeImport.validCode(getCode()))return status('デッキコードを確認してください');window.open(url(),'_blank','noopener')};$('fetch').onclick=async()=>{if(!PokecaDeckCodeImport.validCode(getCode()))return status('デッキコードを確認してください');try{const res=await fetch(url(),{mode:'cors'});if(!res.ok)throw Error('HTTP '+res.status);const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');$('recipe').value=doc.body.innerText||doc.body.textContent||'';status('取得した文章を確認して「取り込む」を押してください')}catch(e){status('ブラウザから公式サイトを直接取得できません。公式レシピを開き、一覧をコピーして貼り付けてください。')}};$('import').onclick=()=>{try{deck=PokecaDeckCodeImport.parse($('recipe').value,getCode());$('cards').replaceChildren();const refs=window.PokecaVerifiedArt||{};for(const item of deck.cards){const div=document.createElement('div');div.className='card';const img=document.createElement('img');const matches=Object.entries(refs).filter(([id,c])=>c.name===item.name);if(matches.length===1)img.src=matches[0][1].sourceUrl;else img.alt='画像照合未完了';const label=document.createElement('span');label.textContent=item.name+' ×'+item.count+(item.pack?'　'+item.pack+' '+(item.number||''):'');div.append(img,label);$('cards').append(div)}$('save').disabled=false;status('60枚を解析しました。正式カードIDと画像の全件照合は未完了です。')}catch(e){deck=null;$('save').disabled=true;status(e.message)}};$('save').onclick=()=>{if(!deck)return;try{const key='pokeca.official-deck-imports.v1',list=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(list))throw Error('保存形式不正');const next=list.filter(x=>x.deckCode!==deck.deckCode);next.push(deck);localStorage.setItem(key,JSON.stringify(next));status('端末に保存しました。AI対戦への接続は未完了です。')}catch(e){status('保存できませんでした: '+e.message)}}})();
</script></body></html>
