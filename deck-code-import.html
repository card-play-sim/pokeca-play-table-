<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式デッキコード取り込み | PLAY TABLE</title>
<link rel="stylesheet" href="ui/deck-editor.css">
</head>
<body>
<header><a href="deck-builder.html">← デッキ構築</a><h1>公式コード取り込み</h1></header>
<main class="import-page">
<section>
<form id="lookup">
  <label for="code">公式デッキコード</label>
  <input id="code" placeholder="xxxxxx-xxxxxx-xxxxxx" autocomplete="off" autocapitalize="off">
  <div class="toolbar"><button type="submit">自動取得</button><a id="open" target="_blank" rel="noopener">公式レシピを開く</a></div>
</form>
<details open>
  <summary>公式ページを取り込む</summary>
  <p>自動取得できない場合は、公式のデッキ構築ページをHTMLとして保存し、ここで選択してください。</p>
  <label for="html-file">公式ページのHTML</label>
  <input type="file" id="html-file" accept=".html,.htm,text/html">
  <label for="recipe">公式レシピ一覧を貼り付け</label>
  <textarea id="recipe" rows="5" placeholder="公式ページのカード一覧"></textarea>
  <button id="import" type="button">一覧を解析</button>
</details>
<p id="status" role="status"></p>
<div id="cards" class="deck-grid"></div>
<div class="toolbar">
  <button id="save" disabled>保存</button>
  <button id="edit" disabled>保存して編集</button>
</div>
</section>
<section><h2>取り込み履歴</h2><div id="saved-decks" class="saved-grid"></div></section>
</main>
<script src="ui/deck-code-import.js" defer></script>
<script src="ui/deck-import-page.js" defer></script>
</body>
</html>
