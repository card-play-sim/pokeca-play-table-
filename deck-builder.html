<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>デッキ編集 | PLAY TABLE</title>
<link rel="stylesheet" href="ui/deck-editor.css">
</head>
<body class="deck-builder">
<header class="builder-header">
  <a id="builder-back" href="./">‹ デッキ一覧</a>
  <h1 id="screen-name">デッキ編集</h1>
  <strong id="total">0 / 60枚</strong>
  <div id="header-name"></div>
</header>
<main class="builder-main">
  <p id="message" role="status"></p>
  <section id="editor-screen">
    <label for="deck-name">デッキ名</label><input id="deck-name" maxlength="60" disabled>
    <h2 class="overview-title">デッキ全体</h2>
    <div id="deck-overview" class="deck-overview"></div>
    <div class="builder-toolbar">
      <a href="#search">＋ カードを追加</a><button id="save" disabled>保存</button>
    </div>
    <div id="deck-list"></div>
    <details id="deck-menu">
      <summary>その他の操作</summary>
      <label for="deck-cover">表紙カード</label><select id="deck-cover"></select>
      <div class="toolbar">
        <button id="duplicate">複製</button><button id="export">JSON出力</button><button id="remove">デッキ削除</button>
        <a href="deck-code-import.html">公式コード取り込み</a>
      </div>
    </details>
  </section>
  <section id="search-screen" hidden>
    <div class="toolbar">
      <input id="query" type="search" placeholder="カード名・公式IDで検索" aria-label="カード名・公式IDで検索">
      <select id="category" aria-label="カード分類"></select>
    </div>
    <p id="catalog-info" role="status"></p>
    <div class="builder-card-grid" id="cards"></div>
    <button id="more" hidden>さらに表示</button>
  </section>
</main>
<script src="ui/deck-code-import.js" defer></script>
<script src="ui/saved-decks.js" defer></script>
<script src="ui/deck-builder.js" defer></script>
</body>
</html>
