name: Stage safe import cache recovery
on:
  push:
    branches: [fix/deck-import-stale-service-worker-20261122]
    paths:
      - 'deck-code-import.html'
      - 'ui/deck-import-page.js'
      - 'scripts/build-pwa-release.cjs'
      - 'scripts/pwa-worker-template.js'
      - 'tests/deck-import-cache-recovery.test.cjs'
      - '.github/workflows/deck-import-cache-recovery-stage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deck-import-stale-service-worker-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate byte-verified release and exercise old-worker bypass
        run: |
          node scripts/build-pwa-release.cjs
          node scripts/build-pwa-release.cjs --check
          node tests/deck-import-cache-recovery.test.cjs
          node tests/deck-code-import.test.cjs
          node tests/deck-blocker-diagnostics.test.cjs
      - name: Commit generated PWA manifest without touching saved device data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: cache-bust official import subpage with verified offline PWA release'
            git push origin HEAD:fix/deck-import-stale-service-worker-20261122
          fi
