name: Reference effect provenance gate

on:
  push:
    branches: [main]
    paths:
      - 'data/reference-effects/**'
      - 'scripts/validate-reference-effect-provenance.cjs'
      - 'tests/reference-effect-provenance.test.cjs'
      - 'tests/reference-effect-compiler-gate.test.cjs'
      - 'tests/reference-effect-coverage.test.cjs'
      - 'tests/reference-effect-runtime-bundle.test.cjs'
      - 'tests/reference-effect-runtime-smoke.test.cjs'
      - 'tests/reference-effect-opening-actions.test.cjs'
      - 'tests/reference-effect-opening-rejection.test.cjs'
      - 'tests/reference-effect-cross-category.test.cjs'
      - 'tests/reference-effect-extended-gameplay.test.cjs'
      - 'tests/reference-effect-multi-turn.test.cjs'
      - 'ui/engine.bundle.js'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'engine/pokeca_reference_validation_adapter.cjs'
      - 'scripts/check-reference-bundle-sync.cjs'
      - 'scripts/build-pwa-release.cjs'
      - 'scripts/pwa-worker-template.js'
      - 'sw.js'
      - 'engine/reference-effect-plans.cjs'
      - 'scripts/report-reference-effect-coverage.cjs'
      - 'scripts/report-reference-effect-failure-causes.cjs'
      - 'tests/reference-effect-failure-causes.test.cjs'
      - 'scripts/report-reference-runtime-failures.cjs'
      - 'scripts/run-reference-effect-ci.cjs'
      - 'tests/reference-runtime-failure-causes.test.cjs'
      - '.github/workflows/reference-effect-provenance.yml'
  pull_request:
    paths:
      - 'data/reference-effects/**'
      - 'scripts/validate-reference-effect-provenance.cjs'
      - 'tests/reference-effect-provenance.test.cjs'
      - 'tests/reference-effect-compiler-gate.test.cjs'
      - 'tests/reference-effect-coverage.test.cjs'
      - 'tests/reference-effect-runtime-bundle.test.cjs'
      - 'tests/reference-effect-runtime-smoke.test.cjs'
      - 'tests/reference-effect-opening-actions.test.cjs'
      - 'tests/reference-effect-opening-rejection.test.cjs'
      - 'tests/reference-effect-cross-category.test.cjs'
      - 'tests/reference-effect-extended-gameplay.test.cjs'
      - 'tests/reference-effect-multi-turn.test.cjs'
      - 'ui/engine.bundle.js'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'engine/pokeca_reference_validation_adapter.cjs'
      - 'scripts/check-reference-bundle-sync.cjs'
      - 'scripts/build-pwa-release.cjs'
      - 'scripts/pwa-worker-template.js'
      - 'sw.js'
      - 'engine/reference-effect-plans.cjs'
      - 'scripts/report-reference-effect-coverage.cjs'
      - 'scripts/report-reference-effect-failure-causes.cjs'
      - 'tests/reference-effect-failure-causes.test.cjs'
      - 'scripts/report-reference-runtime-failures.cjs'
      - 'scripts/run-reference-effect-ci.cjs'
      - 'tests/reference-runtime-failure-causes.test.cjs'
      - '.github/workflows/reference-effect-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast reference effect runtime smoke test
        run: node scripts/run-reference-effect-ci.cjs tests/reference-effect-runtime-smoke.test.cjs
      - name: Group runtime failure causes for Codex
        if: always()
        run: node scripts/report-reference-runtime-failures.cjs reports/reference-effect-runtime.log reports/reference-effect-runtime-causes.json
      - name: Upload runtime failure handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-runtime-causes-smoke
          path: |
            reports/reference-effect-runtime-causes.json
            reports/reference-effect-runtime.log
          if-no-files-found: warn
  opening-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify opening attack restrictions and action families across seeds
        run: node scripts/run-reference-effect-ci.cjs tests/reference-effect-opening-actions.test.cjs
      - name: Group runtime failure causes for Codex
        if: always()
        run: node scripts/report-reference-runtime-failures.cjs reports/reference-effect-runtime.log reports/reference-effect-runtime-causes.json
      - name: Upload runtime failure handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-runtime-causes-opening-actions
          path: |
            reports/reference-effect-runtime-causes.json
            reports/reference-effect-runtime.log
          if-no-files-found: warn
  opening-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject illegal first-turn attacks across 200 matches without state mutation
        run: node scripts/run-reference-effect-ci.cjs tests/reference-effect-opening-rejection.test.cjs
      - name: Group runtime failure causes for Codex
        if: always()
        run: node scripts/report-reference-runtime-failures.cjs reports/reference-effect-runtime.log reports/reference-effect-runtime-causes.json
      - name: Upload runtime failure handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-runtime-causes-opening-rejection
          path: |
            reports/reference-effect-runtime-causes.json
            reports/reference-effect-runtime.log
          if-no-files-found: warn
  multi-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify multi-turn reference gameplay
        run: node scripts/run-reference-effect-ci.cjs tests/reference-effect-multi-turn.test.cjs
      - name: Group runtime failure causes for Codex
        if: always()
        run: node scripts/report-reference-runtime-failures.cjs reports/reference-effect-runtime.log reports/reference-effect-runtime-causes.json
      - name: Upload runtime failure handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-runtime-causes-multi-turn
          path: |
            reports/reference-effect-runtime-causes.json
            reports/reference-effect-runtime.log
          if-no-files-found: warn
  extended-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extended-gameplay reference gameplay
        run: node scripts/run-reference-effect-ci.cjs tests/reference-effect-extended-gameplay.test.cjs
      - name: Group runtime failure causes for Codex
        if: always()
        run: node scripts/report-reference-runtime-failures.cjs reports/reference-effect-runtime.log reports/reference-effect-runtime-causes.json
      - name: Upload runtime failure handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-runtime-causes-extended-gameplay
          path: |
            reports/reference-effect-runtime-causes.json
            reports/reference-effect-runtime.log
          if-no-files-found: warn
  cross-category:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cross-category reference gameplay
        run: node scripts/run-reference-effect-ci.cjs tests/reference-effect-cross-category.test.cjs
      - name: Group runtime failure causes for Codex
        if: always()
        run: node scripts/report-reference-runtime-failures.cjs reports/reference-effect-runtime.log reports/reference-effect-runtime-causes.json
      - name: Upload runtime failure handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-runtime-causes-cross-category
          path: |
            reports/reference-effect-runtime-causes.json
            reports/reference-effect-runtime.log
          if-no-files-found: warn
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reference print identity and provenance
        run: node scripts/validate-reference-effect-provenance.cjs
      - name: Verify invalid reference data is rejected
        run: node tests/reference-effect-provenance.test.cjs
      - name: Verify generalized effect compiler preserves source and reference scope
        run: node tests/reference-effect-compiler-gate.test.cjs
      - name: Inventory recognized and blocked effects across all card categories
        run: node scripts/report-reference-effect-coverage.cjs reports/reference-effect-coverage.json
      - name: Verify effect coverage accounting and blocked pattern grouping
        run: node tests/reference-effect-coverage.test.cjs
      - name: Write grouped failure causes for Codex handoff
        if: always()
        run: node scripts/report-reference-effect-failure-causes.cjs reports/reference-effect-failure-causes.json
      - name: Verify reproducible Codex handoff and safety invariants
        run: node tests/reference-effect-failure-causes.test.cjs
      - name: Verify runtime failure cause grouping and malformed-record safety stop
        run: node tests/reference-runtime-failure-causes.test.cjs
      - name: Ensure shipped engine bundle matches source modules
        run: node scripts/check-reference-bundle-sync.cjs
      - name: Ensure verified PWA release includes current engine hashes
        run: node scripts/build-pwa-release.cjs --check
      - name: Verify reference effect runtime in published browser engine bundle
        run: node scripts/run-reference-effect-ci.cjs tests/reference-effect-runtime-bundle.test.cjs
      - name: Build runtime failure cause handoff
        if: always()
        run: node scripts/report-reference-runtime-failures.cjs reports/reference-effect-runtime.log reports/reference-effect-runtime-causes.json
      - name: Upload effect coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-effect-coverage
          path: |
            reports/reference-effect-coverage.json
            reports/reference-effect-failure-causes.json
            reports/reference-effect-runtime-causes.json
            reports/reference-effect-runtime.log
          if-no-files-found: warn
