name: Reference effect provenance gate

on:
  push:
    branches: [main]
    paths:
      - 'data/reference-effects/**'
      - 'scripts/validate-reference-effect-provenance.cjs'
      - 'tests/reference-effect-provenance.test.cjs'
      - 'tests/reference-effect-compiler-gate.test.cjs'
      - 'tests/reference-effect-coverage.test.cjs'
      - 'tests/reference-effect-runtime-bundle.test.cjs'
      - 'tests/reference-effect-runtime-smoke.test.cjs'
      - 'tests/reference-effect-opening-actions.test.cjs'
      - 'ui/engine.bundle.js'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'engine/pokeca_reference_validation_adapter.cjs'
      - 'scripts/check-reference-bundle-sync.cjs'
      - 'scripts/build-pwa-release.cjs'
      - 'scripts/pwa-worker-template.js'
      - 'sw.js'
      - 'engine/reference-effect-plans.cjs'
      - 'scripts/report-reference-effect-coverage.cjs'
      - '.github/workflows/reference-effect-provenance.yml'
  pull_request:
    paths:
      - 'data/reference-effects/**'
      - 'scripts/validate-reference-effect-provenance.cjs'
      - 'tests/reference-effect-provenance.test.cjs'
      - 'tests/reference-effect-compiler-gate.test.cjs'
      - 'tests/reference-effect-coverage.test.cjs'
      - 'tests/reference-effect-runtime-bundle.test.cjs'
      - 'tests/reference-effect-runtime-smoke.test.cjs'
      - 'tests/reference-effect-opening-actions.test.cjs'
      - 'ui/engine.bundle.js'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'engine/pokeca_reference_validation_adapter.cjs'
      - 'scripts/check-reference-bundle-sync.cjs'
      - 'scripts/build-pwa-release.cjs'
      - 'scripts/pwa-worker-template.js'
      - 'sw.js'
      - 'engine/reference-effect-plans.cjs'
      - 'scripts/report-reference-effect-coverage.cjs'
      - '.github/workflows/reference-effect-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast reference effect runtime smoke test
        run: node tests/reference-effect-runtime-smoke.test.cjs
  opening-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify opening attack restrictions and action families across seeds
        run: node tests/reference-effect-opening-actions.test.cjs
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reference print identity and provenance
        run: node scripts/validate-reference-effect-provenance.cjs
      - name: Verify invalid reference data is rejected
        run: node tests/reference-effect-provenance.test.cjs
      - name: Verify generalized effect compiler preserves source and reference scope
        run: node tests/reference-effect-compiler-gate.test.cjs
      - name: Inventory recognized and blocked effects across all card categories
        run: node scripts/report-reference-effect-coverage.cjs reports/reference-effect-coverage.json
      - name: Verify effect coverage accounting and blocked pattern grouping
        run: node tests/reference-effect-coverage.test.cjs
      - name: Ensure shipped engine bundle matches source modules
        run: node scripts/check-reference-bundle-sync.cjs
      - name: Ensure verified PWA release includes current engine hashes
        run: node scripts/build-pwa-release.cjs --check
      - name: Verify reference effect runtime in published browser engine bundle
        run: node tests/reference-effect-runtime-bundle.test.cjs
      - name: Upload effect coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-effect-coverage
          path: reports/reference-effect-coverage.json
          if-no-files-found: warn
