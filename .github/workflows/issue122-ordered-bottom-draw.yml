name: 手札指定順山札下戻しドロー・全残件対戦検証
on:
  push:
    branches: [battle/issue122-ordered-bottom-draw-20261128]
    paths: ['.github/workflows/issue122-ordered-bottom-draw.yml']
  workflow_dispatch:
concurrency:
  group: issue122-ordered-bottom-draw
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" if(kind==='MAIN'&&entry.category==='supporter'&&generic==='このカードは、自分の手札を1枚トラッシュしなければ使えない。自分の手札が6枚になるように、山札を引く。')\",\"to\":\" const orderedBottomDraw=generic.match(/^自分の手札を([1-9])枚選び、好きな順番に入れ替えて、山札の下にもどす。その後、山札を([1-9])枚引く。\\\\(自分の手札を\\\\1枚もどせないなら、このカードは使えない。\\\\)$/);\\n if(kind==='MAIN'&&entry.category==='supporter'&&orderedBottomDraw)return {mechanic:'SUPPORTER_ORDERED_BOTTOM_DRAW',commands:['RETURN_TO_DECK','DRAW'],count:Number(orderedBottomDraw[1]),draw:Number(orderedBottomDraw[2]),sharedWording:true};\\n if(kind==='MAIN'&&entry.category==='supporter'&&generic==='このカードは、自分の手札を1枚トラッシュしなければ使えない。自分の手札が6枚になるように、山札を引く。')\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\" if(m==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX')cardRequest('discard',p.hand.filter(c=>id(c)!==id(card)),1,1);\",\"to\":\" if(m==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX')cardRequest('discard',p.hand.filter(c=>id(c)!==id(card)),1,1);\\n if(m==='SUPPORTER_ORDERED_BOTTOM_DRAW')cardRequest('cards',p.hand.filter(c=>id(c)!==id(card)),effect.plan.count,effect.plan.count);\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"   if(m==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX')\\n    assert(p.hand.some(c=>id(c)!==id(card)),'SUPPORTER_DISCARD_COST_REQUIRED');\",\"to\":\"   if(m==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX')\\n    assert(p.hand.some(c=>id(c)!==id(card)),'SUPPORTER_DISCARD_COST_REQUIRED');\\n   if(m==='SUPPORTER_ORDERED_BOTTOM_DRAW')assert(p.hand.filter(c=>id(c)!==id(card)).length>=r.mainPlan.count,'SUPPORTER_BOTTOM_COST_REQUIRED');\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"  case 'SUPPORTER_DISCARD_ONE_DRAW_TO_SIX':{\",\"to\":\"  case 'SUPPORTER_ORDERED_BOTTOM_DRAW':{\\n   const chosen=ids('cards'),moved=[];\\n   for(const ident of chosen){const index=p.hand.findIndex(c=>id(c)===ident);assert(index>=0,'SUPPORTER_BOTTOM_CARD_MISSING');moved.push(p.hand.splice(index,1)[0]);}\\n   p.deck.push(...moved);\\n   event(g,actor,'RETURN_TO_DECK',{cardIds:chosen,fromZone:'hand',position:'bottom',privateTo:actor});\\n   draw(g,p,plan.draw);break;\\n  }\\n  case 'SUPPORTER_DISCARD_ONE_DRAW_TO_SIX':{\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(m==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX'){\",\"to\":\"  if(m==='SUPPORTER_ORDERED_BOTTOM_DRAW'){\\n    const own=frame.game.players[0];\\n    while(own.hand.filter(c=>c.id!==frame.sourceId).length<e.plan.count){\\n      const donor=own.deck.shift();if(!donor)return {blocked:'NO_BOTTOM_COST_FIXTURE'};own.hand.push(donor);\\n    }\\n    if(own.deck.length<e.plan.draw)return {blocked:'NO_BOTTOM_DRAW_FIXTURE'};\\n  }\\n  if(m==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX'){\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(e.plan.mechanic==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX'){\",\"to\":\"  if(e.plan.mechanic==='SUPPORTER_ORDERED_BOTTOM_DRAW'){\\n    const action=t.action||o.action,chosen=action.selections.cards,own=before.players[0],resolved=after.players[0],plan=e.plan;\\n    assert.equal(chosen.length,plan.count);\\n    assert.deepEqual(Array.from(resolved.deck,c=>c.id),[...Array.from(own.deck.slice(plan.draw),c=>c.id),...chosen]);\\n    assert.deepEqual(Array.from(resolved.hand,c=>c.id),[...Array.from(own.hand.filter(c=>c.id!==action.cardId&&!chosen.includes(c.id)),c=>c.id),...Array.from(own.deck.slice(0,plan.draw),c=>c.id)]);\\n    const reverse=port(before);assert(reverse.dispatch('you',{...action,selections:{...action.selections,cards:[...chosen].reverse()}}).ok);\\n    assert.deepEqual(Array.from(reverse.getSnapshot().players[0].deck.slice(-plan.count),c=>c.id),[...chosen].reverse());\\n    const invalid=port(before);assert.equal(invalid.dispatch('you',{...action,selections:{...action.selections,cards:chosen.slice(1)}}).ok,false);\\n    assert.equal(JSON.stringify(B.canonical(invalid.getSnapshot())),JSON.stringify(B.canonical(before)));\\n    assert.deepEqual(Array.from(S.identities(before)),Array.from(S.identities(after)));\\n  }\\n  if(e.plan.mechanic==='SUPPORTER_DISCARD_ONE_DRAW_TO_SIX'){\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"   if m=='TOOL_LOW_HP_RETREAT_DISCOUNT':\",\"to\":\"   if m=='SUPPORTER_ORDERED_BOTTOM_DRAW':\\n    action=option['action'];chosen=action['selections']['cards'];plan=f['e']['plan']\\n    own=before['players'][0];resolved=after['players'][0]\\n    assert len(chosen)==plan['count']\\n    assert [c['id'] for c in resolved['deck']]==[c['id'] for c in own['deck'][plan['draw']:]]+chosen\\n    assert [c['id'] for c in resolved['hand']]==[c['id'] for c in own['hand'] if c['id']!=action['cardId'] and c['id'] not in chosen]+[c['id'] for c in own['deck'][:plan['draw']]]\\n   if m=='TOOL_LOW_HP_RETREAT_DISCOUNT':\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Print exact evolution target diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def visit(x,p):
              if isinstance(x,dict):
                  slot=x.get('slot')
                  if isinstance(slot,str) and any(slot.startswith(i+':') for i in ('46038','46173','49436')) and x.get('status') in ('FAILED','BLOCKED'):
                      print(p,json.dumps(x,ensure_ascii=False)[:5000])
                  for v in x.values(): visit(v,p)
              elif isinstance(x,list):
                  for v in x: visit(v,p)
          for p in pathlib.Path('work/card-auto-connect').rglob('*.json'):
              try: visit(json.loads(p.read_text()),str(p))
              except (ValueError,OSError): pass
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=["46038","46173","49436"].filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,added,missing,count:added.length};fs.writeFileSync('artifacts/ordered-bottom-draw-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          export POKECA_BROWSER_SHARD_COUNT=4
          export POKECA_BROWSER_SLOTS_ONLY=1
          pids=()
          for shard in 0 1 2 3; do
            POKECA_BROWSER_SHARD_INDEX="$shard" POKECA_INTAKE_ARTIFACT="ordered-bottom-draw-$shard" python tests/test_control_013_browser.py >"artifacts/ordered-bottom-draw-$shard.log" 2>&1 &
            pids+=("$!")
          done
          rv=0
          for pid in "${pids[@]}"; do wait "$pid" || rv=1; done
          for f in artifacts/ordered-bottom-draw-*.log; do tail -n 15 "$f"; done
          test "$rv" = 0
          unset POKECA_BROWSER_SLOTS_ONLY
          POKECA_BROWSER_SHARD_INDEX=0 POKECA_INTAKE_ARTIFACT=ordered-bottom-draw-full-ai python tests/test_control_013_browser.py >artifacts/ordered-bottom-draw-full-ai.log 2>&1 || { tail -n 30 artifacts/ordered-bottom-draw-full-ai.log; exit 1; }
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/ordered-bottom-draw-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/ordered-bottom-draw-candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified ordered bottom draw'
          ref="HEAD:refs/heads/battle/issue122-ordered-bottom-draw-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordered-bottom-draw-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
