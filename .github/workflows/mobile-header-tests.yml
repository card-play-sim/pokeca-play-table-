name: Mobile header layout checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui/mobile.css'
      - 'ui/mobile.js'
      - 'tests/test_mobile_header_layout.py'
      - '.github/workflows/mobile-header-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'ui/mobile.css'
      - 'ui/mobile.js'
      - 'tests/test_mobile_header_layout.py'
      - '.github/workflows/mobile-header-tests.yml'
  workflow_dispatch:

jobs:
  header-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Check fixed-height header diagnostics contract
        run: python3 -m unittest discover -s tests -p 'test_mobile_header_layout.py' -v
