name: Official image real browser load
on:
  push:
    branches: [main]
    paths:
      - 'data/official-image-registry.json'
      - 'tests/image-browser-load.mjs'
      - '.github/workflows/image-browser-load.yml'
  pull_request:
    paths:
      - 'tests/image-browser-load.mjs'
      - 'data/official-image-registry.json'
      - '.github/workflows/image-browser-load.yml'
  workflow_dispatch:
jobs:
  chromium-official-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to serve this app release
        if: github.event_name != 'pull_request'
        env:
          RELEASE_VERIFY_ATTEMPTS: '16'
          RELEASE_VERIFY_INTERVAL_MS: '10000'
        run: node scripts/verify-published-pwa.cjs
      - name: Load every registered real official image URL in Chromium
        env:
          POKECA_TEST_URL: ${{ github.event_name != 'pull_request' && 'https://card-play-sim.github.io/pokeca-play-table-/' || '' }}
        run: node tests/image-browser-load.mjs
      - name: Preserve per-card image loading results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-image-browser-load-report
          path: artifacts/image-browser-load-report.json
          if-no-files-found: warn
