name: Official image real browser load
on:
  push:
    branches: [main]
    paths:
      - 'data/official-image-registry.json'
      - 'tests/image-browser-load.mjs'
      - '.github/workflows/image-browser-load.yml'
  pull_request:
    paths:
      - 'tests/image-browser-load.mjs'
      - 'data/official-image-registry.json'
      - '.github/workflows/image-browser-load.yml'
  workflow_dispatch:
jobs:
  chromium-official-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to serve this app release
        if: github.event_name != 'pull_request'
        env:
          RELEASE_VERIFY_ATTEMPTS: '16'
          RELEASE_VERIFY_INTERVAL_MS: '10000'
        run: node scripts/verify-published-pwa.cjs
      - name: Verify every official image in the candidate gallery
        if: github.event_name == 'pull_request'
        env:
          POKECA_TEST_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pokeca-image-gallery-http.log 2>&1 &
          gallery_server=$!
          trap 'kill "$gallery_server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused "$POKECA_TEST_URL" > /dev/null
          node tests/image-browser-load.mjs
      - name: Verify every official image in the published gallery
        if: github.event_name != 'pull_request'
        env:
          POKECA_TEST_URL: https://card-play-sim.github.io/pokeca-play-table-/
        run: node tests/image-browser-load.mjs
      - name: Preserve per-card image loading results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-image-browser-load-report
          path: artifacts/image-browser-load-report.json
          if-no-files-found: warn
