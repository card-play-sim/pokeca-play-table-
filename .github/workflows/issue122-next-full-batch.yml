name: Issue122 next full battle batch with cumulative new common mechanics
on:
  push:
    branches: [battle/issue122-next-full-batch-20261125, parallel/05-integration]
    paths:
      - '.github/workflows/issue122-next-full-batch.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue122-next-full-batch
  cancel-in-progress: false
jobs:
  all-remaining:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      INTAKE_LIMIT: '10000'
      POKECA_INTAKE_REQUESTED_TARGETS: ${{ github.ref_name == 'parallel/05-integration' && '47779,48437,50421,50441,50460,47705,48077,46284,50040,46287,49392,46032,49394,46031,49393,46817,49402,46440,49409,46439,49401,45181,45182,48399,46270,47016,50234,50315,46002,47802,48450,48739,50557,50614,47352,49375,48413,50204,50783,47622,47902,48714,49455,45217,49711,50545,50167,50299,50300,50470,50346,46525,50583,48347,48487,45744,45745,47754,50101,46262,49129,47770,45752,45789,45866,49437,45799,46283,48692,49979,50008,50296,50330,47105,48703,46228,48261,47107,48708,45287,47289,47100,48689,49406,50403,50540,48415,48509,48686,48685,50265,50319,50334,50338,47771,48436,48446,47608,47976,45921,49259,46402,47702,47876,48673,50206,47103,47242,48414,48507,46285,45755,45852,46751,49142,47108,47252,49453,46035,49400,50292,50326,48278,48510,47497,48484,45633,45642,46293,49456,49695,50648,47784,49251,47689,48060,49224,49656,50051,48392,50831,45877,48766,45258,45559,45567,45572,49145,46427,50036,47468,47511,50166,50547,45790,46841,48419,48514,46034,46033,46813,49396,49606,49416,50602,50849,49707,50073,50401,45988,48635,49642,47445,45243,48389,47447,45398,46001,47664,48074,48082,47555,47928,48840,46394,49048,47031,48893,45230,46673,47588,47957,48789,49106,50165,50546,45639,49454,50407,50543,50553,46435,49362,50408,50544,45634,45680,46197,50256,50308,45905,49170,47553,47926,47420,47826,48542,48366,49639,46823,47109,49411,46434,49361,46436,49365,46282,45784,46810,49380,50931,50295,50329,50336,50930,47096,49350,50273,50310,50088,46024,46186,50289,50325' || '' }}
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and resume exact saved official evidence
        run: |
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          python -m py_compile tests/test_control_013_browser.py
          # Start from the persisted, verified 91-print checkpoint, not an older snapshot.
          node tests/issue122-ability-cost-draw.test.cjs
          python -m unittest discover -s tests -p test_restore_official_intake_evidence.py
          node tests/intake-checkpoint-recovery-contract.test.cjs
          node tests/issue122-official-facts-refresh.test.cjs
          node scripts/refresh-uncompiled-official-facts.cjs --apply
          node tests/control-014-official-parser.test.cjs
          node tests/atomic-official-to-battle.test.cjs
          node tests/issue122-counter-picker-ui.test.cjs
      - name: Execute all remaining IDs through existing atomic official-to-battle pipeline
        run: |
          if [ "$GITHUB_REF_NAME" = parallel/05-integration ]; then
            node tests/issue291-attack-conditional-damage-replacement.test.cjs
            node tests/issue291-active-top-energy-ability.test.cjs
            node tests/parallel04-typed-berry.test.cjs
            node tests/issue291-attack-self-status-coin-protection.test.cjs
            node tests/issue291-energy-conditional-ability.test.cjs
            node tests/parallel04-special-energy.test.cjs
            node tests/issue291-retreat-mega-ability.test.cjs
            node tests/issue291-next-coin-gate-cost.test.cjs
            node tests/parallel04-continuous-trainer.test.cjs
            node tests/issue291-direct-knockout.test.cjs
            node tests/issue291-conditional-damage-ability.test.cjs
            node tests/parallel04-attached-reactions.test.cjs
            node tests/issue291-coin-deck-select.test.cjs
            node tests/issue291-attack-retaliation.test.cjs
            node tests/parallel04-guard-and-cost.test.cjs
            node tests/issue291-board-conditions.test.cjs
            node tests/issue291-cost-lock-hp-ability.test.cjs
            node tests/parallel04-self-attack-recycle.test.cjs
            node tests/issue291-board-thresholds.test.cjs
            node tests/issue291-board-bench-retreat.test.cjs
          fi
          node scripts/run-atomic-official-battle-intake.cjs
      - name: Verify candidate exact-print browser gameplay
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/intake-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE="$GITHUB_SHA"
          export POKECA_INTAKE_LOCAL_CANDIDATE=1
          export POKECA_BROWSER_SHARD_COUNT=4
          if [ "$GITHUB_REF_NAME" != parallel/05-integration ]; then export POKECA_BROWSER_SLOTS_ONLY=1; fi
          pids=()
          mkdir -p artifacts
          for shard in 0 1 2 3; do
            POKECA_BROWSER_SHARD_INDEX="$shard" POKECA_INTAKE_ARTIFACT="all-remaining-$shard" python tests/test_control_013_browser.py > "artifacts/all-remaining-shard-$shard.log" 2>&1 &
            pids+=("$!")
          done
          rv=0
          for pid in "${pids[@]}"; do wait "$pid" || rv=1; done
          for logfile in artifacts/all-remaining-shard-*.log; do tail -n 25 "$logfile"; done
          exit "$rv"
      - name: Persist battle-qualified candidate on isolated branch only
        if: success()
        run: |
          git diff --check
          mkdir -p reports/official-effect-continuation
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/next-full-batch-candidate.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference-effects/plans.json data/effect-extensions/intake.json data/effect-extensions/compiled.json data/effect-extensions/evidence data/official-effect-intake ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          if ! git diff --cached --quiet; then
            git commit -m 'checkpoint: cumulative new mechanics with complete candidate Chromium verification'
            case "$GITHUB_REF_NAME" in
              parallel/05-integration) git push origin HEAD:parallel/05-integration ;;
              battle/issue122-next-full-batch-20261125) git push origin HEAD:battle/issue122-next-full-batch-20261125 ;;
              *) exit 1 ;;
            esac
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue122-next-full-batch-evidence
          path: |
            work/card-auto-connect/
            artifacts/all-remaining-*
            reports/official-effect-continuation/
            data/official-effect-intake/checkpoint.json
            test-results/
          if-no-files-found: warn
          retention-days: 90
