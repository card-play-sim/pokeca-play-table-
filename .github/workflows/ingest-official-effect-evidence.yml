name: Ingest official effect evidence (durable checkpoints)

on:
  push:
    branches: [main]
    paths:
      - 'reports/incoming-effect-evidence/*.ndjson'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-effect-evidence-registry
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check importer and task-builder regression tests
        run: |
          set -e
          node tests/official-effect-import.test.cjs
          node tests/official-effect-codex-batch.test.cjs
          node tests/select-codex-shared-effect-task.test.cjs
          node tests/official-effect-pipeline.test.cjs
      - name: Import all submitted records, checkpointing each verified row
        id: import
        continue-on-error: true
        run: |
          set -e
          shopt -s nullglob
          inputs=(reports/incoming-effect-evidence/*.ndjson)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::notice::No incoming evidence files to import"
            exit 0
          fi
          for input in "${inputs[@]}"; do
            node scripts/import-official-effect-evidence.cjs "$input" data/official-effect-evidence.json --checkpoint
          done
          node scripts/build-official-effect-codex-batch.cjs data/official-effect-evidence.json reports/work-effect-codex-batch.json
          node -e "const b=require('./reports/work-effect-codex-batch.json');if(b.status!=='READY_FOR_CODEX_REVIEW'||b.counts.blocked)throw Error('BLOCKED_EFFECT_EVIDENCE');"
      - name: Preserve verified registry as a recoverable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-effect-evidence-checkpoint
          path: data/official-effect-evidence.json
          if-no-files-found: ignore
      - name: Corroborate effect text against official card pages
        id: official
        if: steps.import.outcome == 'success' && hashFiles('data/official-effect-evidence.json') != ''
        continue-on-error: true
        run: node scripts/verify-official-effect-pages.cjs data/official-effect-evidence.json reports/official-page-verification.json
      - name: Preserve official-page verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-effect-page-verification
          path: reports/official-page-verification.json
          if-no-files-found: ignore
      - name: Commit only the verified registry
        if: steps.import.outcome == 'success' && steps.official.outcome == 'success'
        run: |
          set -e
          if [ ! -f data/official-effect-evidence.json ]; then exit 0; fi
          git add data/official-effect-evidence.json
          if git diff --cached --quiet; then
            echo "::notice::All incoming effect records already registered"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register verified official effect evidence"
          git push origin HEAD:main
      - name: Report failed ingestion after preserving valid checkpoints
        if: steps.import.outcome == 'failure'
        run: |
          echo "::error::Ingestion failed. Valid rows were preserved as a checkpoint artifact for review, but were not committed."
          exit 1
      - name: Fail when official-page corroboration is incomplete
        if: steps.official.outcome == 'failure'
        run: |
          echo "::error::Official-page corroboration failed. Registry was not published."
          exit 1
