name: Refresh verified PWA release manifest
on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/engine.bundle.js'
      - 'ui/mobile.css'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'engine/reference-effect-plans.cjs'
      - 'tests/reference-runtime-source-parity.test.cjs'
      - '.github/workflows/refresh-pwa-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompile canonical reference effect plans and runtime bundle
        run: node scripts/sync-reference-effects.cjs
      - name: Rebuild byte-verified service worker manifest
        run: node scripts/build-pwa-release.cjs
      - name: Verify canonical reference bundle and release manifest
        run: |
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: Reject stale generated artifacts without changing PR head
        run: |
          if ! git diff --quiet -- sw.js ui/engine.bundle.js data/reference-effects/plans.json; then
            echo 'Generated PWA artifacts are stale. Regenerate and commit them from the author branch.' >&2
            git diff --stat -- sw.js ui/engine.bundle.js data/reference-effects/plans.json
            exit 1
          fi
