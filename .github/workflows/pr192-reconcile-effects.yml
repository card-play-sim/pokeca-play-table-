name: PR192 reconcile fail-closed official effects and PWA
on:
  push:
    branches: [battle/official-shared-bulk-218-20261124]
    paths:
      - '.github/workflows/pr192-reconcile-effects.yml'
      - 'scripts/parse-official-pokemon-energy.cjs'
      - 'scripts/reconcile-pr192-effect-extensions.cjs'
      - 'scripts/build-effect-extensions.cjs'
      - 'data/effect-extensions/evidence/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: battle/official-shared-bulk-218-20261124
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile only exact official print proofs and audit changes
        run: |
          node --check scripts/reconcile-pr192-effect-extensions.cjs
          node scripts/reconcile-pr192-effect-extensions.cjs
          node scripts/build-effect-extensions.cjs --check
      - name: Generate source-synchronized runtime and offline PWA manifest
        run: |
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: Run full registered-effect engine verification
        run: |
          node tests/control-011-engine-batch.test.cjs
          node tests/battle-rocket-team-exact-print.test.cjs
          node tests/reference-runtime-source-parity.test.cjs
      - name: Commit only reproducible generated output and its audit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep the reconciliation audit as an uploaded artifact. Do not
          # create a bot-only commit merely because an audit was refreshed:
          # GitHub requires human-app-authored PR commits for required checks.
          git add data/effect-extensions/compiled.json data/reference-effects/plans.json ui/engine.bundle.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: regenerate provenance-checked effect data and PWA bundle for PR192'
            git push origin HEAD:battle/official-shared-bulk-218-20261124
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr192-reconciliation-audit
          path: reports/official-effect-continuation/pr192-derived-reconciliation.json
          if-no-files-found: warn
