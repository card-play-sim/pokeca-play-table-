name: Build named-attack shared effects
on:
  push:
    branches: [feat/battle-mass-named-attack-lock-20261123]
    paths:
      - 'engine/reference-effect-plans.cjs'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'scripts/lib/shared-effect-engine-worker.cjs'
      - 'tests/battle-mass-named-attack-lock.test.cjs'
      - '.github/workflows/battle-bulk-named-attack-lock-build.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/battle-mass-named-attack-lock-20261123
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-match shared effects against all historical official blocked groups
        run: |
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          node tests/battle-mass-shared-attacks.test.cjs
          node tests/battle-mass-named-attack-lock.test.cjs
      - name: Rebuild all exact official print effects and published battle engine
        run: |
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
          node tests/battle-mass-named-attack-lock.test.cjs
      - name: Preserve rebuilt artifacts on review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/effect-extensions/compiled.json data/reference-effects/plans.json ui/engine.bundle.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: exact official named-attack restrictions and shared battle PWA'
            git push origin HEAD:feat/battle-mass-named-attack-lock-20261123
          fi
