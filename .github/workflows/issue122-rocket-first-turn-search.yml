name: 先攻初回サポート共通効果・並列回帰検証
on:
  push:
    branches: [battle/issue122-rocket-first-turn-search-20261128]
    paths: ['.github/workflows/issue122-rocket-first-turn-search.yml']
  workflow_dispatch:
concurrency:
  group: issue122-rocket-first-turn-search
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_INTAKE_REQUESTED_TARGETS: '47488,47527,48702,49451'
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58e9c7d89ee6e9ece08abc64fa5cecc5baf5af7c HEAD
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" const firstTurnDraw=generic.match(\",\"to\":\" if(kind==='MAIN'&&entry.category==='supporter'&&generic==='このカードは、先攻プレイヤーの最初の番でも使える。自分の山札からたねポケモンの「ロケット団のポケモン」を3枚まで選び、相手に見せて、手札に加える。そして山札を切る。')\\n  return {mechanic:'MASS_ZONE_TRANSFER',commands:['SEARCH_DECK','REVEAL','ADD_TO_HAND','SHUFFLE_DECK'],zone:'deck',destination:'hand',category:'pokemon',type:null,stage:0,team:'ロケット団',limit:3,activeOnly:false,firstTurnAllowed:true,sharedWording:true};\\n const firstTurnDraw=generic.match(\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"(g.turnNumber!==1||r.mainPlan.mechanic==='SUPPORTER_FIRST_TURN_DISCARD_HAND_DRAW')\",\"to\":\"(g.turnNumber!==1||r.mainPlan.mechanic==='SUPPORTER_FIRST_TURN_DISCARD_HAND_DRAW'||r.mainPlan.mechanic==='MASS_ZONE_TRANSFER'&&r.mainPlan.firstTurnAllowed===true)\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    assert(ids.every(id=>own[plan.zone].some(c=>c.id===id&&massTransferCandidate(c,plan))));\",\"to\":\"    assert(ids.every(id=>own[plan.zone].some(c=>c.id===id&&massTransferCandidate(c,plan))));\\n    if(plan.firstTurnAllowed){\\n      assert.equal(action.type,'play_supporter');\\n      const first=structuredClone(before);first.turnNumber=1;first.players[0].turnLimits.supporterUsed=false;\\n      const replay=port(first);assert(replay.dispatch('you',action).ok);\\n      const end=replay.getSnapshot();\\n      assert.equal(end.turnNumber,1);assert.equal(end.turnPlayer,first.turnPlayer);\\n      assert(end.players[0].turnLimits.supporterUsed);\\n      assert(ids.every(id=>end.players[0].hand.some(c=>c.id===id)));\\n      assert.deepEqual(S.identities(first),S.identities(end));\\n      assert(replay.restoreSession(replay.getResumeSnapshot()).ok);\\n      assert.deepEqual(replay.getSnapshot(),end);\\n      const used=structuredClone(first);used.players[0].turnLimits.supporterUsed=true;\\n      const denied=port(used);assert.equal(denied.dispatch('you',action).ok,false);assert.deepEqual(denied.getSnapshot(),used);\\n    }\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"    assert picked and picked<={card['id'] for card in before['players'][0][plan['zone']]}\",\"to\":\"    assert picked and picked<={card['id'] for card in before['players'][0][plan['zone']]}\\n    if plan.get('firstTurnAllowed'):\\n     assert option['action']['type']=='play_supporter'\\n     assert after['players'][0]['turnLimits']['supporterUsed']\\n     assert after['turnNumber']==before['turnNumber']\\n     assert await page.evaluate(\\\"cards=>cards.every(c=>{const r=Pokeca.getReferenceEffectRecord(c);return r.facts.basic&&r.name.startsWith('ロケット団の');})\\\",[c for c in before['players'][0]['deck'] if c['id'] in picked])\"},{\"path\":\"scripts/run-atomic-official-battle-intake.cjs\",\"from\":\"'use strict';\\n// The official page, its parsed effects, common plans, real engine execution,\\n// print-specific release and regression checks are ONE repeatable work unit.\\n// A fetch/compile success alone never finishes a card.\\nconst {spawnSync}=require('node:child_process');\\nconst path=require('node:path');\\nconst work='work/card-auto-connect';\\nconst idFile='/tmp/official-update-ids.json';\\nfunction commands({limit,base}) {\\n  if (!Number.isSafeInteger(limit) || limit < 1 || limit > 10000)\\n    throw Error('INVALID_ATOMIC_BATCH_LIMIT');\\n  if (!/^[a-f0-9]{40}$/.test(base)) throw Error('INVALID_ATOMIC_BASE_SHA');\\n  return [\\n    ['SELECT_EXACT_OFFICIAL_PRINTS','node',['scripts/list-card-auto-connect-ids.cjs',idFile]],\\n    // Automatically repair outdated derived facts using the already saved,\\n    // hash-verified official HTML, before compiling or retrying the same cards.\\n    // The refresh helper never modifies any previously compiled print.\\n    ['VERIFY_OFFICIAL_FACT_REPAIR_CONTRACT','node',['tests/issue122-official-facts-refresh.test.cjs']],\\n    ['REPAIR_UNCOMPILED_FACTS_FROM_OFFICIAL_EVIDENCE','node',['scripts/refresh-uncompiled-official-facts.cjs','--apply']],\\n    ['FETCH_PARSE_AND_COMPILE_WITH_SHARED_ENGINE','python',[\\n      'scripts/continue-official-effect-intake.py','--limit',String(limit),\\n      '--adopt','--retry-transient','--ids',idFile,'--classification-only']],\\n    ['EXECUTE_ALL_CARD_EFFECTS_IN_REAL_ENGINE','node',[\\n      'scripts/stage-card-auto-connect.cjs',base,work]],\\n    // Restore the prior compiled artifact, not the official source evidence.\\n    // The rebuilt artifact contains only runtime-qualified new printings.\\n    ['RESTORE_BASE_RELEASE','git',['restore','--source=HEAD','--','data/effect-extensions/compiled.json']],\\n    ['COMPILE_ONLY_ENGINE_QUALIFIED_PRINTS','node',['scripts/build-effect-extensions.cjs']],\\n    ['BUNDLE_ACTUAL_SHARED_RUNTIME','node',['scripts/sync-reference-effects.cjs']],\\n    ['REPORT_EXACT_PRINT_COVERAGE','node',['scripts/report-ij-effect-coverage.cjs',\\n      'reports/ij-effect-coverage.json','reports/ij-effect-executions.json']],\\n    ['BUILD_PUBLIC_RELEASE','node',['scripts/build-pwa-release.cjs']],\\n    ['CREATE_REAL_BATTLE_VERIFICATION_FIXTURES','node',['scripts/build-intake-verification-fixtures.cjs']],\\n    // A fetched card that has no mechanic is not completed. It remains in the\\n    // SAME work ledger, with an exact-source shared-mechanic implementation group.\\n    ['RETAIN_UNRESOLVED_CARDS_IN_ATOMIC_WORK_UNIT','node',[\\n      'scripts/atomic-battle-connection-ledger.cjs',idFile,\\n      path.join(work,'candidate.json'),\\n      'reports/official-effect-continuation/atomic-battle-connection.json']],\\n    ...[\\n      'tests/control-013-continuation.test.cjs',\\n      'tests/control-014-shared-effects.test.cjs',\\n      'tests/control-014-official-parser.test.cjs',\\n      'tests/control-008-extensions.test.cjs',\\n      'tests/control-009-expansion.test.cjs',\\n      'tests/control-010-effects.test.cjs',\\n      'tests/control-011-engine-batch.test.cjs',\\n      'tests/atomic-official-to-battle.test.cjs'\\n    ].map(test=>['FULL_REGRESSION:'+test,'node',[test]]),\\n    ['CHECK_SHARED_RUNTIME_BUNDLE','node',['scripts/sync-reference-effects.cjs','--check']],\\n    ['CHECK_PUBLISHED_PWA_BUNDLE','node',['scripts/build-pwa-release.cjs','--check']]\\n  ];\\n}\\nfunction run(command,args,env) {\\n  const result=spawnSync(command,args,{stdio:'inherit',env});\\n  if (result.error) throw result.error;\\n  if (result.status!==0) throw Error('ATOMIC_BATTLE_STEP_FAILED '+command+' '+args.join(' ')+' EXIT '+result.status);\\n}\\nfunction main() {\\n  const limit=Number(process.env.INTAKE_LIMIT || '400');\\n  const rev=spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'});\\n  if (rev.status!==0) throw Error('REPOSITORY_COMMIT_REQUIRED');\\n  const base=rev.stdout.trim();\\n  const steps=commands({limit,base});\\n  if (process.argv.includes('--plan')) {\\n    console.log(JSON.stringify({scope:'ONE_OFFICIAL_CARD_TO_BATTLE_WORK_UNIT',\\n      steps:steps.map(([name,command,args])=>({name,command,args}))},null,2));\\n    return;\\n  }\\n  for (const [name,command,args] of steps) {\\n    console.log('ATOMIC_BATTLE_STEP_START '+name);\\n    const env={...process.env};\\n    if(name==='CREATE_REAL_BATTLE_VERIFICATION_FIXTURES') {\\n      env.POKECA_INTAKE_RELEASE_BASE=base;\\n      env.POKECA_INTAKE_PREFIX=work+'/browser';\\n    }\\n    run(command,args,env);\\n    console.log('ATOMIC_BATTLE_STEP_PASS '+name);\\n  }\\n  console.log('ATOMIC_BATTLE_INTAKE_COMPLETE: verified release candidate and unresolved mechanic work remain linked; published gameplay pending');\\n}\\nif(require.main===module)main();\\nmodule.exports={commands};\\n\",\"to\":\"'use strict';\\n// The official page, its parsed effects, common plans, real engine execution,\\n// print-specific release and regression checks are ONE repeatable work unit.\\n// A fetch/compile success alone never finishes a card.\\nconst {spawnSync,spawn}=require('node:child_process');\\nconst path=require('node:path');\\nconst work='work/card-auto-connect';\\nconst idFile='/tmp/official-update-ids.json';\\nfunction commands({limit,base}) {\\n  if (!Number.isSafeInteger(limit) || limit < 1 || limit > 10000)\\n    throw Error('INVALID_ATOMIC_BATCH_LIMIT');\\n  if (!/^[a-f0-9]{40}$/.test(base)) throw Error('INVALID_ATOMIC_BASE_SHA');\\n  return [\\n    ['SELECT_EXACT_OFFICIAL_PRINTS','node',['scripts/list-card-auto-connect-ids.cjs',idFile]],\\n    // Automatically repair outdated derived facts using the already saved,\\n    // hash-verified official HTML, before compiling or retrying the same cards.\\n    // The refresh helper never modifies any previously compiled print.\\n    ['VERIFY_OFFICIAL_FACT_REPAIR_CONTRACT','node',['tests/issue122-official-facts-refresh.test.cjs']],\\n    ['REPAIR_UNCOMPILED_FACTS_FROM_OFFICIAL_EVIDENCE','node',['scripts/refresh-uncompiled-official-facts.cjs','--apply']],\\n    ['FETCH_PARSE_AND_COMPILE_WITH_SHARED_ENGINE','python',[\\n      'scripts/continue-official-effect-intake.py','--limit',String(limit),\\n      '--adopt','--retry-transient','--ids',idFile,'--classification-only']],\\n    ['EXECUTE_ALL_CARD_EFFECTS_IN_REAL_ENGINE','node',[\\n      'scripts/stage-card-auto-connect.cjs',base,work]],\\n    // Restore the prior compiled artifact, not the official source evidence.\\n    // The rebuilt artifact contains only runtime-qualified new printings.\\n    ['RESTORE_BASE_RELEASE','git',['restore','--source=HEAD','--','data/effect-extensions/compiled.json']],\\n    ['COMPILE_ONLY_ENGINE_QUALIFIED_PRINTS','node',['scripts/build-effect-extensions.cjs']],\\n    ['BUNDLE_ACTUAL_SHARED_RUNTIME','node',['scripts/sync-reference-effects.cjs']],\\n    ['REPORT_EXACT_PRINT_COVERAGE','node',['scripts/report-ij-effect-coverage.cjs',\\n      'reports/ij-effect-coverage.json','reports/ij-effect-executions.json']],\\n    ['BUILD_PUBLIC_RELEASE','node',['scripts/build-pwa-release.cjs']],\\n    ['CREATE_REAL_BATTLE_VERIFICATION_FIXTURES','node',['scripts/build-intake-verification-fixtures.cjs']],\\n    // A fetched card that has no mechanic is not completed. It remains in the\\n    // SAME work ledger, with an exact-source shared-mechanic implementation group.\\n    ['RETAIN_UNRESOLVED_CARDS_IN_ATOMIC_WORK_UNIT','node',[\\n      'scripts/atomic-battle-connection-ledger.cjs',idFile,\\n      path.join(work,'candidate.json'),\\n      'reports/official-effect-continuation/atomic-battle-connection.json']],\\n    ...[\\n      'tests/control-013-continuation.test.cjs',\\n      'tests/control-014-shared-effects.test.cjs',\\n      'tests/control-014-official-parser.test.cjs',\\n      'tests/control-008-extensions.test.cjs',\\n      'tests/control-009-expansion.test.cjs',\\n      'tests/control-010-effects.test.cjs',\\n      'tests/control-011-engine-batch.test.cjs',\\n      'tests/atomic-official-to-battle.test.cjs'\\n    ].map(test=>['FULL_REGRESSION:'+test,'node',[test]]),\\n    ['CHECK_SHARED_RUNTIME_BUNDLE','node',['scripts/sync-reference-effects.cjs','--check']],\\n    ['CHECK_PUBLISHED_PWA_BUNDLE','node',['scripts/build-pwa-release.cjs','--check']]\\n  ];\\n}\\nfunction run(command,args,env) {\\n  const result=spawnSync(command,args,{stdio:'inherit',env});\\n  if (result.error) throw result.error;\\n  if (result.status!==0) throw Error('ATOMIC_BATTLE_STEP_FAILED '+command+' '+args.join(' ')+' EXIT '+result.status);\\n}\\n// Only the continuation test writes the durable collector queue. Run it\\n// alongside independent, read-only engine tests with separate result files.\\n// Parser and ledger contracts still run afterwards, against stable outputs.\\nfunction regressionLanes(steps) {\\n  const concurrent=new Set([\\n    'tests/control-014-shared-effects.test.cjs',\\n    'tests/control-008-extensions.test.cjs',\\n    'tests/control-009-expansion.test.cjs',\\n    'tests/control-010-effects.test.cjs',\\n    'tests/control-011-engine-batch.test.cjs'\\n  ]);\\n  const primary=[],secondary=[],after=[];\\n  for(const step of steps){\\n    if(step[2][0]==='tests/control-013-continuation.test.cjs')primary.push(step);\\n    else if(concurrent.has(step[2][0]))secondary.push(step);\\n    else after.push(step);\\n  }\\n  return {primary,secondary,after};\\n}\\nfunction runAsyncStep([name,command,args],env){\\n  return new Promise((resolve,reject)=>{\\n    const started=Date.now();\\n    console.log('ATOMIC_BATTLE_STEP_START '+name);\\n    const child=spawn(command,args,{stdio:'inherit',env});\\n    child.once('error',reject);\\n    child.once('close',(code,signal)=>{\\n      if(code!==0)return reject(Error('ATOMIC_BATTLE_STEP_FAILED '+name+' EXIT '+code+' SIGNAL '+signal));\\n      console.log('ATOMIC_BATTLE_STEP_PASS '+name+' elapsedMs='+ (Date.now()-started));\\n      resolve();\\n    });\\n  });\\n}\\nasync function parallelRegression(steps,env,execute=runAsyncStep){\\n  const {primary,secondary,after}=regressionLanes(steps);\\n  const start=Date.now();\\n  const lane=async rows=>{for(const row of rows)await execute(row,env);};\\n  // All active children must settle before this stage exits. Never continue\\n  // to bundle or publication on a failed regression, even if its peer passes.\\n  const results=await Promise.allSettled([lane(primary),lane(secondary)]);\\n  const failed=results.filter(x=>x.status==='rejected');\\n  if(failed.length)throw Error('PARALLEL_REGRESSION_FAILED '+failed.map(x=>String(x.reason)).join('; '));\\n  await lane(after);\\n  console.log('ATOMIC_PARALLEL_REGRESSION_COMPLETE elapsedMs='+(Date.now()-start));\\n}\\nasync function main() {\\n  const limit=Number(process.env.INTAKE_LIMIT || '400');\\n  const rev=spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'});\\n  if (rev.status!==0) throw Error('REPOSITORY_COMMIT_REQUIRED');\\n  const base=rev.stdout.trim();\\n  const steps=commands({limit,base});\\n  if (process.argv.includes('--plan')) {\\n    console.log(JSON.stringify({scope:'ONE_OFFICIAL_CARD_TO_BATTLE_WORK_UNIT',\\n      steps:steps.map(([name,command,args])=>({name,command,args}))},null,2));\\n    return;\\n  }\\n  const useParallel=process.env.POKECA_INTAKE_PARALLEL_REGRESSION==='1';\\n  let regressionsDone=false;\\n  for (const [name,command,args] of steps) {\\n    if(useParallel&&name.startsWith('FULL_REGRESSION:')){\\n      if(!regressionsDone){\\n        await parallelRegression(steps.filter(([n])=>n.startsWith('FULL_REGRESSION:')),{...process.env});\\n        regressionsDone=true;\\n      }\\n      continue;\\n    }\\n    console.log('ATOMIC_BATTLE_STEP_START '+name);\\n    const env={...process.env};\\n    if(name==='CREATE_REAL_BATTLE_VERIFICATION_FIXTURES') {\\n      env.POKECA_INTAKE_RELEASE_BASE=base;\\n      env.POKECA_INTAKE_PREFIX=work+'/browser';\\n    }\\n    run(command,args,env);\\n    console.log('ATOMIC_BATTLE_STEP_PASS '+name);\\n  }\\n  console.log('ATOMIC_BATTLE_INTAKE_COMPLETE: verified release candidate and unresolved mechanic work remain linked; published gameplay pending');\\n}\\nif(require.main===module)main().catch(error=>{console.error(error);process.exitCode=1;});\\nmodule.exports={commands,regressionLanes,parallelRegression};\\n\"},{\"path\":\"tests/atomic-official-to-battle.test.cjs\",\"from\":\"'use strict';\\nconst assert=require('node:assert/strict');\\nconst fs=require('node:fs');\\nconst {buildLedger,makeWorklist}=require('../scripts/atomic-battle-connection-ledger.cjs');\\nconst {commands}=require('../scripts/run-atomic-official-battle-intake.cjs');\\nconst unknown=(id,text)=>({\\n  officialCardId:id,category:'item',name:'未対応の公式グッズ',\\n  text,attacks:[],abilities:[],source:{path:'data/effect-extensions/evidence/'+id+'.json'}\\n});\\nconst compiled={records:[{officialCardId:'9000',category:'energy',\\n  mainPlan:{mechanic:'BASIC_ENERGY'},attacks:[],abilities:[]}]};\\nconst original={\\n  ids:['9000','9001','9002','9003','9004','9005','9006'],\\n  candidate:{state:'PREPUBLICATION',qualified:['9000'],\\n    blockers:[{id:'9002',reason:'NO_LEGAL_VERIFICATION_FIXTURE'}],\\n    publicBattleVerified:[]},\\n  checkpoint:{records:[unknown('9001','未実装効果Ａ。'),\\n    unknown('9005','未実装効果Ａ。'),unknown('9006','別の未知効果Ｂ。')],\\n    blocked:[{officialCardId:'9003',reason:'UNSUPPORTED_EVOLUTION_CHAIN'}]},\\n  status:{compilerBlocked:[\\n    {officialCardId:'9001',reason:'UNSUPPORTED_EFFECT_PATTERN'},\\n    {officialCardId:'9005',reason:'UNSUPPORTED_EFFECT_PATTERN'},\\n    {officialCardId:'9006',reason:'UNSUPPORTED_EFFECT_PATTERN'}]},\\n  compiled\\n};\\nconst result=buildLedger(original);\\nconst byId=new Map(result.entries.map(row=>[row.officialCardId,row]));\\nassert.equal(result.totalSelected,7);\\nassert.equal(result.qualifiedForPublication,1);\\nassert.equal(result.workRemaining,6);\\nassert.equal(result.publicBattleVerified,false);\\nassert.equal(result.allCardEffectsConnectedAndExecuted,false);\\nassert.equal(byId.get('9000').state,'QUALIFIED_PREPUBLICATION');\\nassert.equal(byId.get('9001').state,'NEEDS_SHARED_MECHANIC');\\nassert.equal(byId.get('9002').state,'NEEDS_ENGINE_EXECUTION');\\nassert.equal(byId.get('9003').state,'NEEDS_OFFICIAL_PARSER');\\nassert.equal(byId.get('9004').state,'PENDING_OFFICIAL_FETCH');\\nassert.equal(byId.get('9005').state,'NEEDS_SHARED_MECHANIC');\\nassert.equal(byId.get('9006').state,'NEEDS_SHARED_MECHANIC');\\nassert.equal(result.sharedMechanicGroups,2,\\n  'exact text must group shared mechanincs, not names or unrelated effects');\\nassert.deepEqual(result.sharedMechanicWorklist.map(x=>x.printCount),[2,1]);\\nassert.equal(result.sharedMechanicWorklist[0].officialCardIds.length,2);\\nassert.equal(result.sharedMechanicWorklist[0].exampleOfficialText,'未実装効果Ａ。');\\nassert(!result.entries.some(row=>/FETCHED_DONE|CONNECTED_DONE/.test(row.state)),\\n  'acquisition must never be completion');\\nassert.throws(()=>buildLedger({...original,compiled:{records:[]}}),\\n  /QUALIFIED_PRINT_NOT_IN_BATTLE_RELEASE/,\\n  'a plan candidate absent from public bundle cannot pass');\\nassert.throws(()=>buildLedger({...origi