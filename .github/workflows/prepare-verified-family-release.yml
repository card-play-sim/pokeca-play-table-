name: Prepare verified shared damage and stadium effects
on:
  push:
    branches: [feat/battle-verified-damage-stadium-20261123]
    paths: ['.github/workflows/prepare-verified-family-release.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: feat/battle-verified-damage-stadium-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reprocess official evidence for the three new shared mechanics
        run: |
          set -euo pipefail
          base=27590d8ec43baa866f9c54a51247312930e3cd7e
          node - <<'JS'
          const fs = require('node:fs');
          const {compile} = require('./engine/reference-effect-plans.cjs');
          const path = 'data/effect-extensions/intake.json';
          const intake = require('./' + path);
          const admitted = new Set(intake.records.map(row => row.officialCardId));
          const targets = new Set(['ATTACK_DISCARD_STADIUM','ATTACK_ATTACHED_TOOL_COUNT','ATTACK_UNDAMAGED_BONUS']);
          const legalIds = new Set(require('./data/deck-building/catalog.json').records
            .filter(row => row.legality === 'printed-hij' && ['H','I','J'].includes(row.regulationMark))
            .map(row => row.officialCardId));
          for (const row of require('./data/official-effect-intake/checkpoint.json').records) {
            if (row.category !== 'pokemon' || admitted.has(row.officialCardId) ||
                !legalIds.has(row.officialCardId)) continue;
            const [print] = compile({records:[row]}).records;
            const slots = [...print.attacks, ...print.abilities].map(slot => slot.plan);
            if (slots.every(Boolean) && slots.some(slot => targets.has(slot.mechanic))) {
              admitted.add(row.officialCardId);
              intake.records.push(row);
            }
          }
          fs.writeFileSync(path, JSON.stringify(intake, null, 2) + '\n');
          JS
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/stage-card-auto-connect.cjs "$base" work/shared-family-stage
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          node scripts/build-pwa-release.cjs --check
          POKECA_INTAKE_RELEASE_BASE="$base" POKECA_INTAKE_PREFIX=work/shared-family-stage node scripts/build-intake-verification-fixtures.cjs
          node tests/exact-print-import-to-battle.test.cjs
      - name: Save verified release files to the review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-verified-family-release.yml
          git add data/effect-extensions/compiled.json data/effect-extensions/intake.json data/reference-effects/plans.json ui/engine.bundle.js sw.js
          git commit -m 'build: verify exact official prints and regenerate the PWA'
          git push origin HEAD:feat/battle-verified-damage-stadium-20261123
