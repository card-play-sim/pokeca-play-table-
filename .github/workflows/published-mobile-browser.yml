name: Published PWA mobile Chromium interaction checks
on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'index.html'
      - 'update.html'
      - 'ui/pwa-recovery.js'
      - 'sw.js'
      - 'data/reference-effects/plans.json'
      - 'tests/test_reference_match_browser.py'
      - 'tests/test_g_base_008_browser.py'
      - 'tests/test_control_002_browser.py'
      - 'tests/test_ui_control_008_browser.py'
      - 'tests/test_control_006_browser.py'
      - 'tests/test_control_008_extensions_browser.py'
      - 'tests/control-009-expansion.test.cjs'
      - 'tests/test_control_009_browser.py'
      - 'tests/control-010-effects.test.cjs'
      - 'tests/test_control_010_browser.py'
      - 'tests/fixtures/control-010-scenarios.cjs'
      - 'scripts/parse-official-pokemon-energy.cjs'
      - 'tests/fixtures/control-009-extension-manifest.cjs'
      - 'tests/fixtures/control-009-scenarios.cjs'
      - 'tests/shared-operation-origins.test.cjs'
      - 'tests/test_shared_operation_browser.py'
      - 'tests/fixtures/control-008-extension-manifest.cjs'
      - 'tests/fixtures/control-005-scenarios.js'
      - 'tests/test_control_003_update_browser.py'
      - 'tests/browser_opening.py'
      - 'tests/control-002-opening.test.cjs'
      - 'engine/pokeca_selection_constraints.cjs'
      - 'tests/fixtures/g-base-008-browser.js'
      - 'tests/test_published_pwa_browser.py'
      - '.github/workflows/published-mobile-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify published release files first
        env:
          RELEASE_VERIFY_ATTEMPTS: '12'
          RELEASE_VERIFY_INTERVAL_MS: '30000'
        run: node scripts/verify-published-pwa.cjs
      - name: Create persistent browser evidence directory
        run: mkdir -p artifacts
      - name: Upgrade installed v246 from actual published assets and cold restart
        env:
          POKECA_UPGRADE_PUBLIC_SOURCE: https://card-play-sim.github.io/pokeca-play-table-/
        run: python tests/test_control_003_update_browser.py
      - name: Exercise published reference matches in Pixel 5 Chromium emulation
        env:
          POKECA_TEST_URL: https://card-play-sim.github.io/pokeca-play-table-/
        run: |
          python tests/test_shared_operation_browser.py
          python tests/test_control_010_browser.py
          python tests/test_control_009_browser.py
          python tests/test_control_008_extensions_browser.py
          python tests/test_control_006_browser.py
          python tests/test_ui_control_008_browser.py
          python tests/test_control_002_browser.py
          python tests/test_g_base_008_browser.py
          python tests/test_reference_match_browser.py
          python tests/test_release_delivery_browser.py
      - name: Write effect-level public DOM and gateway evidence
        run: |
          node tests/control-005-effect-matrix.test.cjs
          node tests/control-006-abilities.test.cjs
          node tests/shared-operation-origins.test.cjs
          node tests/control-008-extensions.test.cjs
          node tests/control-009-expansion.test.cjs
          node tests/control-010-effects.test.cjs
          node scripts/report-control-006-connections.cjs
      - name: Verify service worker and offline resume on published PWA
        env:
          POKECA_TEST_URL: https://card-play-sim.github.io/pokeca-play-table-/
        run: python tests/test_published_pwa_browser.py
      - name: Preserve mobile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-mobile-browser-evidence
          path: |
            artifacts/
            test-results/shared-operation-origins.json
            test-results/control-00*.json
            test-results/control-010*.json
            test-results/control-010-failures/
            test-results/published-pwa-verification.json
          if-no-files-found: warn
          retention-days: 30
