name: Deck code import regression
on:
  pull_request:
    paths:
      - 'ui/deck-code-import.js'
      - 'tests/deck-code-import.test.cjs'
      - 'ui/imported-deck-match.js'
      - 'deck-builder.html'
      - 'deck-code-import.html'
      - 'tests/imported-deck-match.test.cjs'
      - '.github/workflows/deck-code-import.yml'
  push:
    branches: [feature/deck-code-import-001]
    paths:
      - 'ui/deck-code-import.js'
      - 'tests/deck-code-import.test.cjs'
      - 'ui/imported-deck-match.js'
      - 'deck-builder.html'
      - 'deck-code-import.html'
      - 'tests/imported-deck-match.test.cjs'
      - '.github/workflows/deck-code-import.yml'
jobs:
  deck-code-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/deck-code-import.test.cjs
      - run: node tests/imported-deck-match.test.cjs
      - run: node -e "const fs=require('fs');for(const file of ['deck-builder.html','deck-code-import.html']){const html=fs.readFileSync(file,'utf8');const js=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]).join('\\n');new (require('vm').Script)(js,{filename:file});console.log(file,'inline JavaScript syntax PASS')}"
