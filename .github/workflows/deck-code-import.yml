name: Deck code import regression
on:
  pull_request:
    paths:
      - 'ui/deck-code-import.js'
      - 'ui/deck-import-page.js'
      - 'ui/deck-builder.js'
      - 'ui/saved-decks.js'
      - 'ui/deck-home.*'
      - 'index.html'
      - 'sw.js'
      - 'scripts/pwa-worker-template.js'
      - 'ui/deck-editor.css'
      - 'tests/deck-editor-browser.py'
      - 'tests/deck-code-import.test.cjs'
      - 'tests/deck-blocker-diagnostics.test.cjs'
      - 'ui/imported-deck-match.js'
      - 'deck-builder.html'
      - 'deck-code-import.html'
      - 'tests/imported-deck-match.test.cjs'
      - '.github/workflows/deck-code-import.yml'
  push:
    branches: [feature/deck-code-import-001, feature/deck-ui-001]
    paths:
      - 'ui/deck-code-import.js'
      - 'ui/deck-import-page.js'
      - 'ui/deck-builder.js'
      - 'ui/saved-decks.js'
      - 'ui/deck-home.*'
      - 'index.html'
      - 'sw.js'
      - 'scripts/pwa-worker-template.js'
      - 'ui/deck-editor.css'
      - 'tests/deck-editor-browser.py'
      - 'tests/deck-code-import.test.cjs'
      - 'tests/deck-blocker-diagnostics.test.cjs'
      - 'ui/imported-deck-match.js'
      - 'deck-builder.html'
      - 'deck-code-import.html'
      - 'tests/imported-deck-match.test.cjs'
      - '.github/workflows/deck-code-import.yml'
jobs:
  deck-code-import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/deck-code-import.test.cjs
      - run: node tests/deck-blocker-diagnostics.test.cjs
      - run: node tests/imported-deck-match.test.cjs
      - run: node --check ui/deck-builder.js && node --check ui/deck-import-page.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/deck-editor-browser.py
