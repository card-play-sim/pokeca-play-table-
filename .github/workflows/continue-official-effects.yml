name: Incremental official effect intake
on:
  # Accelerate only exact official print/effect intake; preserve all fail-closed gates.
  # Scheduled checkpoints resume missing prints without changing existing decks.
  push:
    branches: [main, work/issue122-bulk-resume-20261124]
    paths:
      - '.github/workflows/continue-official-effects.yml'
      - 'scripts/list-card-auto-connect-ids.cjs'
      # A parser/Mechanic patch must automatically reopen the same blocked
      # official printings and rerun their full battle execution gate.
      - 'scripts/continue-official-effect-intake.py'
      - 'scripts/collect-effect-extensions.py'
      - 'scripts/parse-official-pokemon-energy.cjs'
      - 'scripts/build-effect-extensions.cjs'
      - 'scripts/stage-card-auto-connect.cjs'
      - 'scripts/atomic-battle-connection-ledger.cjs'
      - 'scripts/run-atomic-official-battle-intake.cjs'
      - 'engine/reference-effect-plans.cjs'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'ui/engine.bundle.js'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum new official pages per checkpoint (official ID and effect verification required)
        default: "1000"
        required: true
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/20 * * * *"
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: incremental-official-effect-intake
  cancel-in-progress: false
jobs:
  continue:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 122 && !github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/card-auto-connect')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name == 'work/issue122-bulk-resume-20261124' && github.ref_name || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resume only the automation-owned checkpoint branch
        run: |
          # Never merge stale automation code into main: retain only durable intake data.
          # Each run owns an isolated branch, so an interrupted run cannot overwrite
          # a previous checkpoint or leave unresolved conflicts in the worktree.
          INTAKE_BRANCH="automation/control-013-intake-${GITHUB_RUN_ID}"
          git checkout -b "$INTAKE_BRANCH"
          echo "INTAKE_BRANCH=$INTAKE_BRANCH" >> "$GITHUB_ENV"
          # Resume the newest branch with a durable checkpoint, skipping interrupted
          # branches without one. Numeric run IDs are monotonically increasing.
          CHECKPOINT_FOUND=0
          for RUN_ID in $(git ls-remote --heads origin 'refs/heads/automation/control-013-intake-*' |
            sed -n 's|.*refs/heads/automation/control-013-intake-\([0-9][0-9]*\)$|\1|p' |
            sort -nr); do
            CHECKPOINT_BRANCH="automation/control-013-intake-$RUN_ID"
            # A concurrent branch deletion must not abort checkpoint recovery.
            if ! git fetch origin "$CHECKPOINT_BRANCH"; then
              continue
            fi
            if git cat-file -e FETCH_HEAD:data/official-effect-intake/checkpoint.json 2>/dev/null; then
              python scripts/restore-official-intake-evidence.py FETCH_HEAD --merge
              CHECKPOINT_FOUND=1
              echo "Resumed checkpoint from $CHECKPOINT_BRANCH"
              break
            fi
          done
          if [ "$CHECKPOINT_FOUND" -eq 0 ] &&
             git ls-remote --exit-code --heads origin automation/control-013-intake >/dev/null; then
            git fetch origin automation/control-013-intake
            if git cat-file -e FETCH_HEAD:data/official-effect-intake/checkpoint.json 2>/dev/null; then
              python scripts/restore-official-intake-evidence.py FETCH_HEAD --merge
              echo "Resumed legacy checkpoint"
            fi
          fi
      - name: Discover unclassified prints using official standard search
        run: python tools/classify-deck-search.py --discover
      - name: Collect incremental official pages and atomically connect every supported effect to battle
        env:
          INTAKE_LIMIT: ${{ inputs.limit || '1000' }}
        run: |
          python -m unittest discover -s tests -p test_restore_official_intake_evidence.py
          node tests/auto-connect-workflow-recovery.test.cjs
          python -m unittest discover -s tests -p test_atomic_parser_retry.py
          node tests/bulk-basic-energy-intake.test.cjs
          # One command owns official acquisition, shared mechanic compilation, execution,
          # print-specific release, and persistent unresolved effect work units.
          node tests/atomic-official-to-battle.test.cjs
          node scripts/run-atomic-official-battle-intake.cjs
      - name: Save checkpoint and outcomes on the automation branch for review
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/effect-extensions/evidence data/official-effect-intake reports/official-effect-continuation
          if [ "${{ job.status }}" = success ]; then
            cp work/card-auto-connect/candidate.json reports/official-effect-continuation/candidate.json
            git add reports/official-effect-continuation/candidate.json
            git add data/effect-extensions/intake.json data/effect-extensions/compiled.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'checkpoint: incremental official effect intake and execution outcomes'
            git push -u origin "$INTAKE_BRANCH"
          fi
      - name: Open verified candidate pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(node -p "require('./work/card-auto-connect/candidate.json').qualified.length")
          if [ "$count" -eq 0 ]; then
            echo 'No new candidate passed every effect execution gate.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = work/issue122-bulk-resume-20261124 ] && [ "$count" -lt 500 ]; then
            echo "Saved $count candidate prints on branch $INTAKE_BRANCH. Continue the bulk batch before opening a PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The repository currently denies pull-request creation by GITHUB_TOKEN.
          # Preserve verified output and hand over the reviewable branch to Issue #122
          # instead of failing after successfully collecting/validating official data.
          if gh pr create --base main --head "$INTAKE_BRANCH" \
            --title "CARD-AUTO-CONNECT: $count verified candidate prints" \
            --body "Refs #122. Every candidate effect passed the existing engine worker. Merge only after required CI; published battle verification is still pending. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
            echo "Candidate PR opened; merge only after CI and published battle checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Actions cannot create this PR. Delivering the candidate branch to Issue #122."
            body=$(printf 'AUTO_CONNECT_CANDIDATE_READY\nBranch: %s\nVerified candidate printings: %s\nWorkflow: %s/%s/actions/runs/%s\nReview action: create PR from this branch using a permitted GitHub connection, complete required CI, then publish and run real gameplay checks. Do not merge unverified intake.\n' "$INTAKE_BRANCH" "$count" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            gh api "repos/$GITHUB_REPOSITORY/issues/122/comments" --method POST -f body="$body"
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-effect-continuation-checkpoint
          path: |
            work/card-auto-connect/
            reports/official-effect-continuation/atomic-battle-connection.json
            reports/official-effect-continuation/atomic-battle-connection-shared-mechanic-worklist.json
            work/official-standard-search/
            data/official-effect-intake/
            reports/official-effect-continuation/
            test-results/control-013*.json
            test-results/control-014*.json
          retention-days: 90
