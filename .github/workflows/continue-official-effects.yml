name: Incremental official effect intake
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum new official pages
        default: "50"
        required: true
  schedule:
    - cron: "15 20 * * *"
permissions:
  contents: write
concurrency:
  group: incremental-official-effect-intake
  cancel-in-progress: false
jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resume only the automation-owned checkpoint branch
        run: |
          # Never merge stale automation code into main: retain only durable intake data.
          # Each run owns an isolated branch, so an interrupted run cannot overwrite
          # a previous checkpoint or leave unresolved conflicts in the worktree.
          INTAKE_BRANCH="automation/control-013-intake-${GITHUB_RUN_ID}"
          git checkout -b "$INTAKE_BRANCH"
          echo "INTAKE_BRANCH=$INTAKE_BRANCH" >> "$GITHUB_ENV"
          # Resume the newest successful run's checkpoint rather than replaying
          # the legacy branch forever. Numeric run IDs are monotonically increasing.
          LATEST=$(git ls-remote --heads origin 'refs/heads/automation/control-013-intake-*' |
            sed -n 's|.*refs/heads/automation/control-013-intake-\([0-9][0-9]*\)$|\1|p' |
            sort -n | tail -1)
          if [ -n "$LATEST" ]; then
            CHECKPOINT_BRANCH="automation/control-013-intake-$LATEST"
          else
            CHECKPOINT_BRANCH="automation/control-013-intake"
          fi
          if git ls-remote --exit-code --heads origin "$CHECKPOINT_BRANCH" >/dev/null; then
            git fetch origin "$CHECKPOINT_BRANCH"
            if git cat-file -e FETCH_HEAD:data/official-effect-intake/checkpoint.json 2>/dev/null; then
              git restore --source=FETCH_HEAD -- data/official-effect-intake/checkpoint.json
            fi
          fi
      - name: Collect incremental official evidence and run approved local commands
        env:
          INTAKE_LIMIT: ${{ inputs.limit || '50' }}
        run: |
          python scripts/continue-official-effect-intake.py --limit "$INTAKE_LIMIT" --adopt
          node scripts/build-pwa-release.cjs
          node tests/control-013-continuation.test.cjs
          node tests/control-014-shared-effects.test.cjs
          node tests/control-014-official-parser.test.cjs
          node tests/control-008-extensions.test.cjs
          node tests/control-009-expansion.test.cjs
          node tests/control-010-effects.test.cjs
          node tests/control-011-engine-batch.test.cjs
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: Save checkpoint and outcomes on the automation branch for review
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/effect-extensions data/official-effect-intake reports/official-effect-continuation ui/engine.bundle.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'checkpoint: incremental official effect intake and execution outcomes'
            git push -u origin "$INTAKE_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-effect-continuation-checkpoint
          path: |
            data/official-effect-intake/
            reports/official-effect-continuation/
            test-results/control-013*.json
            test-results/control-014*.json
          retention-days: 90
