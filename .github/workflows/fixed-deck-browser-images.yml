name: Fixed deck real-browser image smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'index.html'
      - 'sw.js'
      - 'data/fixed-test-decks.json'
      - 'data/fixed-deck-preview-bindings.json'
      - 'data/official-image-registry.json'
      - 'tests/test_fixed_deck_browser_images.py'
      - '.github/workflows/fixed-deck-browser-images.yml'
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Run mobile Chromium image smoke test
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/pokeca-server.log 2>&1 &
          python tests/test_fixed_deck_browser_images.py --require-preview
      - name: Upload browser screenshot and image diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-deck-image-browser-evidence
          path: artifacts/
          if-no-files-found: warn
