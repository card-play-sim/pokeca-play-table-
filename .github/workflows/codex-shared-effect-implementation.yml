name: Codex shared effect implementation (review only)

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Verified task ID, or AUTO for largest shared-effect group'
        required: true
        default: AUTO
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-shared-effect-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export verified reference and WORK effect tasks
        run: |
          node scripts/export-reference-official-effect-evidence.cjs data/reference-effects/plans.json reports/reference-official-effect-evidence.json
          node scripts/build-official-effect-codex-batch.cjs reports/reference-official-effect-evidence.json reports/reference-effect-codex-batch.json || test -f reports/reference-effect-codex-batch.json
          if [ -f data/official-effect-evidence.json ]; then
            node scripts/build-official-effect-codex-batch.cjs data/official-effect-evidence.json reports/work-effect-codex-batch.json || test -f reports/work-effect-codex-batch.json
          fi
          # A blocked source is never selected; another verified source may still proceed.
      - name: Choose verified task source by requested stable task ID
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          node scripts/choose-codex-shared-effect-source.cjs "$TASK_ID" reports/official-effect-codex-batch.json reports/work-effect-codex-batch.json reports/reference-effect-codex-batch.json
      - name: Select one verified shared task and create safe prompt
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: node scripts/select-codex-shared-effect-task.cjs reports/official-effect-codex-batch.json "$TASK_ID" reports/codex-selected-task.md
      - name: Verify task selector and evidence gates before paid execution
        run: |
          node tests/select-codex-shared-effect-task.test.cjs
          node tests/choose-codex-shared-effect-source.test.cjs
          node tests/reference-official-effect-evidence-export.test.cjs
          node tests/official-effect-codex-batch.test.cjs
          node tests/official-effect-import.test.cjs
      - name: Verify baseline reference engine before paid execution
        run: |
          set -e
          node scripts/validate-reference-effect-provenance.cjs
          node scripts/check-reference-bundle-sync.cjs
          node scripts/build-pwa-release.cjs --check
          node tests/reference-effect-runtime-smoke.test.cjs
          node tests/reference-effect-opening-rejection.test.cjs
      - name: Verify Codex API access is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is missing; no Codex execution was attempted"
            exit 2
          fi
      - name: Install Codex CLI
        run: npm install --global @openai/codex
      - name: Verify Codex CLI is available
        run: |
          command -v codex
          codex --version
      - name: Execute Codex on isolated review branch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          git checkout -b "codex/shared-effect-${{ github.run_id }}"
          codex exec --sandbox workspace-write - < reports/codex-selected-task.md
      - name: Run complete reference effect gates
        run: |
          set -e
          node scripts/validate-reference-effect-provenance.cjs
          node scripts/check-reference-bundle-sync.cjs
          node scripts/build-pwa-release.cjs --check
          for test in tests/reference-effect-provenance.test.cjs tests/reference-effect-compiler-gate.test.cjs tests/reference-effect-coverage.test.cjs tests/reference-effect-runtime-bundle.test.cjs tests/reference-effect-runtime-smoke.test.cjs tests/reference-effect-opening-actions.test.cjs tests/reference-effect-opening-rejection.test.cjs tests/reference-effect-cross-category.test.cjs tests/reference-effect-cross-family-seeded.test.cjs tests/reference-effect-cross-family-rejection.test.cjs tests/reference-special-energy-retreat.test.cjs tests/reference-effect-extended-gameplay.test.cjs tests/reference-effect-multi-turn.test.cjs tests/reference-effect-failure-causes.test.cjs tests/reference-runtime-failure-causes.test.cjs tests/reference-ci-runner-cause.test.cjs tests/reference-effect-ci-aggregation.test.cjs tests/reference-effect-codex-tasks.test.cjs tests/reference-official-effect-evidence-export.test.cjs tests/official-effect-import.test.cjs tests/official-effect-codex-batch.test.cjs tests/select-codex-shared-effect-task.test.cjs tests/choose-codex-shared-effect-source.test.cjs; do
            node "$test"
          done
      - name: Reject edits outside approved implementation paths
        run: |
          if { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | grep -Ev '^(engine/|ui/|tests/|scripts/|reports/)'; then
            echo "::error::Codex modified files outside approved implementation paths"
            exit 2
          fi
          if { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | grep -E '^(data/|sw.js$|[.]github/|AGENTS[.]md$)'; then
            echo "::error::Protected data or deployment metadata changed; manual review required"
            exit 2
          fi
      - name: Create review-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard | grep -v '^reports/')" ]; then
            echo "::notice::No implementation changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine ui tests scripts
          if git diff --cached --quiet; then
            echo "::notice::No allowed implementation changes produced"
            exit 0
          fi
          SELECTED_TASK_ID="$(sed -n 's/^TASK_ID: //p' reports/codex-selected-task.md | head -n 1)"
          if ! [[ "$SELECTED_TASK_ID" =~ ^OFFICIAL_SHARED_EFFECT_[A-F0-9]{16}$ ]]; then
            echo "::error::Missing or invalid selected task ID"
            exit 2
          fi
          git commit -m "Codex shared effect implementation: $SELECTED_TASK_ID"
          git push --set-upstream origin HEAD
          gh pr create --base main --head "codex/shared-effect-${{ github.run_id }}" --title "Codex review: $SELECTED_TASK_ID" --body "Generated from selected verified effect task $SELECTED_TASK_ID. Review-only; no auto-merge. Check full CI, source provenance, Pages deployment and Android verification separately."
