name: Unknown effect approved replay entry
on:
  workflow_run:
    workflows: ["Unknown effect verified review handoff", "Incremental official effect intake"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      release_only:
        description: Resume the verified automatic release queue (no replay approval)
        required: false
        default: false
        type: boolean
      origin_run:
        description: Successful quarantine workflow run ID
        required: false
        type: string
      attempt:
        description: Independently reviewed attempt
        required: false
        type: choice
        options: [attempt-1, attempt-2]
      approved_patch_sha256:
        description: Independently reviewed exact patch SHA256
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  entry:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && !inputs.release_only) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/unknown-effect-review-handoff.yml' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.number == 122 &&
         !github.event.issue.pull_request &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.comment.body, 'APPROVE_UNKNOWN_REPLAY ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UNKNOWN_EFFECT_CANDIDATE_POLICY: ${{ github.event_name == 'workflow_run' && (vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == '' || vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == 'reviewed-composition-v1') && 'reviewed-composition-v1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact independently reviewed approval
        if: github.event_name != 'workflow_run'
        id: approval
        env:
          APPROVAL_EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          DISPATCH_RUN: ${{ inputs.origin_run }}
          DISPATCH_ATTEMPT: ${{ inputs.attempt }}
          DISPATCH_SHA: ${{ inputs.approved_patch_sha256 }}
        run: |
          python scripts/verify-unknown-approved-replay.py --resolve-event "$GITHUB_EVENT_PATH" "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: unknown-effect-review-handoff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview-handoff
      - name: Resolve read-only preview origin
        if: github.event_name == 'workflow_run'
        id: preview
        run: |
          set -euo pipefail
          run="$(jq -er '.originRunId | tostring' "$RUNNER_TEMP/preview-handoff/review-handoff.json")"
          [[ "$run" =~ ^[1-9][0-9]{0,19}$ ]]
          echo "origin_run=$run" >> "$GITHUB_OUTPUT"
      - name: Check origin workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN: ${{ steps.approval.outputs.origin_run || steps.preview.outputs.origin_run }}
        run: |
          set -euo pipefail
          [[ "$ORIGIN_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGIN_RUN" > "$RUNNER_TEMP/origin.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion=="success" and .head_branch=="main" and .head_repository.full_name==$repo and .path==".github/workflows/local-unknown-effect-generator.yml"' "$RUNNER_TEMP/origin.json"
          sha=$(jq -r '.head_sha' "$RUNNER_TEMP/origin.json")
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "ORIGIN_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: local-unknown-effect-quarantine
          run-id: ${{ steps.approval.outputs.origin_run || steps.preview.outputs.origin_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/replay-input
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicit approval and current source compatibility
        if: github.event_name != 'workflow_run'
        env:
          ORIGIN_RUN: ${{ steps.approval.outputs.origin_run || steps.preview.outputs.origin_run }}
          ATTEMPT: ${{ steps.approval.outputs.attempt }}
          APPROVED_SHA: ${{ steps.approval.outputs.approved_patch_sha256 }}
        run: |
          python scripts/verify-unknown-approved-replay.py --self-test
          python scripts/verify-unknown-approved-replay.py "$RUNNER_TEMP/replay-input" "$ORIGIN_SHA" "$ORIGIN_RUN" "$ATTEMPT" "$APPROVED_SHA" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/replay-entry"
      - name: Independently verify preview without granting approval
        if: github.event_name == 'workflow_run'
        env:
          ORIGIN_RUN: ${{ steps.preview.outputs.origin_run }}
        run: |
          set -euo pipefail
          checkpoint="$(jq -er '[.candidates[] | select(.officialScope.state == "OFFICIAL_SOURCE_BOUND_REVIEW_REQUIRED") | .officialScope.checkpoint] | unique | if length==1 then .[0] else error("checkpoint scope") end' "$RUNNER_TEMP/preview-handoff/review-handoff.json")"
          [[ "$checkpoint" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin "$checkpoint"
          python scripts/verify-unknown-approved-replay.py --preview "$RUNNER_TEMP/replay-input" "$ORIGIN_SHA" "$ORIGIN_RUN" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/replay-entry" "$checkpoint"
      - name: Restore verified official source and prepare isolated replay tree
        run: |
          set -euo pipefail
          node_version=$(node --version)
          echo "$node_version"
          found=0
          for checkpoint in $(git ls-remote --heads origin 'refs/heads/automation/control-013-intake-*' | sed -n 's|.*refs/heads/\(automation/control-013-intake-[0-9]*\)$|\1|p' | sort -Vr); do
            if ! git fetch origin "$checkpoint"; then continue; fi
            if ! git cat-file -e FETCH_HEAD:data/official-effect-intake/checkpoint.json 2>/dev/null; then continue; fi
            python scripts/restore-official-intake-evidence.py FETCH_HEAD --merge
            found=1
            break
          done
          test "$found" = 1
          node scripts/refresh-uncompiled-official-facts.cjs --apply
          scratch="$RUNNER_TEMP/approved-scratch"
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$scratch"
          git -C "$scratch" checkout --detach "$(git rev-parse HEAD)"
          git -C "$scratch" remote remove origin
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$scratch/"
          python scripts/prepare-unknown-replay-intake.py "$scratch" "$RUNNER_TEMP/replay-entry"
          git -C "$scratch" apply "$RUNNER_TEMP/replay-entry/approved.patch"
      - name: Build trusted isolated browser dependencies
        run: |
          set -euo pipefail
          context="$(mktemp -d "$RUNNER_TEMP/replay-build.XXXXXX")"
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          FROM node:22-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 python3-venv && rm -rf /var/lib/apt/lists/*
          ENV PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers
          RUN python3 -m venv /opt/pw && /opt/pw/bin/pip install --no-cache-dir playwright==1.56.0 && /opt/pw/bin/python -m playwright install --with-deps chromium && chmod -R a+rX /opt/pw-browsers
          DOCKERFILE
          docker build -t pokeca-approved-replay:local "$context"
          rm -rf "$context"
      - name: Replay approved source offline with exact print and full AI checks
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/approved-scratch"
          out="$RUNNER_TEMP/replay-entry"
          timeout 90m docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 5g --cpus 3 --read-only --shm-size 1g --tmpfs /tmp:rw,nosuid,nodev,size=1g --user "$(id -u):$(id -g)" --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --mount "type=bind,source=$scratch,target=/repo" --workdir /repo pokeca-approved-replay:local bash -euc '
            base="$(git rev-parse HEAD)"
            node --check engine/reference-effect-plans.cjs
            node --check engine/pokeca_reference_effect_runtime.cjs
            node --check scripts/lib/shared-effect-engine-worker.cjs
            node scripts/build-effect-extensions.cjs
            node scripts/sync-reference-effects.cjs
            node scripts/stage-card-auto-connect.cjs "$base" work/model-candidate
            git restore --source=HEAD -- data/effect-extensions/compiled.json
            node scripts/build-effect-extensions.cjs
            node scripts/sync-reference-effects.cjs
            node scripts/build-pwa-release.cjs
            node scripts/report-ij-effect-coverage.cjs reports/ij-effect-coverage.json reports/ij-effect-executions.json
            node tests/control-014-shared-effects.test.cjs
            node tests/control-011-engine-batch.test.cjs
            node tests/atomic-official-to-battle.test.cjs
            node tests/fixture-reservation-fallback.test.cjs
            export POKECA_INTAKE_RELEASE_BASE="$base" POKECA_INTAKE_PREFIX=work/model-candidate/browser POKECA_INTAKE_LOCAL_CANDIDATE=1
            node scripts/build-intake-verification-fixtures.cjs
            test -s "$POKECA_INTAKE_PREFIX/example-decks.json"
            node scripts/sync-reference-effects.cjs --check
            node scripts/build-pwa-release.cjs --check
            export POKECA_TEST_URL=http://127.0.0.1:8765/ POKECA_BROWSER_SHARD_COUNT=1 POKECA_BROWSER_SHARD_INDEX=0 POKECA_BROWSER_SLOTS_ONLY=1 POKECA_INTAKE_ARTIFACT=unknown-quarantine
            /opt/pw/bin/python -m http.server 8765 --bind 127.0.0.1 >/tmp/replay-http.log 2>&1 &
            server=$!
            trap "kill $server 2>/dev/null || true" EXIT
            for n in 1 2 3 4 5; do
              if /opt/pw/bin/python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8765/\",timeout=2).close()"; then break; fi
              sleep 1
            done
            /opt/pw/bin/python tests/test_control_013_browser.py
            unset POKECA_BROWSER_SLOTS_ONLY
            export POKECA_INTAKE_ARTIFACT=unknown-quarantine-full-ai
            /opt/pw/bin/python tests/test_control_013_browser.py
          ' > "$out/replay.log" 2>&1
          python scripts/verify-unknown-quarantine-receipt.py "$out" "$scratch" "$GITHUB_WORKSPACE"
          python scripts/verify-unknown-quarantine-browser.py "$out" "$scratch" "$GITHUB_WORKSPACE"
          python scripts/prepare-unknown-replay-intake.py --verify-result "$out"
          if [ "$GITHUB_EVENT_NAME" != workflow_run ] || [ "$UNKNOWN_EFFECT_CANDIDATE_POLICY" = reviewed-composition-v1 ]; then
            python scripts/export-unknown-replay-candidate.py export "$GITHUB_WORKSPACE" "$scratch" "$out"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event_name == 'workflow_run' && 'unknown-effect-read-only-preview' || 'unknown-effect-approved-replay-entry' }}
          path: ${{ runner.temp }}/replay-entry/
          if-no-files-found: error
          retention-days: 14

  propose:
    needs: entry
    concurrency:
      group: unknown-effect-candidate-propose
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && needs.entry.result == 'success' && (github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && (vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == '' || vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == 'reviewed-composition-v1')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UNKNOWN_EFFECT_CANDIDATE_POLICY: ${{ github.event_name == 'workflow_run' && (vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == '' || vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == 'reviewed-composition-v1') && 'reviewed-composition-v1' || '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_run' && 'unknown-effect-read-only-preview' || 'unknown-effect-approved-replay-entry' }}
          path: ${{ runner.temp }}/candidate
      - name: Validate and stage only approved paths without executing candidate code
        run: |
          set -euo pipefail
          python scripts/export-unknown-replay-candidate.py stage "$GITHUB_WORKSPACE" "$RUNNER_TEMP/candidate"
          git diff --cached --check
      - name: Create draft candidate pull request without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kind=APPROVED_UNKNOWN_REPLAY
          description="Explicitly approved exact patch"
          branch="automation/unknown-approved-candidate-$GITHUB_RUN_ID"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            test "$UNKNOWN_EFFECT_CANDIDATE_POLICY" = reviewed-composition-v1
            kind=OWNER_POLICY_DRAFT_ONLY
            description="Owner-policy deterministic draft only; NOT release-approved"
            branch="automation/unknown-policy-candidate-$GITHUB_RUN_ID"
          fi
          # The exact same origin, patch and replay base must not create new
          # branches on workflow retries. A changed base requires fresh replay.
          if [ "$kind" = OWNER_POLICY_DRAFT_ONLY ]; then
            receipt="$RUNNER_TEMP/candidate/verified-replay.json"
            origin="$(jq -er '.originRunId | tostring' "$receipt")"
            digest="$(jq -er '.approvedPatchSha256' "$receipt")"
            base="$(jq -er '.latestMain' "$receipt")"
            [[ "$origin" =~ ^[1-9][0-9]{0,19}$ && "$digest" =~ ^[a-f0-9]{64}$ && "$base" =~ ^[a-f0-9]{40}$ ]]
            test "$base" = "$(git rev-parse HEAD)"
            branch="automation/unknown-policy-candidate-$origin-$digest-$base"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Verified unknown-effect replay draft $GITHUB_RUN_ID ($kind)"
          if [ "$kind" = OWNER_POLICY_DRAFT_ONLY ]; then
            existing="$(git ls-remote --heads origin "refs/heads/$branch")"
            if [ -n "$existing" ]; then
              git fetch --no-tags origin "refs/heads/$branch"
              test "$(git rev-parse FETCH_HEAD^{tree})" = "$(git rev-parse HEAD^{tree})"
              test "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD^)"
              git reset --hard FETCH_HEAD
            else
              git push origin "HEAD:refs/heads/$branch"
            fi
            # Never reopen a candidate closed by a reviewer, and never create
            # a duplicate for an open or merged candidate with this identity.
            prior="$(gh pr list --state all --head "$branch" --limit 10 --json number,url,state)"
            if [ "$(jq 'length' <<< "$prior")" -gt 0 ]; then
              jq -r '.[] | "Existing candidate: \(.url) (\(.state))"' <<< "$prior"
              # Reuse the durable PR reference, but never treat a closed or
              # merged PR as an instruction to publish again.
              jq -r '.[] | "Existing candidate: \(.url) (\(.state))"' <<< "$prior" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          if gh pr create --draft --base main --head "$branch" --title "Verified unknown-effect candidate $GITHUB_RUN_ID" --body "$description; latest-main isolated engine and Chromium replay passed. Normal CI, independent final review, Pages byte equality and published gameplay remain mandatory. Refs #122. Evidence: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; then
            echo "Draft PR opened. Use the permitted GitHub connection to review and trigger normal CI for this exact head." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Actions token cannot create the PR; preserved verified branch for permitted GitHub connection."
          fi
          commit="$(git rev-parse HEAD)"
          body=$(printf 'AUTO_CONNECT_CANDIDATE_READY\nKind: %s\nBranch: %s\nHead: %s\nBase: %s\nWorkflow: %s/%s/actions/runs/%s\nUse the permitted GitHub connection to create or find the exact candidate PR, independently review, run all required CI, then merge and verify Pages bytes and published gameplay. Never count a branch or draft as published.\n' "$kind" "$branch" "$commit" "$(git rev-parse HEAD^)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api "repos/$GITHUB_REPOSITORY/issues/122/comments" --method POST -f body="$body"
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"

  release:
    # The approved main workflow enables only independently reproduced
    # compiler-only candidates. GitHub review and CI protection still apply.
    if: >-
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_only && github.actor == github.repository_owner) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/continue-official-effects.yml' &&
        github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) &&
      github.ref == 'refs/heads/main' && github.repository == 'card-play-sim/pokeca-play-table-' &&
      (vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == '' || vars.UNKNOWN_EFFECT_AUTO_CANDIDATE == 'reviewed-composition-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: unknown-effect-candidate-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    env:
      UNKNOWN_EFFECT_CANDIDATE_POLICY: reviewed-composition-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Release exact candidates using existing PR and Pages gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          live_main() { gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha; }
          test "$(live_main)" = "$base"
          ensure_public() {
            local sha="$1" previous="$2" file rows state waiting=0 id attempt
            for file in deploy-play-table-pages.yml verify-published-pwa.yml published-mobile-browser.yml; do
              rows="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?head_sha=$sha&branch=main&per_page=100" --jq '.workflow_runs | map(select(.event=="push" or .event=="workflow_dispatch")) | sort_by(.id) | last // {}')" || return 1
              state="$(jq -r '.conclusion // .status // "missing"' <<< "$rows")"
              case "$state" in
                success)
                  if [ "$file" = published-mobile-browser.yml ]; then
                    id="$(jq -er .id <<< "$rows")" || return 1
                    receipt="$(mktemp -d "$RUNNER_TEMP/public.XXXXXX")"
                    if ! gh run download "$id" --name public-intake-exact-union --dir "$receipt" || ! python scripts/export-unknown-replay-candidate.py public-receipt "$receipt/public-intake-union.json" "$previous" "$sha" "$GITHUB_WORKSPACE"; then
                      # A successful but differently scoped run is not proof.
                      # Re-dispatch only on current main, with the exact base.
                      if [ "$(live_main)" = "$sha" ]; then
                        gh workflow run "$file" --ref main -f "intake_base=$previous" || return 1
                      fi
                      waiting=1
                    fi
                  fi ;;
                missing)
                  test "$(live_main)" = "$sha" || return 1
                  if [ "$file" = published-mobile-browser.yml ]; then
                    gh workflow run "$file" --ref main -f "intake_base=$previous" || return 1
                  else
                    gh workflow run "$file" --ref main || return 1
                  fi
                  waiting=1 ;;
                failure|cancelled|timed_out|startup_failure)
                  # Reuse the existing failed workflow, at most two retries.
                  id="$(jq -er .id <<< "$rows")" || return 1
                  attempt="$(jq -er .run_attempt <<< "$rows")" || return 1
                  if [ "$(live_main)" = "$sha" ] && [ "$attempt" -lt 3 ]; then
                    gh run rerun "$id" --failed || return 1
                  fi
                  waiting=1 ;;
                *) echo "$file: $state; release not yet verified"; waiting=1 ;;
              esac
            done
            return "$waiting"
          }
          # Source-only merges must not hide a preceding unpublished delta.
          last_release="$(git log --first-parent -1 --format=%H -- data/effect-extensions/compiled.json)"
          if [ -n "$last_release" ] && git rev-parse "$last_release^1" >/dev/null 2>&1; then
            previous="$(git rev-parse "$last_release^1")"
            if ! ensure_public "$last_release" "$previous"; then
              if [ "$last_release" != "$base" ]; then
                ensure_public "$base" "$previous" || exit 0
              else
                exit 0
              fi
            fi
          fi
          python scripts/export-unknown-replay-candidate.py --self-test
          gh pr list --state open --base main --limit 100 --json number,headRefName,headRefOid,isDraft,title,headRepositoryOwner,isCrossRepository > "$RUNNER_TEMP/open-release-prs.json"
          while IFS= read -r pr; do
            number="$(jq -er .number <<< "$pr")"
            branch="$(jq -er .headRefName <<< "$pr")"
            head="$(jq -er .headRefOid <<< "$pr")"
            title="$(jq -er .title <<< "$pr")"
            [[ "$branch" =~ ^automation/unknown-policy-candidate-([1-9][0-9]{0,19})-([a-f0-9]{64})-([a-f0-9]{40})$ ]] || continue
            origin="${BASH_REMATCH[1]}" patch="${BASH_REMATCH[2]}" candidate_base="${BASH_REMATCH[3]}"
            [ "$candidate_base" = "$base" ] || continue
            [[ "$title" =~ ^Verified\ unknown-effect\ candidate\ ([1-9][0-9]{0,19})$ ]] || continue
            replay="${BASH_REMATCH[1]}"
            [[ "$number" =~ ^[1-9][0-9]*$ && "$head" =~ ^[a-f0-9]{40}$ ]] || continue
            jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '.isCrossRepository==false and .headRepositoryOwner.login==$owner' <<< "$pr" >/dev/null || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$replay" > "$RUNNER_TEMP/release-origin.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion=="success" and .event=="workflow_run" and .head_branch=="main" and .head_repository.full_name==$repo and .path==".github/workflows/unknown-effect-approved-replay.yml"' "$RUNNER_TEMP/release-origin.json" >/dev/null || continue
            out="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
            gh run download "$replay" --name unknown-effect-read-only-preview --dir "$out" || continue
            jq -e --arg origin "$origin" --arg patch "$patch" --arg base "$base" '(.originRunId|tostring)==$origin and .approvedPatchSha256==$patch and .latestMain==$base and .reviewOnly==true' "$out/verified-replay.json" >/dev/null || continue
            # Independently re-stage verified bytes; never execute candidate code.
            git reset --hard "$base"
            if ! python scripts/export-unknown-replay-candidate.py stage "$GITHUB_WORKSPACE" "$out"; then
              git reset --hard "$base"
              git clean -fd
              continue
            fi
            expected="$(git write-tree)"
            git reset --hard "$base"
            git clean -fd
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha)"
            [ "$expected" = "$actual" ] || continue
            if [ "$(jq -r .isDraft <<< "$pr")" = true ]; then
              gh pr ready "$number" || true
              continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request&per_page=100" > "$RUNNER_TEMP/release-checks.json"
            if ! python scripts/export-unknown-replay-candidate.py release-checks "$RUNNER_TEMP/release-checks.json" "$head" "$GITHUB_REPOSITORY"; then continue; fi
            gh pr view "$number" --json headRefOid,baseRefOid,isDraft,mergeStateStatus,reviewDecision,state > "$RUNNER_TEMP/release-pr.json"
            jq -e --arg head "$head" --arg base "$base" '.headRefOid==$head and .baseRefOid==$base and .isDraft==false and .state=="OPEN" and .mergeStateStatus=="CLEAN" and (.reviewDecision=="" or .reviewDecision=="APPROVED")' "$RUNNER_TEMP/release-pr.json" >/dev/null || continue
            test "$(live_main)" = "$base"
            # No admin override or bypass of required review.
            gh pr merge "$number" --merge --match-head-commit "$head"
            merged="$(gh pr view "$number" --json state,mergeCommit --jq 'if .state=="MERGED" then .mergeCommit.oid else "" end')"
            [[ "$merged" =~ ^[a-f0-9]{40}$ ]] || exit 0
            test "$(live_main)" = "$merged"
            gh api "repos/$GITHUB_REPOSITORY/issues/122/comments" --method POST -f body="Automatic verified candidate merged: #$number, head $head, main $merged, replay $replay. Public gameplay verification is still pending."
            ensure_public "$merged" "$base" || true
            exit 0
          done < <(jq -c '.[]' "$RUNNER_TEMP/open-release-prs.json")
