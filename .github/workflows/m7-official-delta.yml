name: M7 official delta audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/import_m7_official_delta.py
      - .github/workflows/m7-official-delta.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect M7 official delta (no catalog writes)
        run: python scripts/import_m7_official_delta.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m7-official-delta
          path: reports/m7-official-delta.json
          if-no-files-found: warn
