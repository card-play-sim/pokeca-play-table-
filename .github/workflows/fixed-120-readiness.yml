name: Fixed 120 readiness
on:
  push:
    branches: [main]
    paths:
      - 'data/fixed-test-decks.json'
      - 'ui/fixed-120-match-adapter.js'
      - 'ui/mobile.js'
      - 'ui/engine.bundle.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/fixed-120-readiness.test.js'
      - 'tests/playable-demo-smoke.test.js'
      - 'tests/image-evidence-bulk-import.test.js'
      - 'scripts/import-verified-image-evidence.cjs'
      - 'scripts/collect-official-image-evidence.cjs'
      - 'tests/official-image-collector.test.js'
      - '.github/workflows/fixed-120-readiness.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed JavaScript syntax
        run: |
          node --check ui/mobile.js
          node --check ui/engine.bundle.js
          node --check ui/fixed-120-match-adapter.js
          node --check sw.js
      - name: Validate fixed decks and safety gate
        run: |
          node tests/fixed-120-readiness.test.js
          node tests/playable-demo-smoke.test.js
          node tests/image-evidence-bulk-import.test.js
          node tests/official-image-collector.test.js
