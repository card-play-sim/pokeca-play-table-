name: Independently reviewed five-print release candidate build
on:
  push:
    branches: [automation/reviewed-five-current-main-20261128]
    paths: ['.github/workflows/reviewed-five-current-main.yml']
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18977a6666e9c490d111e47a0002ffc34cfdbc77
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned successful origin and exact current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46075497964" > "$RUNNER_TEMP/origin.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion=="success" and .head_sha=="1e0c657f63a975f92b98f093317ddc4641b2ccd1" and .head_branch=="automation/reviewed-five-current-main-20261128" and .head_repository.full_name==$repo and .path==".github/workflows/reviewed-five-current-main.yml"' "$RUNNER_TEMP/origin.json"
          test "$(git rev-parse HEAD)" = "18977a6666e9c490d111e47a0002ffc34cfdbc77"
          git fetch origin 1e0c657f63a975f92b98f093317ddc4641b2ccd1
          test "$(git rev-parse 1e0c657f63a975f92b98f093317ddc4641b2ccd1^)" = "18977a6666e9c490d111e47a0002ffc34cfdbc77"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15234836996/zip" > "$RUNNER_TEMP/origin.zip"
          printf '%s  %s\n' '640d31dd66faaf09a7642ebbd155bd7f1577bb9780e37f8ac368e7f44b1ea216' "$RUNNER_TEMP/origin.zip" | sha256sum -c -
          python - "$RUNNER_TEMP/origin.zip" "$RUNNER_TEMP/review" <<'PY'
          import sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[2]); (root/'attempt-1').mkdir(parents=True)
          with zipfile.ZipFile(sys.argv[1]) as z:
              for name in ('selected.json','proposal.patch','quarantine-result.json','browser-result.json'):
                  member=z.getinfo('attempt-1/'+name)
                  assert 0<member.file_size<262144
                  (root/'attempt-1'/name).write_bytes(z.read(member))
          PY
          python scripts/verify-unknown-quarantine-handoff.py "$RUNNER_TEMP/review" 1e0c657f63a975f92b98f093317ddc4641b2ccd1 46075497964 "$RUNNER_TEMP/handoff.json"
          for branch in $(git ls-remote --heads origin 'refs/heads/automation/control-013-intake-*' | sed -n 's|.*refs/heads/\(automation/control-013-intake-[0-9]*\)$|\1|p' | sort -Vr); do
            if ! git fetch origin "$branch"; then continue; fi
            if ! git cat-file -e FETCH_HEAD:data/official-effect-intake/checkpoint.json; then continue; fi
            checkpoint="$(git rev-parse FETCH_HEAD)"
            break
          done
          test -n "${checkpoint:-}"
          node scripts/verify-reviewed-official-scope.cjs "$RUNNER_TEMP/review" "$RUNNER_TEMP/handoff.json" "$checkpoint"
          python scripts/verify-unknown-approved-replay.py --preview "$RUNNER_TEMP/review" 1e0c657f63a975f92b98f093317ddc4641b2ccd1 46075497964 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/replay" "$checkpoint"
          jq -e '.reviewOnly==true and (.requiredQualifiedIds|sort)==["48299","50071","50160","50208","50694"] and .paths==["engine/reference-effect-plans.cjs"]' "$RUNNER_TEMP/replay/replay-entry.json"
          echo "CHECKPOINT=$checkpoint" >> "$GITHUB_ENV"
      - name: Build exact reviewed source and candidate in isolated tree
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/scratch"
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$scratch"
          git -C "$scratch" remote remove origin
          git -C "$scratch" fetch "$GITHUB_WORKSPACE" "$CHECKPOINT"
          (cd "$scratch"; python scripts/restore-official-intake-evidence.py "$CHECKPOINT" --merge; node scripts/refresh-uncompiled-official-facts.cjs --apply)
          python scripts/prepare-unknown-replay-intake.py "$scratch" "$RUNNER_TEMP/replay"
          git -C "$scratch" apply "$RUNNER_TEMP/replay/approved.patch"
          docker pull node:22-bookworm
          timeout 40m docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 5g --cpus 3 --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g --user "$(id -u):$(id -g)" --env HOME=/tmp --mount "type=bind,source=$scratch,target=/repo" --workdir /repo node:22-bookworm bash -euc '
            base="$(git rev-parse HEAD)"
            node scripts/build-effect-extensions.cjs
            node scripts/sync-reference-effects.cjs
            node scripts/stage-card-auto-connect.cjs "$base" work/model-candidate
            git restore --source=HEAD -- data/effect-extensions/compiled.json
            node scripts/build-effect-extensions.cjs
            node scripts/sync-reference-effects.cjs
            node scripts/build-pwa-release.cjs
            node scripts/report-ij-effect-coverage.cjs reports/ij-effect-coverage.json reports/ij-effect-executions.json
            node tests/control-014-shared-effects.test.cjs
            node tests/control-011-engine-batch.test.cjs
            node tests/atomic-official-to-battle.test.cjs
            node scripts/sync-reference-effects.cjs --check
            node scripts/build-pwa-release.cjs --check
          '
          python scripts/verify-unknown-quarantine-receipt.py "$RUNNER_TEMP/replay" "$scratch" "$GITHUB_WORKSPACE"
          python - "$scratch" "$RUNNER_TEMP/replay" "$RUNNER_TEMP/review" "$RUNNER_TEMP/candidate" <<'PY'
          import sys,json,hashlib,subprocess
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from importlib import import_module
          e=import_module('export-unknown-replay-candidate')
          s,o,review,out=map(Path,sys.argv[1:])
          target={'48299','50071','50160','50208','50694'}
          engine=json.loads((o/'quarantine-result.json').read_text())
          browser=json.loads((review/'attempt-1/browser-result.json').read_text())
          assert set(engine['sandboxQualified'])==set(browser['sandboxBrowserQualified'])==target
          assert engine['changedPriorIds']==[] and engine['targetFailures']==[] and browser['fullDeckAIMatchVerified'] is True
          files={p:e.safe_bytes(s,p) for p in e.FIXED|e.evidence_paths(target)}
          old=e.index(e.git('.', 'show','HEAD:data/effect-extensions/compiled.json'))
          new=e.index(files['data/effect-extensions/compiled.json'])
          assert e.unchanged_delta(old,new)==target
          prior=e.index(e.git('.','show','HEAD:data/effect-extensions/intake.json'))
          current=e.index(files['data/effect-extensions/intake.json'])
          saved=e.index(e.git('.','show','HEAD:data/official-effect-intake/checkpoint.json'))
          removed=e.verified_intake_delta(prior,current,old,saved,target)
          assert not removed, 'UNEXPECTED_INTAKE_REMOVAL_REVIEW_REQUIRED'
          for key in target:
              p='data/effect-extensions/evidence/'+key+'.json'
              proof=json.loads(files[p]); row=current[key]
              digest=e.digest(proof['html'].encode())
              assert digest==proof['htmlSha256']==row['source']['sha256']
              assert proof['url']==row['officialPageUrl']=='https://www.pokemon-card.com/card-search/details.php/card/'+key and row['source']['path']==p
              existing=Path(p)
              if existing.exists(): assert existing.read_bytes()==files[p]
          # Reproduce the exact source bytes in the clean host index, never execute generated source there.
          patch=(o/'approved.patch').read_bytes()
          subprocess.run(['git','apply','--cached',str(o/'approved.patch')],check=True)
          name='engine/reference-effect-plans.cjs'
          files[name]=e.git('.','show',':'+name)
          assert files[name]==e.safe_bytes(s,name)
          for name,data in files.items():
              dest=out/'files'/name; dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          (out/'manifest.json').write_text(json.dumps({'base':'18977a6666e9c490d111e47a0002ffc34cfdbc77','ids':sorted(target),'files':{k:e.digest(v) for k,v in files.items()},'state':'INDEPENDENTLY_REVIEWED_CANDIDATE_NOT_RELEASED','publicBattleVerified':[]},indent=2)+'\n')
          print('EXACT_FIVE_RELEASE_CANDIDATE_PREPARED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: independently-reviewed-five-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14
  preserve:
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18977a6666e9c490d111e47a0002ffc34cfdbc77
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: independently-reviewed-five-candidate
          path: ${{ runner.temp }}/candidate
      - name: Preserve review candidate without executing it or merging
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/candidate" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          root=Path(sys.argv[1]); m=json.loads((root/'manifest.json').read_text())
          expected={'engine/reference-effect-plans.cjs','data/effect-extensions/intake.json','data/effect-extensions/compiled.json','data/reference-effects/plans.json','ui/engine.bundle.js','sw.js','reports/ij-effect-coverage.json','reports/ij-effect-executions.json'}
          expected|={'data/effect-extensions/evidence/'+i+'.json' for i in ['48299','50071','50160','50208','50694']}
          assert m['base']=='18977a6666e9c490d111e47a0002ffc34cfdbc77' and m['state']=='INDEPENDENTLY_REVIEWED_CANDIDATE_NOT_RELEASED' and m['publicBattleVerified']==[]
          assert set(m['files'])==expected
          for name,digest in m['files'].items():
              p=root/'files'/name; dest=Path(name)
              assert p.is_file() and not p.is_symlink() and p.stat().st_size<64*1024*1024
              data=p.read_bytes(); assert hashlib.sha256(data).hexdigest()==digest
              assert not dest.is_symlink() and dest.resolve().is_relative_to(Path.cwd())
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          PY
          git add -- engine/reference-effect-plans.cjs data/effect-extensions/intake.json data/effect-extensions/compiled.json data/effect-extensions/evidence/{48299,50071,50160,50208,50694}.json data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/ij-effect-executions.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve independently reviewed exact five-print candidate; not release approved'
          git push origin "HEAD:refs/heads/automation/five-reviewed-candidate-$GITHUB_RUN_ID"
          echo "Candidate branch automation/five-reviewed-candidate-$GITHUB_RUN_ID $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
