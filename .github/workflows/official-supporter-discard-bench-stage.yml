name: Stage official H supporter discard-for-opponent-bench draw
on:
  push:
    branches:
      - feat/h-supporter-bench-discard-draw-20261122
    paths:
      - 'engine/reference-effect-plans.cjs'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'scripts/build-effect-extensions.cjs'
      - 'data/effect-extensions/intake.json'
      - 'tests/official-supporter-discard-bench.test.cjs'
      - 'tests/official-supporter-discard-bench-runtime.test.cjs'
      - '.github/workflows/official-supporter-discard-bench-stage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h-supporter-bench-discard-draw-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact official source and compiler scope
        run: |
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node tests/official-supporter-discard-bench.test.cjs
      - name: Generate extension plans, engine bundle and PWA
        run: |
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: Verify five H official supporter printings with physical discard and real gameplay
        run: node tests/official-supporter-discard-bench-runtime.test.cjs
      - name: Save exact generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/effect-extensions/compiled.json data/reference-effects/plans.json ui/engine.bundle.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate official H bench-based supporter draw effects'
            git push origin HEAD:feat/h-supporter-bench-discard-draw-20261122
          fi
