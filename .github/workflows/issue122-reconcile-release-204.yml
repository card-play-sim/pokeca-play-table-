name: Issue122 reconcile next release without losing prior cards
on:
  push:
    branches: [battle/issue122-release-259-20261125]
    paths: ['.github/workflows/issue122-reconcile-release-204.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue122-reconcile-release-204
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge current published main into candidate with fail-closed conflict policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          base=$(git rev-parse origin/main)
          test "$base" = a3ff71eabf7c95e2cb45ba535632e6665941dffc
          git show "$base:data/effect-extensions/compiled.json" > /tmp/public-compiled.json
          git show HEAD:data/effect-extensions/compiled.json > /tmp/candidate-compiled.json
          git merge --no-commit --no-ff "$base" || true
          mkdir -p artifacts
          git diff --name-only --diff-filter=U > artifacts/conflicts.txt
          cat artifacts/conflicts.txt
          while IFS= read -r file; do
            test -n "$file" || continue
            case "$file" in
              reports/official-effect-continuation/queue/receipts/*.json)
                # Keep the candidate execution receipt only when it proves the same task and result.
                git show ":2:$file" > /tmp/candidate-receipt.json
                git show ":3:$file" > /tmp/public-receipt.json
                node -e 'const a=require("node:assert/strict"),x=require("/tmp/candidate-receipt.json"),y=require("/tmp/public-receipt.json"); for(const k of ["jobId","taskFingerprint","status","result"]) a.deepEqual(x[k],y[k],process.argv[1]+":"+k)' "$file"
                git checkout --ours -- "$file"
                git add "$file"
                ;;
              reports/official-effect-continuation/atomic-battle-connection-shared-mechanic-worklist.json|reports/official-effect-continuation/atomic-battle-connection.json|reports/official-effect-continuation/queue/queue.json|reports/official-effect-continuation/status.json)
                # Generated snapshots from the newer all-card replay. Both originals remain in merge parents.
                git checkout --ours -- "$file"
                git add "$file"
                ;;
              data/effect-extensions/compiled.json|data/effect-extensions/intake.json|data/official-effect-intake/checkpoint.json|reports/ij-effect-coverage.json|ui/engine.bundle.js|sw.js)
                # These generated files must subsequently pass exact-record and rebuild gates.
                git checkout --ours -- "$file"
                git add "$file"
                ;;
              *) echo "UNRESOLVED_SOURCE_CONFLICT: $file"; exit 1 ;;
            esac
          done < artifacts/conflicts.txt
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const read=f=>JSON.parse(fs.readFileSync(f)).records;
          const current=read('data/effect-extensions/compiled.json');
          const map=new Map(current.map(r=>[String(r.officialCardId),r]));
          assert.equal(map.size,current.length);
          for(const file of ['/tmp/public-compiled.json','/tmp/candidate-compiled.json'])
            for(const old of read(file))assert.deepEqual(map.get(String(old.officialCardId)),old,'PRESERVATION_CONFLICT:'+old.officialCardId);
          const known=new Set(read('/tmp/public-compiled.json').map(r=>String(r.officialCardId)));
          const added=current.filter(r=>!known.has(String(r.officialCardId)));
          assert.equal(added.length,73,'UNEXPECTED_RELEASE_DELTA');
          fs.writeFileSync('artifacts/exact-release-delta.json',JSON.stringify({added:added.map(r=>r.officialCardId),count:added.length},null,2));
          console.log('Exact prior and candidate records preserved; 73 new prints');
          NODE
          test -z "$(git diff --name-only --diff-filter=U)"
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
          git diff --check
          git commit -m 'Merge current published main while preserving all exact verified card records' || test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:battle/issue122-release-259-20261125
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue122-release204-reconcile
          path: artifacts/
