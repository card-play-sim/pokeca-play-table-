name: Unknown effect verified review handoff
on:
  workflow_run:
    workflows: ["Local unknown effect code generation quarantine"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  handoff:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: local-unknown-effect-quarantine
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/review-input
      - name: Validate evidence as inert data only
        env:
          ORIGIN_SHA: ${{ github.event.workflow_run.head_sha }}
          ORIGIN_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python scripts/verify-unknown-quarantine-handoff.py --self-test
          python scripts/verify-unknown-quarantine-handoff.py "$RUNNER_TEMP/review-input" "$ORIGIN_SHA" "$ORIGIN_RUN" "$RUNNER_TEMP/review-handoff.json"
      - uses: actions/upload-artifact@v4
        with:
          name: unknown-effect-review-handoff
          path: ${{ runner.temp }}/review-handoff.json
          if-no-files-found: error
          retention-days: 14
