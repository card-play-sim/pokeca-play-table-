name: G-BASE-008 UI effect contract
on:
  pull_request:
    paths:
      - 'ui/mobile.js'
      - 'data/effect-extensions/**'
      - 'tests/control-008-extensions.test.cjs'
      - 'tests/test_control_008_extensions_browser.py'
      - 'tests/fixtures/control-008-extension-manifest.cjs'
      - 'tests/control-006-abilities.test.cjs'
      - 'tests/test_control_006_browser.py'
      - 'tests/fixtures/control-005-scenarios.js'
      - 'ui/table-components.js'
      - 'ui/card-back.svg'
      - 'tests/table-components.test.cjs'
      - 'tests/test_ui_control_008_browser.py'
      - 'ui/app-update.js'
      - 'index.html'
      - 'update.html'
      - 'ui/pwa-recovery.js'
      - 'tests/test_control_003_update_browser.py'
      - 'tests/pwa-release.test.cjs'
      - 'tests/g-base-008-ui-contract.test.cjs'
      - 'tests/test_reference_match_browser.py'
      - 'tests/test_g_base_008_browser.py'
      - 'tests/test_control_002_browser.py'
      - 'tests/browser_opening.py'
      - 'tests/control-002-opening.test.cjs'
      - 'engine/pokeca_selection_constraints.cjs'
      - 'tests/fixtures/g-base-008-browser.js'
      - 'sw.js'
      - '.github/workflows/g-base-008-ui-contract.yml'
  workflow_dispatch:
jobs:
  ui-effect-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser entry syntax
        run: node --check ui/mobile.js
      - name: Validate UI effect and persistence contracts
        run: |
          node --test tests/g-base-008-ui-contract.test.cjs
          node tests/control-002-opening.test.cjs
          node tests/table-components.test.cjs
          node tests/control-005-effect-matrix.test.cjs
          node tests/control-006-abilities.test.cjs
          node tests/control-006-official-evidence.test.cjs
          node scripts/build-effect-extensions.cjs --check
          node tests/control-008-extensions.test.cjs
          node scripts/report-control-006-connections.cjs
      - name: Preserve effect-level connection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-006-node-evidence
          path: test-results/control-00*.json
      - name: Verify bundle and PWA release hashes
        run: |
          node scripts/check-reference-bundle-sync.cjs
          node scripts/build-pwa-release.cjs --check
  chromium-gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise candidate gameplay and exact save-resume in Chromium
        run: |
          mkdir -p artifacts
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/pokeca-gameplay-server.log 2>&1 &
          python tests/test_control_008_extensions_browser.py
          python tests/test_control_006_browser.py
          python tests/test_ui_control_008_browser.py
          python tests/test_control_002_browser.py
          python tests/test_g_base_008_browser.py
          python tests/test_reference_match_browser.py
          POKECA_TEST_URL=http://127.0.0.1:8765/ python tests/test_published_pwa_browser.py
          POKECA_TEST_URL=http://127.0.0.1:8765/ python tests/test_release_delivery_browser.py
      - name: Preserve candidate gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-gameplay-evidence
          path: |
            artifacts/control-008-*
            artifacts/control-006-*
            artifacts/ui-control-008-*
            artifacts/control-002-browser-results.json
            artifacts/control-002-opening-*.png
            artifacts/g-base-008-browser-results.json
            artifacts/reference-browser-results.json
            artifacts/published-pwa-result.json
          if-no-files-found: warn

  installed-pwa-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Upgrade actual v246 cache with persistent storage and cold restarts
        run: python tests/test_control_003_update_browser.py
      - name: Preserve installed PWA upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-pwa-upgrade-evidence
          path: artifacts/control-003-*
          if-no-files-found: warn
