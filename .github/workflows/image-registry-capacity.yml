name: Image registry importer capacity
on:
  pull_request:
    paths:
      - 'tools/import-image-registry.mjs'
      - 'tests/image-registry-import.test.mjs'
      - '.github/workflows/image-registry-capacity.yml'
  workflow_dispatch:
jobs:
  capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 5001 record capacity and safe resume
        run: node tests/image-registry-import.test.mjs
