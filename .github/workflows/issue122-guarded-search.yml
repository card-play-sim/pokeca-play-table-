name: 条件付き山札検索9印刷版・並列高速検証
on:
  push:
    branches: [battle/issue122-guarded-search-20261128]
    paths: ['.github/workflows/issue122-guarded-search.yml']
  workflow_dispatch:
concurrency:
  group: issue122-guarded-search
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_INTAKE_REQUESTED_TARGETS: '45936,46062,46068,47488,47527,48702,49451,50287,50313'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58e9c7d89ee6e9ece08abc64fa5cecc5baf5af7c HEAD
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" const generic=text.normalize('NFKC');\",\"to\":\" const generic=text.normalize('NFKC');\\n const guardedSearch=(category,limit,extras)=>({mechanic:'MASS_ZONE_TRANSFER',commands:['SEARCH_DECK',...(extras.privateSearch?[]:['REVEAL']),'ADD_TO_HAND','SHUFFLE_DECK'],zone:'deck',destination:'hand',category,type:null,stage:null,team:null,limit,activeOnly:false,sharedWording:true,...extras});\\n if(kind==='MAIN'&&entry.category==='supporter'&&/^このカードは、自分の手札がこのカード1枚だけのときにしか使えない。\\\\s*自分の山札から好きなカードを2枚まで選び、手札に加える。そして山札を切る。$/.test(generic))return guardedSearch('any',2,{onlyHandCard:true,privateSearch:true});\\n if(kind==='MAIN'&&entry.category==='supporter'&&/^このカードは、先攻プレイヤーの最初の番でも使える。\\\\s*自分の山札からたねポケモンの「ロケット団のポケモン」を3枚まで選び、相手に見せて、手札に加える。そして山札を切る。$/.test(generic))return guardedSearch('pokemon',3,{firstTurnAllowed:true,team:'ロケット団',stage:0});\\n if(kind==='ABILITY'&&generic==='自分の手札が1枚もないなら、自分の番に1回使える。自分の山札からサポートを1枚選び、相手に見せて、手札に加える。そして山札を切る。')return guardedSearch('supporter',1,{emptyHand:true});\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"g.turnNumber!==1||r.mainPlan.mechanic==='SUPPORTER_FIRST_TURN_DISCARD_HAND_DRAW'\",\"to\":\"g.turnNumber!==1||r.mainPlan.mechanic==='SUPPORTER_FIRST_TURN_DISCARD_HAND_DRAW'||r.mainPlan.firstTurnAllowed===true\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\" if(m==='MASS_ZONE_TRANSFER')assert(a.plan.zone==='deck'?p.deck.length>0:p.discard.some(c=>massTransferCandidate(c,a.plan)),'NO_MASS_TRANSFER_SOURCE');\",\"to\":\" if(m==='MASS_ZONE_TRANSFER'){\\n  assert(!a.plan.emptyHand||p.hand.length===0,'SEARCH_EMPTY_HAND_REQUIRED');\\n  assert(a.plan.zone==='deck'?p.deck.length>0:p.discard.some(c=>massTransferCandidate(c,a.plan)),'NO_MASS_TRANSFER_SOURCE');\\n }\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"   if(m==='MASS_ZONE_TRANSFER')assert(r.mainPlan.zone==='deck'?p.deck.length>0:p.discard.some(c=>massTransferCandidate(c,r.mainPlan)),'NO_MASS_TRANSFER_SOURCE');\",\"to\":\"   if(m==='MASS_ZONE_TRANSFER'){\\n    assert(!r.mainPlan.onlyHandCard||p.hand.length===1&&id(p.hand[0])===id(card),'SEARCH_ONLY_HAND_CARD_REQUIRED');\\n    assert(r.mainPlan.zone==='deck'?p.deck.length>0:p.discard.some(c=>massTransferCandidate(c,r.mainPlan)),'NO_MASS_TRANSFER_SOURCE');\\n   }\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"   if(plan.zone==='deck')searchSelectedDeck(g,actor,p,ids('cards'));\",\"to\":\"   if(plan.zone==='deck')searchSelectedDeck(g,actor,p,ids('cards'),{reveal:!plan.privateSearch});\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    const own=frame.game.players[0],plan=e.plan,eligible=c=>massTransferCandidate(c,plan);\\n    if(plan.zone==='discard'){\",\"to\":\"    const own=frame.game.players[0],plan=e.plan,eligible=c=>massTransferCandidate(c,plan);\\n    if(plan.onlyHandCard||plan.emptyHand){\\n      const moved=own.hand.filter(c=>!plan.onlyHandCard||c.id!==frame.sourceId);\\n      own.hand=own.hand.filter(c=>!moved.includes(c));own.deck.push(...moved);\\n    }\\n    if(plan.zone==='discard'){\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    assert(effectEvents.some(ev=>ev?.command==='REVEAL'&&ids.every(id=>ev.cardIds?.includes(id))));\",\"to\":\"    if(plan.privateSearch)assert(!effectEvents.some(ev=>ev?.command==='REVEAL'&&ev.cardIds?.some(id=>ids.includes(id))));\\n    else assert(effectEvents.some(ev=>ev?.command==='REVEAL'&&ids.every(id=>ev.cardIds?.includes(id))));\\n    if(plan.onlyHandCard||plan.emptyHand){\\n      assert.equal(own.hand.length,plan.onlyHandCard?1:0);\\n      const denied=structuredClone(before),side=denied.players[0],extra=side.deck.findIndex(c=>!ids.includes(c.id));\\n      assert(extra>=0);side.hand.push(side.deck.splice(extra,1)[0]);\\n      const retry=port(denied);assert.equal(retry.dispatch('you',action).ok,false);assert.deepEqual(retry.getSnapshot(),denied);\\n    }\\n    if(plan.firstTurnAllowed){\\n      assert(ids.every(id=>own.deck.some(c=>c.id===id&&E.getReferenceEffectRecord(c).facts.basic&&E.getReferenceEffectRecord(c).name.startsWith('ロケット団の'))));\\n      const first=structuredClone(before);first.turnNumber=1;first.players[0].turnLimits={};\\n      const pp=port(first);assert(pp.dispatch('you',action).ok);\\n      const used=structuredClone(first);used.players[0].turnLimits={supporterUsed:true};\\n      assert.equal(port(used).dispatch('you',action).ok,false);\\n    }\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"    plan=f['e']['plan'];picked=set(option['action']['selections']['cards'])\\n    if plan.get('requiresTera'):\",\"to\":\"    plan=f['e']['plan'];picked=set(option['action']['selections']['cards'])\\n    if plan.get('onlyHandCard') or plan.get('emptyHand'):\\n     assert len(before['players'][0]['hand'])==(1 if plan.get('onlyHandCard') else 0)\\n    if plan.get('privateSearch'):\\n     assert not any(ev.get('details',{}).get('command')=='REVEAL' and picked.intersection(ev['details'].get('cardIds',[])) for ev in events)\\n    if plan.get('firstTurnAllowed'):\\n     assert await page.evaluate(\\\"cs=>cs.every(c=>{const r=Pokeca.getReferenceEffectRecord(c);return r.facts.basic&&r.name.startsWith('ロケット団の')})\\\",[c for c in before['players'][0]['deck'] if c['id'] in picked])\\n    if plan.get('requiresTera'):\"},{\"path\":\"scripts/run-atomic-official-battle-intake.cjs\",\"from\":\"    run(command,args,env);\\n    console.log('ATOMIC_BATTLE_STEP_PASS '+name);\",\"to\":\"    if(name==='EXECUTE_ALL_CARD_EFFECTS_IN_REAL_ENGINE'&&env.POKECA_INTAKE_REQUESTED_TARGETS){\\n      const fs=require('node:fs');\\n      const requested=env.POKECA_INTAKE_REQUESTED_TARGETS.split(',');\\n      if(new Set(requested).size!==requested.length||requested.some(id=>!/^[1-9][0-9]{0,7}$/.test(id)))throw Error('INVALID_REQUESTED_TARGETS');\\n      const compiled='data/effect-extensions/compiled.json';\\n      const prior=spawnSync('git',['show',base+':'+compiled],{encoding:'utf8',maxBuffer:64*1024*1024});\\n      if(prior.status!==0)throw Error('BASE_COMPILED_UNAVAILABLE');\\n      const old=new Set(JSON.parse(prior.stdout).records.map(r=>String(r.officialCardId)));\\n      const available=new Set(JSON.parse(fs.readFileSync(compiled,'utf8')).records.map(r=>String(r.officialCardId)).filter(id=>!old.has(id)));\\n      const selected=requested.filter(id=>available.has(id));\\n      const unresolved=requested.filter(id=>!old.has(id)&&!available.has(id));\\n      fs.mkdirSync(work,{recursive:true});\\n      fs.writeFileSync(work+'/requested-scope.json',JSON.stringify({base,requested,selected,unresolved,alreadyPublished:requested.filter(id=>old.has(id))},null,2));\\n      console.log('EXACT_SCOPE_CLASSIFICATION '+JSON.stringify({selected,unresolved}));\\n      if(!selected.length)throw Error('NO_REQUESTED_TARGET_COMPILED');\\n      env.POKECA_INTAKE_EXACT_TARGETS=selected.join(',');\\n    }\\n    run(command,args,env);\\n    console.log('ATOMIC_BATTLE_STEP_PASS '+name);\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Print exact evolution target diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def visit(x,p):
              if isinstance(x,dict):
                  slot=x.get('slot')
                  if isinstance(slot,str) and any(slot.startswith(i+':') for i in ('47583','47986','47994','45265','45552','48637','46519','50262','50318','45735','48992','50129','50781','45259','45560','49202','47355','48684','49398','50255','50317','50333','46446','46661','48705','47733','46445','50394','50528','47099','48678','49382','46220','49374')) and x.get('status') in ('FAILED','BLOCKED'):
                      print(p,json.dumps(x,ensure_ascii=False)[:5000])
                  for v in x.values(): visit(v,p)
              elif isinstance(x,list):
                  for v in x: visit(v,p)
          for p in pathlib.Path('work/card-auto-connect').rglob('*.json'):
              try: visit(json.loads(p.read_text()),str(p))
              except (ValueError,OSError): pass
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=[].filter(id=>!old.has(id));
          const targets=["45936","46062","46068","47488","47527","48702","49451","50287","50313"].filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,targets,added,missing,unresolvedTargets:targets.filter(id=>!now.has(id)),count:added.length};fs.writeFileSync('artifacts/guarded-search-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          bash scripts/run-intake-candidate-browser-shards.sh guarded-search
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/guarded-search-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/guarded-search-candidate.json
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified combined next release'
          ref="HEAD:refs/heads/battle/issue122-guarded-search-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-search-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
