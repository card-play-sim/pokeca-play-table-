name: 残件34印刷版・動的HPと山札順序の共通再検証
on:
  push:
    branches: [battle/issue122-next33-20261128]
    paths: ['.github/workflows/issue122-next33.yml']
  workflow_dispatch:
concurrency:
  group: issue122-next33
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_INTAKE_REQUESTED_TARGETS: '45230,46673,48789,47588,47957,49106,50134,50190,47661,48034,49040,47583,47986,47994,48637,50262,50318,50394,50528,46452,47426,45962,50127,50377,50525,47300,47350,47366,47376,47436,47453,48532,48749,49150'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach 101a4701a646cba17fd47f6ad49a69bcdf335c6c
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit origin/main
          git merge-base --is-ancestor 101a4701a646cba17fd47f6ad49a69bcdf335c6c HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"tests/fixtures/control-005-scenarios.js\",\"from\":\"const mon=c=>Object.assign(c,{cardId:c.id,damage:0,enteredTurn:0,energyCards:[],energies:[],tools:[]});\",\"to\":\"const mon=c=>Object.assign(c,{hp:record(c).facts.hp,cardId:c.id,damage:0,enteredTurn:0,energyCards:[],energies:[],tools:[]});\"},{\"path\":\"tests/fixtures/control-005-scenarios.js\",\"from\":\"  const port=E.createUIPort({getGame:()=>g,setGame:x=>g=x}),loaded=port.loadGame(g);\",\"to\":\"  // Recalculate fixture-only dynamic HP after physically reassigning zones.\\n  // The actual gateway still validates the derived HP; it is not bypassed.\\n  for(const side of g.players)for(const c of [side.active,...side.bench].filter(Boolean)){\\n   for(const a of record(c).abilities.filter(a=>a.plan?.mechanic==='PASSIVE_DYNAMIC_MAX_HP')){\\n    const plan=a.plan,opponent=g.players.find(p=>p.id!==side.id);\\n    const n=plan.mode==='opponentPrizes'?6-opponent.prizeCards.length:c.energyCards.filter(e=>!e.isSpecial&&e.energyType===plan.type).length;\\n    c.hp+=plan.amount*n;\\n   }\\n  }\\n  const port=E.createUIPort({getGame:()=>g,setGame:x=>g=x}),loaded=port.loadGame(g);\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    const empty=port(zero).getSnapshot(),changed=port(game),before=changed.getSnapshot();\\n    const n=plan.mode==='opponentPrizes'?2:mon.energyCards.filter(c=>c.energyType===plan.type).length;\",\"to\":\"    const n=plan.mode==='opponentPrizes'?6-other.prizeCards.length:mon.energyCards.filter(c=>!c.isSpecial&&c.energyType===plan.type).length;\\n    zown.active.hp=r.facts.hp;\\n    if(plan.mode!=='opponentPrizes')zown.active.energies=[];\\n    mon.hp=r.facts.hp+n*plan.amount;\\n    const empty=port(zero).getSnapshot(),changed=port(game),before=changed.getSnapshot();\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    const original=before.players[i].deck.map(c=>c.id),result=after.players[i].deck.map(c=>c.id),count=Math.min(plan.count,original.length);\\n    assert(count>0);assert.equal(chosen.length,count);assert.deepEqual(Array.from(result.slice(0,count)),Array.from(chosen));\\n    assert.deepEqual([...result].sort(),[...original].sort());\\n    if(!plan.search)assert.deepEqual(Array.from(result.slice(count)),Array.from(original.slice(count)));\\n    const events=after.history.slice(before.history.length);\\n    assert.equal(events.some(ev=>ev.details?.command==='SHUFFLE_DECK'),plan.search);\\n    assert(events.some(ev=>ev.details?.command==='RETURN_TO_DECK'&&ev.details.position==='top'&&ev.details.privateTo==='you'));\\n    if(count>1){\\n     const reverse=port(before);assert(reverse.dispatch('you',{...action,selections:{...action.selections,cards:[...chosen].reverse()}}).ok);\\n     assert.deepEqual(Array.from(reverse.getSnapshot().players[i].deck.slice(0,count),c=>c.id),[...chosen].reverse());\\n    }\",\"to\":\"    const owner=before.players[i],original=Array.from(owner.deck,c=>c.id),count=Math.min(plan.count,original.length);\\n    assert(count>0);assert.equal(chosen.length,count);\\n    const assertOrder=(state,picks)=>{\\n      const resolved=state.players[i],result=Array.from(resolved.deck,c=>c.id),expected=[...picks,...original.slice(count)];\\n      let drawn=[];\\n      if(!plan.search&&i===1&&action.type==='attack_turn'&&state.turnPlayer===owner.id&&result.length===original.length-1){\\n        drawn=[picks[0]];\\n        assert(!owner.hand.some(c=>c.id===drawn[0])&&resolved.hand.some(c=>c.id===drawn[0]),'DECK_ORDER_NEXT_TURN_DRAW_EXACT_ID');\\n      }\\n      assert.deepEqual([...result,...drawn].sort(),[...original].sort());\\n      if(plan.search)assert.deepEqual(result.slice(0,count),Array.from(picks));\\n      else assert.deepEqual(result,expected.slice(drawn.length),'DECK_ORDER_REMAINING_EXACT_IDS');\\n      const events=state.history.slice(before.history.length);\\n      assert.equal(events.some(ev=>ev.details?.command==='SHUFFLE_DECK'),plan.search);\\n      const receipt=events.find(ev=>ev.details?.command==='RETURN_TO_DECK'&&ev.details.position==='top'&&ev.details.privateTo==='you'&&ev.details.playerId===owner.id);\\n      assert(receipt);assert.deepEqual(Array.from(receipt.details.cardIds),Array.from(picks));\\n    };\\n    assertOrder(after,chosen);\\n    if(count>1){\\n     const reverse=port(before),picks=[...chosen].reverse();assert(reverse.dispatch('you',{...action,selections:{...action.selections,cards:picks}}).ok);\\n     assertOrder(reverse.getSnapshot(),picks);\\n    }\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"    assert len(chosen)==count and result[:count]==chosen and sorted(result)==sorted(original)\\n    if not plan['search']:assert result[count:]==original[count:]\\n    assert any(ev.get('details',{}).get('command')=='SHUFFLE_DECK' for ev in events)==plan['search']\",\"to\":\"    assert len(chosen)==count\\n    owner=before['players'][i];resolved=after['players'][i];drawn=[]\\n    if not plan['search'] and i==1 and option['action']['type']=='attack_turn' and after['turnPlayer']==owner['id'] and len(result)==len(original)-1:\\n     drawn=[chosen[0]]\\n     assert drawn[0] not in [card['id'] for card in owner['hand']]\\n     assert drawn[0] in [card['id'] for card in resolved['hand']]\\n    assert sorted(result+drawn)==sorted(original)\\n    if plan['search']:assert result[:count]==chosen\\n    else:assert result==(chosen+original[count:])[len(drawn):]\\n    assert any(ev.get('details',{}).get('command')=='SHUFFLE_DECK' for ev in events)==plan['search']\\n    assert any(ev.get('details',{}).get('command')=='RETURN_TO_DECK' and ev['details'].get('position')=='top' and ev['details'].get('playerId')==owner['id'] and ev['details'].get('cardIds')==chosen for ev in events)\"},{\"path\":\"tests/fixtures/control-009-extension-manifest.cjs\",\"from\":\"const wantsMill=row.attacks?.some(a=>a.plan?.mechanic==='COIN_UNTIL_TAILS_MILL');\",\"to\":\"const wantsMill=row.attacks?.some(a=>['COIN_UNTIL_TAILS_MILL','DECK_ORDER_SELECT'].includes(a.plan?.mechanic));\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"await page.evaluate('seed=>{Math.random=()=>seed/4294967296}',seed);\",\"to\":\"await page.evaluate('seed=>{let state=seed>>>0;Math.random=()=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296}}',seed);\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          node --check tests/fixtures/control-005-scenarios.js
          node --check tests/fixtures/control-009-extension-manifest.cjs
          python -m py_compile tests/test_control_013_browser.py
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Summarize existing candidate diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,collections
          p=pathlib.Path('work/card-auto-connect/candidate.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('QUALIFIED',len(d.get('qualified',[])))
              print('BLOCKERS',dict(collections.Counter(row.get('reason') for row in d.get('blockers',[]))))
          gaps=pathlib.Path('work/card-auto-connect/execution-gaps.json')
          if gaps.exists():
              for row in json.loads(gaps.read_text()).get('gaps',[]): print('EXACT_EXECUTION_GAP',json.dumps(row,ensure_ascii=False)[:2500])
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=[].filter(id=>!old.has(id));
          const targets=process.env.POKECA_INTAKE_REQUESTED_TARGETS.split(',').filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,targets,added,missing,unresolvedTargets:targets.filter(id=>!now.has(id)),count:added.length};fs.writeFileSync('artifacts/next33-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          bash scripts/run-intake-candidate-browser-shards.sh next33
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/next33-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/next33-candidate.json
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified combined next release'
          ref="HEAD:refs/heads/battle/issue122-next33-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next33-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
