name: 全残件一括接続・動的HPとチーム強化共通修復
on:
  push:
    branches: [battle/issue122-next33-20261128]
    paths: ['.github/workflows/issue122-next33.yml']
  workflow_dispatch:
concurrency:
  group: issue122-next33-broad
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_PARALLEL_RESERVED: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach 091128da7550d8980c8cd7b624222cf38ac4d453
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"const option=changed.getPokemonActions('you',mon.id).find(o=>o.kind==='attack'&&o.action.attackIndex===index&&o.ok);\",\"to\":\"const option=changed.getPokemonActions('you',mon.id).find(o=>o.kind==='attack'&&o.action.attackIndex===index&&(o.ok??o.enabled));\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(m==='PASSIVE_TEAM_ATTACK_BOOST'){\\n    const plan=e.plan,all=[...records.values()];\\n    const line=record=>{\\n      if(record.facts.basic)return [record];\\n      if(!(record.facts.stage>0))return null;\\n      const parent=all.find(x=>x.category==='pokemon'&&x.name===record.facts.evolvesFrom&&x.facts.stage===record.facts.stage-1&&x.attacks.every(a=>a.plan)&&!x.abilities.length);\\n      const previous=parent&&line(parent);return previous?[...previous,record]:null;\\n    };\\n    const holderChain=line(r);\\n    if(!holderChain)return {blocked:'NO_TEAM_BOOST_HOLDER_EVOLUTION_LINE'};\\n    const attackIndex=x=>x.attacks.findIndex(a=>a.plan?.mechanic==='VANILLA_DAMAGE'&&Number(a.damage)>0&&Number(a.damage)<=100&&a.cost.length>0&&a.cost.every(t=>['草','炎','水','雷','超','闘','悪','鋼','無色'].includes(t)));\\n    const matches=x=>x.category==='pokemon'&&x.officialCardId!==r.officialCardId&&x.name!==r.name&&!x.abilities.length&&x.attacks.every(a=>a.plan)&&attackIndex(x)>=0&&(plan.evolvedSource?x.facts.stage>0:x.facts.basic)&&(!plan.team||x.name.startsWith(plan.team+'の'))&&(!plan.types.length||plan.types.some(t=>x.facts.types.includes(t)));\\n    const attackerChain=all.filter(matches).map(line).find(chain=>chain&&!chain.some(x=>holderChain.some(h=>h.deckName===x.deckName)));\\n    if(!attackerChain)return {blocked:'NO_TEAM_BOOST_ATTACKER'};\\n    const attacker=attackerChain.at(-1),i=attackIndex(attacker),damage=Number(attacker.attacks[i].damage);\\n    const defenders=all.filter(x=>x.category==='pokemon'&&!x.abilities.length&&x.attacks.every(a=>a.plan)&&(plan.evolvedTarget?x.facts.stage>0:x.facts.basic)&&x.facts.hp>damage+plan.amount&&!x.facts.weakness?.types.some(t=>attacker.facts.types.includes(t))&&!x.facts.resistance?.types.some(t=>attacker.facts.types.includes(t)));\\n    const defenderChain=defenders.map(line).find(Boolean);\\n    if(!defenderChain)return {blocked:'NO_TEAM_BOOST_DEFENDER'};\\n\",\"to\":\"  if(m==='PASSIVE_TEAM_ATTACK_BOOST'){\\n    const plan=e.plan,all=[...records.values()];\\n    // Prefer the original simple fixtures, but allow alternative fully\\n    // connected evolution parents and ordinary active abilities. Exact\\n    // damage, legal evolution and physical identity proofs remain mandatory.\\n    const legal=all.filter(x=>x.category==='pokemon'&&x.attacks.length&&x.attacks.every(a=>a.plan)&&x.abilities.every(a=>a.plan));\\n    const simpleFirst=[...legal.filter(x=>!x.abilities.length),...legal.filter(x=>x.abilities.length)];\\n    const line=record=>evolutionLines(record,simpleFirst).next().value||null;\\n    const holderChain=line(r);\\n    if(!holderChain)return {blocked:'NO_TEAM_BOOST_HOLDER_EVOLUTION_LINE'};\\n    const attackIndex=x=>x.attacks.findIndex(a=>a.plan?.mechanic==='VANILLA_DAMAGE'&&Number(a.damage)>0&&Number(a.damage)<=150&&a.cost.every(t=>['草','炎','水','雷','超','闘','悪','鋼','無色'].includes(t)));\\n    // Do not admit continuous abilities as incidental damage modifiers.\\n    const ordinary=x=>!x.abilities.length||x.abilities.every(a=>a.plan?.origin==='activeEntry'||a.plan?.commands?.includes('DRAW'));\\n    const matches=x=>x.officialCardId!==r.officialCardId&&x.name!==r.name&&ordinary(x)&&attackIndex(x)>=0&&(plan.evolvedSource?x.facts.stage>0:x.facts.basic)&&(!plan.team||x.name.startsWith(plan.team+'の'))&&(!plan.types.length||plan.types.some(t=>x.facts.types.includes(t)));\\n    const attackers=simpleFirst.filter(matches);\\n    let attackerChain=null,defenderChain=null;\\n    for(const candidate of attackers){\\n      const chain=line(candidate);\\n      if(!chain||chain.some(x=>holderChain.some(h=>h.deckName===x.deckName)))continue;\\n      const damage=Number(candidate.attacks[attackIndex(candidate)].damage);\\n      const defenders=simpleFirst.filter(x=>!x.abilities.length&&(plan.evolvedTarget?x.facts.stage>0:x.facts.basic)&&x.facts.hp>damage+plan.amount&&!x.facts.weakness?.types.some(t=>candidate.facts.types.includes(t))&&!x.facts.resistance?.types.some(t=>candidate.facts.types.includes(t)));\\n      const opponent=defenders.map(line).find(Boolean);\\n      if(opponent){attackerChain=chain;defenderChain=opponent;break;}\\n    }\\n    if(!attackerChain||!defenderChain)return {blocked:attackers.length?'NO_TEAM_BOOST_LEGAL_PAIR':'NO_TEAM_BOOST_ATTACKER'};\\n    const attacker=attackerChain.at(-1),i=attackIndex(attacker);\\n\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              if s.count(change['from'])==0 and s.count(change['to'])==1: continue
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          python -m py_compile tests/test_control_013_browser.py
          node --check scripts/build-intake-verification-fixtures.cjs
          node scripts/list-card-auto-connect-ids.cjs /tmp/broad-targets.json
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const reserved=new Set(process.env.POKECA_PARALLEL_RESERVED.split(',').filter(Boolean));
          const targets=JSON.parse(fs.readFileSync('/tmp/broad-targets.json')).map(String).filter(id=>!reserved.has(id));
          assert(targets.length>0&&new Set(targets).size===targets.length);
          assert(targets.every(id=>/^[1-9][0-9]{0,7}$/.test(id)&&!reserved.has(id)));
          fs.appendFileSync(process.env.GITHUB_ENV,'POKECA_INTAKE_REQUESTED_TARGETS='+targets.join(',')+'\n');
          console.log('BROAD_UNRESOLVED_SCOPE',targets.length,'reserved concurrent',reserved.size);
          NODE
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Summarize existing candidate diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,collections
          p=pathlib.Path('work/card-auto-connect/candidate.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('QUALIFIED',len(d.get('qualified',[])))
              print('BLOCKERS',dict(collections.Counter(row.get('reason') for row in d.get('blockers',[]))))
          gaps=pathlib.Path('work/card-auto-connect/execution-gaps.json')
          if gaps.exists():
              for row in json.loads(gaps.read_text()).get('gaps',[])[:100]: print('EXACT_EXECUTION_GAP',json.dumps(row,ensure_ascii=False)[:2500])
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=[].filter(id=>!old.has(id));
          const targets=process.env.POKECA_INTAKE_REQUESTED_TARGETS.split(',').filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,targets,added,missing,unresolvedTargets:targets.filter(id=>!now.has(id)),count:added.length};fs.writeFileSync('artifacts/next33-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          bash scripts/run-intake-candidate-browser-shards.sh next33
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/next33-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/next33-candidate.json
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified combined next release'
          ref="HEAD:refs/heads/battle/issue122-next33-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next33-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
