name: 合格26枚維持・後続33印刷版統合高速検証
on:
  push:
    branches: [battle/issue122-next33-20261128]
    paths: ['.github/workflows/issue122-next33.yml']
  workflow_dispatch:
concurrency:
  group: issue122-next33
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_INTAKE_REQUESTED_TARGETS: '45230,46673,48789,47588,47957,49106,45284,45562,46826,47206,49414,50134,50190,47661,48034,49040,45936,46062,46068,47488,47527,48702,49451,50287,50313,47583,47986,47994,48637,50262,50318,50394,50528'
    steps:
