        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58e9c7d89ee6e9ece08abc64fa5cecc5baf5af7c HEAD
          git fetch origin main
          git fetch origin battle/issue122-unified-next-release-qualified-46088627970
          if git merge-base --is-ancestor a39c71aad35a824800d02ae95472bf65f3f18e9b origin/main; then
            git checkout --detach origin/main
          else
            git checkout --detach a39c71aad35a824800d02ae95472bf65f3f18e9b
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit origin/main
          fi
          git merge-base --is-ancestor a39c71aad35a824800d02ae95472bf65f3f18e9b HEAD
