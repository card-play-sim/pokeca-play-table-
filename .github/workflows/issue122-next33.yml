name: 全残件共通効果拡張・どく状態のワザ強化
on:
  push:
    branches: [battle/issue122-next33-20261128]
    paths: ['.github/workflows/issue122-next33.yml']
  workflow_dispatch:
concurrency:
  group: issue122-next33-broad
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_PARALLEL_RESERVED: '45230,46673,48789,47588,47957,49106,50134,50190,47661,48034,49040,47583,47986,47994,48637,50262,50318,50394,50528,46452,47426,45962,50127,50377,50525,47300,47350,47366,47376,47436,47453,48532,48749,49150'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach 101a4701a646cba17fd47f6ad49a69bcdf335c6c
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" const prizeDiscount=generic.match(\",\"to\":\" const poisonedTool=generic.match(/^このカードをつけているどくのポケモンが使うワザの、相手のバトルポケモンへのダメージは「\\\\+([1-9]\\\\d{0,2})」される。$/);\\n if(kind==='MAIN'&&entry.category==='tool'&&poisonedTool)\\n  return {mechanic:'TOOL_STATUS_ATTACK_BOOST',commands:['MODIFY_DAMAGE'],holderStatus:'POISONED',amount:Number(poisonedTool[1]),sharedWording:true};\\n const prizeDiscount=generic.match(\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"  if(isEx&&toolEnabled(g))for(const t of source.tools||[]){\",\"to\":\"  if(other.active===mon&&toolEnabled(g))for(const t of source.tools||[]){\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"   if(plan?.mechanic==='TOOL_EX_ATTACK_BOOST'&&(!plan.nonRuleOnly||!record(source).facts.rulePokemon))amount+=plan.amount;\",\"to\":\"   if(isEx&&plan?.mechanic==='TOOL_EX_ATTACK_BOOST'&&(!plan.nonRuleOnly||!record(source).facts.rulePokemon))amount+=plan.amount;\\n   if(plan?.mechanic==='TOOL_STATUS_ATTACK_BOOST'&&source.statusCondition===plan.holderStatus)amount+=plan.amount;\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\" if(m==='TOOL_EX_ATTACK_BOOST'||m==='TOOL_PRIZE_COST_DISCOUNT'){\",\"to\":\" if(['TOOL_EX_ATTACK_BOOST','TOOL_PRIZE_COST_DISCOUNT','TOOL_STATUS_ATTACK_BOOST'].includes(m)){\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"if(m==='TOOL_EX_ATTACK_BOOST'&&attack)reserve(r=>r.category==='pokemon'&&r.facts.basic&&r.name.endsWith('ex')\",\"to\":\"if(['TOOL_EX_ATTACK_BOOST','TOOL_STATUS_ATTACK_BOOST'].includes(m)&&attack)reserve(r=>r.category==='pokemon'&&r.facts.basic&&(m!=='TOOL_EX_ATTACK_BOOST'||r.name.endsWith('ex'))\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(m==='ATTACK_BASIC_DAMAGE_PROTECTION'){\\n    const other=frame.game.players[1]\",\"to\":\"  if(m==='TOOL_STATUS_ATTACK_BOOST'){\\n    const own=frame.game.players[0],mon=own.active;\\n    const attack=E.getReferenceEffectRecord(mon).attacks.find(a=>a.plan?.mechanic==='VANILLA_DAMAGE'&&Number(a.damage)>0&&a.cost.every(t=>t==='無色'));\\n    if(!attack)return {blocked:'NO_STATUS_TOOL_ATTACK_FIXTURE'};\\n    for(const type of attack.cost){\\n      const i=own.deck.findIndex(c=>c.kind==='energy'&&!c.isSpecial);\\n      if(i<0)return {blocked:'NO_STATUS_TOOL_PAYMENT_FIXTURE'};\\n      mon.energyCards.push(own.deck.splice(i,1)[0]);\\n    }\\n    mon.statusCondition=e.plan.holderStatus;\\n  }\\n  if(m==='ATTACK_BASIC_DAMAGE_PROTECTION'){\\n    const other=frame.game.players[1]\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(e.plan.mechanic==='TOOL_EX_ATTACK_BOOST'||e.plan.mechanic==='TOOL_PRIZE_COST_DISCOUNT'){\",\"to\":\"  if(['TOOL_EX_ATTACK_BOOST','TOOL_PRIZE_COST_DISCOUNT','TOOL_STATUS_ATTACK_BOOST'].includes(e.plan.mechanic)){\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    }else{\\n      while(p1.prizes>1){p1.hand.push(p1.prizeCards.pop());p1.prizes--;}\",\"to\":\"    }else if(e.plan.mechanic==='TOOL_STATUS_ATTACK_BOOST'){\\n      assert.equal(p0.active.statusCondition,e.plan.holderStatus);\\n    }else{\\n      while(p1.prizes>1){p1.hand.push(p1.prizeCards.pop());p1.prizes--;}\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    for(const type of required){\\n      const i=p0.deck.findIndex\",\"to\":\"    for(const type of (e.plan.mechanic==='TOOL_STATUS_ATTACK_BOOST'?[]:required)){\\n      const i=p0.deck.findIndex\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"      verifyPrintedAttack(base,withoutTool.getSnapshot(),trigger,Number(attack.damage));\\n    }\\n  }\\n  if(e.plan.mechanic==='PASSIVE_IGNORE_ACTIVE_DEFENSE')\",\"to\":\"      verifyPrintedAttack(base,withoutTool.getSnapshot(),trigger,Number(attack.damage));\\n      if(e.plan.mechanic==='TOOL_STATUS_ATTACK_BOOST'){\\n        const healthy=JSON.parse(JSON.stringify(start));\\n        healthy.players[0].active.statusCondition=null;delete healthy.players[0].active.statusConditionInfo;\\n        const negative=port(healthy);assert(negative.dispatch('you',testAction).ok);\\n        verifyPrintedAttack(healthy,negative.getSnapshot(),trigger,Number(attack.damage));\\n        assert.deepEqual(S.identities(start),S.identities(withTool.getSnapshot()));\\n        const saved=withTool.getSnapshot();assert(withTool.restoreSession(withTool.getResumeSnapshot()).ok);assert.deepEqual(withTool.getSnapshot(),saved);\\n      }\\n    }\\n  }\\n  if(e.plan.mechanic==='PASSIVE_IGNORE_ACTIVE_DEFENSE')\"},{\"path\":\"scripts/build-intake-verification-fixtures.cjs\",\"from\":\"\\\"TOOL_EX_ATTACK_BOOST\\\",\\\"TOOL_PRIZE_COST_DISCOUNT\\\",\\\"MASS_EFFECT_SEQUENCE\\\"\",\"to\":\"\\\"TOOL_EX_ATTACK_BOOST\\\",\\\"TOOL_PRIZE_COST_DISCOUNT\\\",\\\"TOOL_STATUS_ATTACK_BOOST\\\",\\\"MASS_EFFECT_SEQUENCE\\\"\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"   if m=='TOOL_NAMED_TEAM_MAX_HP':\",\"to\":\"   if m=='TOOL_STATUS_ATTACK_BOOST':\\n    plan=f['e']['plan'];holder=after['players'][0]['active'];target=after['players'][1]['active']\\n    assert holder['statusCondition']==plan['holderStatus']\\n    assert any(card['id']==ident for card in holder['tools'])\\n    printed=await page.evaluate(\\\"c=>Pokeca.getReferenceEffectRecord(c)\\\",holder)\\n    idx=next(i for i,a in enumerate(printed['attacks']) if a.get('plan',{}).get('mechanic')=='VANILLA_DAMAGE' and int(a['damage'])>0)\\n    opts=await page.evaluate(\\\"id=>PokecaMobile.port.getPokemonActions('you',id)\\\",holder['id'])\\n    attack=next(o for o in opts if o['kind']=='attack' and o['action']['attackIndex']==idx and o['ok'])\\n    await page.locator(f'#self-active [data-card-id=\\\"{holder[\\\"id\\\"]}\\\"]').tap()\\n    await page.locator('#pokemon-actions').get_by_role('button',name='ワザを使う',exact=True).tap()\\n    await page.locator(f'#attack-actions [data-action-kind=\\\"attack\\\"][data-attack-index=\\\"{idx}\\\"]').tap()\\n    await select_effect_targets(page,attack)\\n    n=len(after['history'])\\n    await page.wait_for_function(\\\"n=>document.querySelector('#confirm-dialog').open||PokecaMobile.port.getSnapshot().history.length>n\\\",arg=n,timeout=12000)\\n    if await page.locator('#confirm-ok').is_visible():await page.locator('#confirm-ok').tap()\\n    await page.wait_for_function('n=>PokecaMobile.port.getSnapshot().history.length>n',arg=n)\\n    after=await snap()\\n    assert any(ev.get('details',{}).get('command')=='DAMAGE' and ev['details'].get('targetInstanceId')==target['id'] and ev['details'].get('amount')==int(printed['attacks'][idx]['damage'])+plan['amount'] for ev in after['history'][n:])\\n   if m=='TOOL_NAMED_TEAM_MAX_HP':\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          python -m py_compile tests/test_control_013_browser.py
          node --check scripts/build-intake-verification-fixtures.cjs
          node scripts/list-card-auto-connect-ids.cjs /tmp/broad-targets.json
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const reserved=new Set(process.env.POKECA_PARALLEL_RESERVED.split(','));
          const targets=JSON.parse(fs.readFileSync('/tmp/broad-targets.json')).map(String).filter(id=>!reserved.has(id));
          assert(targets.length>0&&new Set(targets).size===targets.length);
          assert(targets.every(id=>/^[1-9][0-9]{0,7}$/.test(id)&&!reserved.has(id)));
          fs.appendFileSync(process.env.GITHUB_ENV,'POKECA_INTAKE_REQUESTED_TARGETS='+targets.join(',')+'\n');
          console.log('BROAD_UNRESOLVED_SCOPE',targets.length,'reserved concurrent',reserved.size);
          NODE
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Summarize existing candidate diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,collections
          p=pathlib.Path('work/card-auto-connect/candidate.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('QUALIFIED',len(d.get('qualified',[])))
              print('BLOCKERS',dict(collections.Counter(row.get('reason') for row in d.get('blockers',[]))))
          gaps=pathlib.Path('work/card-auto-connect/execution-gaps.json')
          if gaps.exists():
              for row in json.loads(gaps.read_text()).get('gaps',[])[:100]: print('EXACT_EXECUTION_GAP',json.dumps(row,ensure_ascii=False)[:2500])
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=[].filter(id=>!old.has(id));
          const targets=process.env.POKECA_INTAKE_REQUESTED_TARGETS.split(',').filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,targets,added,missing,unresolvedTargets:targets.filter(id=>!now.has(id)),count:added.length};fs.writeFileSync('artifacts/next33-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          bash scripts/run-intake-candidate-browser-shards.sh next33
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/next33-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/next33-candidate.json
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified combined next release'
          ref="HEAD:refs/heads/battle/issue122-next33-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next33-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
