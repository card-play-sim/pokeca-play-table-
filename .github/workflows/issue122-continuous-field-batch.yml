name: 継続場効果・全残件対戦検証
on:
  push:
    branches: [battle/issue122-continuous-field-batch-20261128]
    paths: ['.github/workflows/issue122-continuous-field-batch.yml']
  workflow_dispatch:
concurrency:
  group: issue122-continuous-field-batch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58e9c7d89ee6e9ece08abc64fa5cecc5baf5af7c HEAD
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" const generic=text.normalize('NFKC');\",\"to\":\" const generic=text.normalize('NFKC');\\n if(kind==='ABILITY'&&generic==='このポケモンがいるかぎり、自分のたねポケモン全員は、にげるためのエネルギーが、すべてなくなる。')return {mechanic:'SKYLINE',commands:['MODIFY_RETREAT_COST'],sharedWording:true};\\n if(kind==='MAIN'&&entry.category==='stadium'){\\n  const hp=generic.match(/^おたがいの場の(たね|2進化)ポケモン全員の最大HPは、それぞれ「([+-][1-9][0-9]{0,2})」される。$/);\\n  if(hp)return {mechanic:'STADIUM_STAGE_HP',commands:['MODIFY_MAX_HP'],stage:hp[1]==='たね'?0:2,amount:Number(hp[2]),sharedWording:true};\\n }\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"function maxHpBonus(g,card){\\n if(!toolEnabled(g))return 0;\\n return (card.tools||[]).reduce((sum,tool)=>{const plan=record(tool)?.mainPlan;\",\"to\":\"function maxHpBonus(g,card){\\n const plan=record(g.stadium)?.mainPlan;\\n const fieldHp=plan?.mechanic==='STADIUM_STAGE_HP'&&record(card).facts.stage===plan.stage?plan.amount:0;\\n if(!toolEnabled(g))return fieldHp;\\n return (card.tools||[]).reduce((sum,tool)=>{const plan=record(tool)?.mainPlan;\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"  if(plan?.mechanic==='CONDITIONAL_MAX_HP'&&(!plan.basicOnly||record(card).facts.basic))return sum+plan.amount;\\n  return sum;\\n },0);\\n}\",\"to\":\"  if(plan?.mechanic==='CONDITIONAL_MAX_HP'&&(!plan.basicOnly||record(card).facts.basic))return sum+plan.amount;\\n  return sum;\\n },fieldHp);\\n}\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\" // Damage-reduction proof needs an attacker which survives the printed\",\"to\":\" if(m==='STADIUM_STAGE_HP'){\\n  const eligible=r=>r.category==='pokemon'&&r.facts.stage===plan.stage&&r.facts.hp+plan.amount>0&&!r.abilities.length&&r.attacks.every(a=>a.plan);\\n  const ineligible=r=>r.category==='pokemon'&&r.facts.stage!==plan.stage&&!r.abilities.length&&r.attacks.every(a=>a.plan);\\n  for(const side of [0,1]){\\n   if(!reserve(eligible,'active',side)||!reserve(ineligible,'bench',side))return Object.assign(requirements,{teamBoostBlocked:'NO_STAGE_HP_EXACT_FIXTURE'});\\n  }\\n }\\n // Damage-reduction proof needs an attacker which survives the printed\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(e.plan.mechanic===\\\"TOOL_LOW_HP_RETREAT_DISCOUNT\\\"){\",\"to\":\"  if(e.plan.mechanic==='STADIUM_STAGE_HP'){\\n    const plan=e.plan,action=t.action||o.action;\\n    assert.equal(action.type,'play_stadium');\\n    assert.equal(after.stadium?.id,action.cardId);\\n    for(let side=0;side<2;side++){\\n      const old=[before.players[side].active,...before.players[side].bench].filter(Boolean);\\n      const current=[after.players[side].active,...after.players[side].bench].filter(Boolean);\\n      assert(old.some(c=>E.getReferenceEffectRecord(c).facts.stage===plan.stage));\\n      assert(old.some(c=>E.getReferenceEffectRecord(c).facts.stage!==plan.stage));\\n      for(const c of old){\\n        const n=current.find(x=>x.id===c.id),printed=E.getReferenceEffectRecord(c);\\n        assert(n);assert.equal(n.hp,c.hp+(printed.facts.stage===plan.stage?plan.amount:0));\\n        assert.equal(n.damage,c.damage);\\n      }\\n    }\\n    assert.deepEqual(S.identities(before),S.identities(after));\\n    const replay=port(after);assert(replay.restoreSession(replay.getResumeSnapshot()).ok);\\n    assert.equal(JSON.stringify(replay.getSnapshot()),JSON.stringify(after));\\n  }\\n  if(e.plan.mechanic===\\\"TOOL_LOW_HP_RETREAT_DISCOUNT\\\"){\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"   if m=='TOOL_LOW_HP_RETREAT_DISCOUNT':\",\"to\":\"   if m=='STADIUM_STAGE_HP':\\n    plan=f['e']['plan']\\n    assert after['stadium']['id']==option['action']['cardId']\\n    for side in (0,1):\\n     old=[c for c in [before['players'][side]['active'],*before['players'][side]['bench']] if c]\\n     stages=await page.evaluate(\\\"cards=>cards.map(c=>Pokeca.getReferenceEffectRecord(c).facts.stage)\\\",old)\\n     assert plan['stage'] in stages and any(s!=plan['stage'] for s in stages)\\n     new=[c for c in [after['players'][side]['active'],*after['players'][side]['bench']] if c]\\n     for c,stage in zip(old,stages):\\n      mon=next(n for n in new if n['id']==c['id'])\\n      assert mon['hp']==c['hp']+(plan['amount'] if stage==plan['stage'] else 0)\\n      assert mon['damage']==c['damage']\\n   if m=='TOOL_LOW_HP_RETREAT_DISCOUNT':\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Print exact evolution target diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def visit(x,p):
              if isinstance(x,dict):
                  slot=x.get('slot')
                  if isinstance(slot,str) and any(slot.startswith(i+':') for i in ('46446','46661','48705','47733','46445','50394','50528')) and x.get('status') in ('FAILED','BLOCKED'):
                      print(p,json.dumps(x,ensure_ascii=False)[:5000])
                  for v in x.values(): visit(v,p)
              elif isinstance(x,list):
                  for v in x: visit(v,p)
          for p in pathlib.Path('work/card-auto-connect').rglob('*.json'):
              try: visit(json.loads(p.read_text()),str(p))
              except (ValueError,OSError): pass
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=[];
          const targets=["46446","46661","48705","47733","46445","50394","50528"].filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,targets,added,missing,unresolvedTargets:targets.filter(id=>!now.has(id)),count:added.length};fs.writeFileSync('artifacts/continuous-field-batch-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          export POKECA_BROWSER_SHARD_COUNT=4
          export POKECA_BROWSER_SLOTS_ONLY=1
          pids=()
          for shard in 0 1 2 3; do
            POKECA_BROWSER_SHARD_INDEX="$shard" POKECA_INTAKE_ARTIFACT="continuous-field-batch-$shard" python tests/test_control_013_browser.py >"artifacts/continuous-field-batch-$shard.log" 2>&1 &
            pids+=("$!")
          done
          rv=0
          for pid in "${pids[@]}"; do wait "$pid" || rv=1; done
          for f in artifacts/continuous-field-batch-*.log; do tail -n 15 "$f"; done
          test "$rv" = 0
          unset POKECA_BROWSER_SLOTS_ONLY
          POKECA_BROWSER_SHARD_INDEX=0 POKECA_INTAKE_ARTIFACT=continuous-field-batch-full-ai python tests/test_control_013_browser.py >artifacts/continuous-field-batch-full-ai.log 2>&1 || { tail -n 30 artifacts/continuous-field-batch-full-ai.log; exit 1; }
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/continuous-field-batch-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/continuous-field-batch-candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified continuous field effects'
          ref="HEAD:refs/heads/battle/issue122-continuous-field-batch-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-field-batch-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
