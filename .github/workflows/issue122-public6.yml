name: Issue122 six-print public Chromium and exact release verification
on:
  push:
    branches: [battle/issue122-public6-20261127]
    paths: ['.github/workflows/issue122-public6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0986e6b169224cb2d020e7c708ae46709f248b2c
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact six new prints and full previous record preservation
        run: |
          node <<'NODE'
          const fs=require('node:fs'),a=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json';
          const old=JSON.parse(execFileSync('git',['show','ae3b6d49e4c85ceb100397925580e22e586a1de3:'+p],{encoding:'utf8',maxBuffer:64*1024*1024})).records;
          const now=JSON.parse(fs.readFileSync(p)).records,m=new Map(now.map(r=>[String(r.officialCardId),r])),ids=new Set(old.map(r=>String(r.officialCardId)));
          a.equal(m.size,now.length);for(const row of old)a.deepEqual(m.get(String(row.officialCardId)),row);
          a.deepEqual([...m.keys()].filter(id=>!ids.has(id)).sort(),['45227','45599','47051','47164','47272','49056']);
          NODE
          node scripts/build-pwa-release.cjs --check
      - name: Verify deployed assets against exact merged commit
        env:
          RELEASE_VERIFY_ATTEMPTS: '30'
          RELEASE_VERIFY_INTERVAL_MS: '30000'
        run: node scripts/verify-published-pwa.cjs
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: All new slots on public URL
        env:
          POKECA_TEST_URL: https://card-play-sim.github.io/pokeca-play-table-/
          POKECA_INTAKE_RELEASE_BASE: ae3b6d49e4c85ceb100397925580e22e586a1de3
          POKECA_INTAKE_PREFIX: work/card-auto-connect/browser
          POKECA_BROWSER_SHARD_COUNT: '4'
          POKECA_BROWSER_SHARD_INDEX: ${{ matrix.shard }}
          POKECA_BROWSER_SLOTS_ONLY: '1'
          POKECA_INTAKE_ARTIFACT: public6-shard-${{ matrix.shard }}
        run: |
          mkdir -p work/card-auto-connect/browser artifacts
          python tests/test_control_013_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public6-shard-${{ matrix.shard }}
          path: |
            artifacts/
            test-results/
            work/card-auto-connect/browser/
          if-no-files-found: warn
