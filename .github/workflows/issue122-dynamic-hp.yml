name: 最大HP可変6印刷版・並列回帰実測
on:
  push:
    branches: [battle/issue122-dynamic-hp-20261128]
    paths: ['.github/workflows/issue122-dynamic-hp.yml']
  workflow_dispatch:
concurrency:
  group: issue122-dynamic-hp
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_PARALLEL_REGRESSION: '1'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_INTAKE_REQUESTED_TARGETS: '45230,46673,48789,47588,47957,49106'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58e9c7d89ee6e9ece08abc64fa5cecc5baf5af7c HEAD
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" const generic=text.normalize('NFKC');\",\"to\":\" const generic=text.normalize('NFKC');\\n const hpPrizes=generic.match(/^相手がすでにとったサイド1枚につき、このポケモンの最大HPは「\\\\+([1-9]\\\\d{0,2})」される。$/);\\n const hpEnergy=generic.match(/^このポケモンについている\\\\[([草炎水雷超闘悪鋼])\\\\]エネルギー1個につき、このポケモンの最大HPは「\\\\+([1-9]\\\\d{0,2})」される。$/);\\n if(kind==='ABILITY'&&(hpPrizes||hpEnergy))return {mechanic:'PASSIVE_DYNAMIC_MAX_HP',commands:['MODIFY_MAX_HP'],mode:hpPrizes?'opponentPrizes':'energy',type:hpEnergy?.[1]||null,amount:Number(hpPrizes?.[1]||hpEnergy[2]),sharedWording:true};\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"'PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT']);\",\"to\":\"'PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT','PASSIVE_DYNAMIC_MAX_HP']);\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"function maxHpBonus(g,card){\\n if(!toolEnabled(g))return 0;\\n return (card.tools||[]).reduce((sum,tool)=>{const plan=record(tool)?.mainPlan;\",\"to\":\"function maxHpBonus(g,card){\\n const owner=find(g,id(card))?.player;\\n const dynamic=owner?enabledAbilities(g,card).filter(a=>a.plan.mechanic==='PASSIVE_DYNAMIC_MAX_HP').reduce((sum,a)=>{\\n  const p=a.plan,n=p.mode==='opponentPrizes'?6-opponent(g,owner.id).prizes:energyUnits(card).filter(u=>u.includes(p.type)).length;\\n  return sum+p.amount*n;\\n },0):0;\\n if(!toolEnabled(g))return dynamic;\\n return (card.tools||[]).reduce((sum,tool)=>{const plan=record(tool)?.mainPlan;\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"  if(plan?.mechanic==='CONDITIONAL_MAX_HP'&&(!plan.basicOnly||record(card).facts.basic))return sum+plan.amount;\\n  return sum;\\n },0);\",\"to\":\"  if(plan?.mechanic==='CONDITIONAL_MAX_HP'&&(!plan.basicOnly||record(card).facts.basic))return sum+plan.amount;\\n  return sum;\\n },dynamic);\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(['PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT'].includes(m)){\",\"to\":\"  if(m==='PASSIVE_DYNAMIC_MAX_HP'){\\n    const index=r.attacks.findIndex(a=>a.plan);\\n    if(index<0)return {blocked:'NO_DYNAMIC_HP_ATTACK_TRIGGER'};\\n    const trigger={...r.attacks[index],effectIndex:index},t=prepare(r,trigger,'attack');\\n    if(t.blocked)return t;\\n    const game=t.port.getSnapshot(),[own,other]=game.players,mon=own.active,plan=e.plan;\\n    assert.equal(E.getReferenceEffectRecord(mon)?.officialCardId,r.officialCardId);\\n    assert(!(mon.tools||[]).length);\\n    const zero=structuredClone(game),[zown,zother]=zero.players;\\n    if(plan.mode==='opponentPrizes'){\\n      if(other.prizeCards.length!==6)return {blocked:'NO_FULL_PRIZE_FIXTURE'};\\n      other.hand.push(...other.prizeCards.splice(0,2));other.prizes=other.prizeCards.length;\\n    }else{\\n      // Move real typed cards between zones; never synthesize energy counts.\\n      zown.deck.push(...zown.active.energyCards.splice(0));\\n      const typed=mon.energyCards.filter(c=>!c.isSpecial&&c.energyType===plan.type);\\n      if(!typed.length){\\n        const zone=[own.deck,own.hand].find(cards=>cards.some(c=>!c.isSpecial&&c.kind==='energy'&&c.energyType===plan.type));\\n        if(!zone)return {blocked:'NO_TYPED_HP_ENERGY_FIXTURE'};\\n        mon.energyCards.push(zone.splice(zone.findIndex(c=>!c.isSpecial&&c.kind==='energy'&&c.energyType===plan.type),1)[0]);\\n      }\\n      if(mon.energyCards.some(c=>c.isSpecial))return {blocked:'NO_BASIC_ONLY_HP_FIXTURE'};\\n    }\\n    const empty=port(zero).getSnapshot(),changed=port(game),before=changed.getSnapshot();\\n    const n=plan.mode==='opponentPrizes'?2:mon.energyCards.filter(c=>c.energyType===plan.type).length;\\n    assert.equal(empty.players[0].active.hp,r.facts.hp);\\n    assert(n>0);assert.equal(before.players[0].active.hp,r.facts.hp+n*plan.amount);\\n    assert.deepEqual(Array.from(S.identities(empty)),Array.from(S.identities(before)));\\n    const option=changed.getPokemonActions('you',mon.id).find(o=>o.kind==='attack'&&o.action.attackIndex===index&&o.ok);\\n    if(!option)return {blocked:'NO_DYNAMIC_HP_LEGAL_ATTACK'};\\n    return {...t,port:changed,option,trigger};\\n  }\\n  if(['PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT'].includes(m)){\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if(['PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT'].includes(e.plan.mechanic)){\",\"to\":\"  if(e.plan.mechanic==='PASSIVE_DYNAMIC_MAX_HP'){\\n    const mon=before.players[0].active,print=E.getReferenceEffectRecord(mon),plan=e.plan;\\n    assert(print.abilities.some(a=>a.effectId===e.effectId));\\n    const n=plan.mode==='opponentPrizes'?6-before.players[1].prizeCards.length:mon.energyCards.filter(c=>!c.isSpecial&&c.energyType===plan.type).length;\\n    assert(n>0);assert.equal(mon.hp,print.facts.hp+n*plan.amount);\\n    const bad=port(before);assert.equal(bad.dispatch('you',{type:'use_ability',sourceInstanceId:mon.id,abilityId:e.effectId}).ok,false);\\n    assert.deepEqual(bad.getSnapshot(),before);\\n  }\\n  if(['PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT'].includes(e.plan.mechanic)){\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"elif not trigger or m in ('PASSIVE_EMPTY_ENERGY_RETREAT',\",\"to\":\"elif not trigger or m in ('PASSIVE_DYNAMIC_MAX_HP','PASSIVE_EMPTY_ENERGY_RETREAT',\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"   if m in ('PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT'):\",\"to\":\"   if m=='PASSIVE_DYNAMIC_MAX_HP':\\n    source=before['players'][0]['active'];plan=f['e']['plan']\\n    count=6-len(before['players'][1]['prizeCards']) if plan['mode']=='opponentPrizes' else sum(1 for energy in source['energyCards'] if not energy.get('isSpecial') and energy.get('energyType')==plan['type'])\\n    assert count>0\\n    assert source['hp']==r['facts']['hp']+count*plan['amount']\\n   if m in ('PASSIVE_EMPTY_ENERGY_RETREAT','PASSIVE_TYPED_TEAM_RETREAT'):\"},{\"path\":\"scripts/run-atomic-official-battle-intake.cjs\",\"from\":\"    run(command,args,env);\\n    console.log('ATOMIC_BATTLE_STEP_PASS '+name);\",\"to\":\"    if(name==='EXECUTE_ALL_CARD_EFFECTS_IN_REAL_ENGINE'&&env.POKECA_INTAKE_REQUESTED_TARGETS){\\n      const fs=require('node:fs');\\n      const requested=env.POKECA_INTAKE_REQUESTED_TARGETS.split(',');\\n      if(new Set(requested).size!==requested.length||requested.some(id=>!/^[1-9][0-9]{0,7}$/.test(id)))throw Error('INVALID_REQUESTED_TARGETS');\\n      const compiled='data/effect-extensions/compiled.json';\\n      const prior=spawnSync('git',['show',base+':'+compiled],{encoding:'utf8',maxBuffer:64*1024*1024});\\n      if(prior.status!==0)throw Error('BASE_COMPILED_UNAVAILABLE');\\n      const old=new Set(JSON.parse(prior.stdout).records.map(r=>String(r.officialCardId)));\\n      const available=new Set(JSON.parse(fs.readFileSync(compiled,'utf8')).records.map(r=>String(r.officialCardId)).filter(id=>!old.has(id)));\\n      const selected=requested.filter(id=>available.has(id));\\n      const unresolved=requested.filter(id=>!old.has(id)&&!available.has(id));\\n      fs.mkdirSync(work,{recursive:true});\\n      fs.writeFileSync(work+'/requested-scope.json',JSON.stringify({base,requested,selected,unresolved,alreadyPublished:requested.filter(id=>old.has(id))},null,2));\\n      console.log('EXACT_SCOPE_CLASSIFICATION '+JSON.stringify({selected,unresolved}));\\n      if(!selected.length)throw Error('NO_REQUESTED_TARGET_COMPILED');\\n      env.POKECA_INTAKE_EXACT_TARGETS=selected.join(',');\\n    }\\n    run(command,args,env);\\n    console.log('ATOMIC_BATTLE_STEP_PASS '+name);\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Print exact evolution target diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def visit(x,p):
              if isinstance(x,dict):
                  slot=x.get('slot')
                  if isinstance(slot,str) and any(slot.startswith(i+':') for i in ('45230','46673','48789','47588','47957','49106')) and x.get('status') in ('FAILED','BLOCKED'):
                      print(p,json.dumps(x,ensure_ascii=False)[:5000])
                  for v in x.values(): visit(v,p)
              elif isinstance(x,list):
                  for v in x: visit(v,p)
          for p in pathlib.Path('work/card-auto-connect').rglob('*.json'):
              try: visit(json.loads(p.read_text()),str(p))
              except (ValueError,OSError): pass
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=[].filter(id=>!old.has(id));
          const targets=["45230","46673","48789","47588","47957","49106"].filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,targets,added,missing,unresolvedTargets:targets.filter(id=>!now.has(id)),count:added.length};fs.writeFileSync('artifacts/dynamic-hp-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          bash scripts/run-intake-candidate-browser-shards.sh dynamic-hp
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/dynamic-hp-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/dynamic-hp-candidate.json
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified combined next release'
          ref="HEAD:refs/heads/battle/issue122-dynamic-hp-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-hp-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
