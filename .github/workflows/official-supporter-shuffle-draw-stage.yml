name: Stage H supporter shuffle-and-draw effects
on:
  push:
    branches:
      - feat/h-supporter-shuffle-draw-20261122
    paths:
      - 'engine/reference-effect-plans.cjs'
      - 'engine/pokeca_reference_effect_runtime.cjs'
      - 'scripts/build-effect-extensions.cjs'
      - 'data/effect-extensions/intake.json'
      - 'tests/official-supporter-shuffle-draw.test.cjs'
      - 'tests/official-supporter-shuffle-draw-runtime.test.cjs'
      - '.github/workflows/official-supporter-shuffle-draw-stage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h-supporter-shuffle-draw-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official H source and exact text
        run: |
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node tests/official-supporter-shuffle-draw.test.cjs
      - name: Regenerate official extension, engine and PWA
        run: |
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: Exercise 4-8 prize draw, 8-3 coin draw and save restore in actual bundle
        run: node tests/official-supporter-shuffle-draw-runtime.test.cjs
      - name: Push verified generated release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/effect-extensions/compiled.json data/reference-effects/plans.json ui/engine.bundle.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate H supporter shuffle-draw official effects and PWA'
            git push origin HEAD:feat/h-supporter-shuffle-draw-20261122
          fi
