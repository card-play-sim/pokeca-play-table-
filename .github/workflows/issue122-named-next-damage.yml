name: 次ターン指定ワザダメージ増加・全残件対戦検証
on:
  push:
    branches: [battle/issue122-named-next-damage-20261128]
    paths: ['.github/workflows/issue122-named-next-damage.yml']
  workflow_dispatch:
concurrency:
  group: issue122-named-next-damage
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58e9c7d89ee6e9ece08abc64fa5cecc5baf5af7c HEAD
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" // Match complete printed effect slots only; unknown official text still fails closed.\",\"to\":\" const namedBoost=generic.match(/^次の自分の番、このポケモンの「([^」]+)」のダメージは「\\\\+([1-9]\\\\d{0,2})」される。$/);\\n if(kind==='ATTACK'&&namedBoost&&/^\\\\d+$/.test(String(entry.damage||'0'))&&String(entry.name||'')===namedBoost[1])\\n  return {mechanic:'ATTACK_NAMED_NEXT_DAMAGE_BOOST',commands:['DAMAGE','ADD_STATE'],attackName:namedBoost[1],amount:Number(namedBoost[2]),sharedWording:true};\\n // Match complete printed effect slots only; unknown official text still fails closed.\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"  const c=find(g,action.targetInstanceId)?.card;if(c){c.referenceEvolutionWindow=g.referenceActionSequence;c.validationBase||=reduced(current(find(before,action.targetInstanceId).card));for(const k of ['referenceProtection','referenceBasicDamageProtection','referenceCannotAttackTurn','referenceNamedAttackLock','referenceCannotRetreatTurn','referenceDamageReduction','referenceOutgoingDamagePenalty','referenceAttackLockUntilSwitch','referenceNoWeaknessTurn'])delete c[k];}\",\"to\":\"  const c=find(g,action.targetInstanceId)?.card;if(c){c.referenceEvolutionWindow=g.referenceActionSequence;c.validationBase||=reduced(current(find(before,action.targetInstanceId).card));for(const k of ['referenceProtection','referenceBasicDamageProtection','referenceCannotAttackTurn','referenceNamedAttackLock','referenceNamedNextDamageBoost','referenceCannotRetreatTurn','referenceDamageReduction','referenceOutgoingDamagePenalty','referenceAttackLockUntilSwitch','referenceNoWeaknessTurn'])delete c[k];}\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"delete c.referenceNamedAttackLock;\",\"to\":\"delete c.referenceNamedAttackLock;delete c.referenceNamedNextDamageBoost;\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"case 'ATTACK_NAMED_NEXT_TURN_LOCK':case 'ATTACK_STATUS_BONUS_DAMAGE':\",\"to\":\"case 'ATTACK_NAMED_NEXT_TURN_LOCK':case 'ATTACK_NAMED_NEXT_DAMAGE_BOOST':case 'ATTACK_STATUS_BONUS_DAMAGE':\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"   if(m==='FIXED_COIN_HITS'){amount=plan.base||0;\",\"to\":\"   if(m==='ATTACK_NAMED_NEXT_DAMAGE_BOOST'&&card.referenceNamedNextDamageBoost?.turn===g.turnNumber&&card.referenceNamedNextDamageBoost.attackName===effect.name)amount+=card.referenceNamedNextDamageBoost.amount;\\n   if(m==='FIXED_COIN_HITS'){amount=plan.base||0;\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"   if(m==='ATTACK_NAMED_NEXT_TURN_LOCK')card.referenceNamedAttackLock={turn:g.turnNumber+2,attackName:plan.attackName};\",\"to\":\"   if(m==='ATTACK_NAMED_NEXT_TURN_LOCK')card.referenceNamedAttackLock={turn:g.turnNumber+2,attackName:plan.attackName};\\n   if(m==='ATTACK_NAMED_NEXT_DAMAGE_BOOST')card.referenceNamedNextDamageBoost={turn:g.turnNumber+2,attackName:plan.attackName,amount:plan.amount};\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  if (e.plan.mechanic === \\\"ATTACK_NAMED_NEXT_TURN_LOCK\\\") {\",\"to\":\"  if(e.plan.mechanic==='ATTACK_NAMED_NEXT_DAMAGE_BOOST'){\\n    verifyPrintedAttack(before,after,e,Number(e.damage));\\n    const state=after.players[0].active.referenceNamedNextDamageBoost;\\n    assert.deepEqual(state,{turn:before.turnNumber+2,attackName:e.plan.attackName,amount:e.plan.amount});\\n    for(const [offset,bonus] of [[2,e.plan.amount],[4,0]]){\\n      const start=structuredClone(before);\\n      start.turnNumber=before.turnNumber+offset;\\n      start.players[0].active.referenceNamedNextDamageBoost=structuredClone(state);\\n      const replay=port(start);\\n      assert(replay.dispatch('you',t.action||o.action).ok);\\n      const result=replay.getSnapshot();\\n      verifyPrintedAttack(start,result,e,Number(e.damage)+bonus);\\n      assert.deepEqual(S.identities(start),S.identities(result));\\n      assert(replay.restoreSession(replay.getResumeSnapshot()).ok);\\n      assert.equal(JSON.stringify(B.canonical(replay.getSnapshot())),JSON.stringify(B.canonical(result)));\\n    }\\n  }\\n  if (e.plan.mechanic === \\\"ATTACK_NAMED_NEXT_TURN_LOCK\\\") {\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"   if m in ('VANILLA_DAMAGE','ATTACK_UNDAMAGED_BONUS','ATTACK_ATTACHED_TOOL_COUNT',\",\"to\":\"   if m=='ATTACK_NAMED_NEXT_DAMAGE_BOOST':\\n    plan=f['e']['plan']\\n    assert after['players'][0]['active']['referenceNamedNextDamageBoost']=={'turn':before['turnNumber']+2,'attackName':plan['attackName'],'amount':plan['amount']}\\n    assert f['printedDamageEvents'] and all(event in events for event in f['printedDamageEvents'])\\n   if m in ('VANILLA_DAMAGE','ATTACK_UNDAMAGED_BONUS','ATTACK_ATTACHED_TOOL_COUNT',\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Print exact evolution target diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def visit(x,p):
              if isinstance(x,dict):
                  slot=x.get('slot')
                  if isinstance(slot,str) and any(slot.startswith(i+':') for i in ('47583','47986','47994','45265','45552','48637','46519')) and x.get('status') in ('FAILED','BLOCKED'):
                      print(p,json.dumps(x,ensure_ascii=False)[:5000])
                  for v in x.values(): visit(v,p)
              elif isinstance(x,list):
                  for v in x: visit(v,p)
          for p in pathlib.Path('work/card-auto-connect').rglob('*.json'):
              try: visit(json.loads(p.read_text()),str(p))
              except (ValueError,OSError): pass
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=["47583","47986","47994","45265","45552","48637","46519"].filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,added,missing,count:added.length};fs.writeFileSync('artifacts/named-next-damage-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          export POKECA_BROWSER_SHARD_COUNT=4
          export POKECA_BROWSER_SLOTS_ONLY=1
          pids=()
          for shard in 0 1 2 3; do
            POKECA_BROWSER_SHARD_INDEX="$shard" POKECA_INTAKE_ARTIFACT="named-next-damage-$shard" python tests/test_control_013_browser.py >"artifacts/named-next-damage-$shard.log" 2>&1 &
            pids+=("$!")
          done
          rv=0
          for pid in "${pids[@]}"; do wait "$pid" || rv=1; done
          for f in artifacts/named-next-damage-*.log; do tail -n 15 "$f"; done
          test "$rv" = 0
          unset POKECA_BROWSER_SLOTS_ONLY
          POKECA_BROWSER_SHARD_INDEX=0 POKECA_INTAKE_ARTIFACT=named-next-damage-full-ai python tests/test_control_013_browser.py >artifacts/named-next-damage-full-ai.log 2>&1 || { tail -n 30 artifacts/named-next-damage-full-ai.log; exit 1; }
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/named-next-damage-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/named-next-damage-candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified basic ex immunity'
          ref="HEAD:refs/heads/battle/issue122-named-next-damage-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: named-next-damage-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
