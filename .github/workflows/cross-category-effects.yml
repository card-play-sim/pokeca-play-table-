name: Cross-category effect regression

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'data/fixed-test-decks.json'
      - 'ui/engine.bundle.js'
      - '.github/workflows/cross-category-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run both suites and write structured diagnosis
        run: node tests/cross-category-report.cjs
      - name: Preserve machine-readable diagnosis on pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-category-effect-diagnostics
          path: test-results/cross-category-effects.json
          if-no-files-found: error
          retention-days: 30
