name: Issue122 preserve published 18 and integrate nine qualified prints
on:
  push:
    branches: [battle/issue122-union72-full-gates-20261126]
    paths:
      - '.github/workflows/issue122-reconcile-219-218.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue122-reconcile-219-218
  cancel-in-progress: false
jobs:
  all-remaining:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      INTAKE_LIMIT: '10000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild on latest published main and apply only the qualified source delta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "8c9e1753cf475659071d5d462293db71bf637cb8"
          git merge-base --is-ancestor 3dc8007c2cf993d4e1aee81c5884ee3f0a13e28e "$GITHUB_SHA"
          git checkout --detach 8c9e1753cf475659071d5d462293db71bf637cb8
          git checkout "$GITHUB_SHA" -- .github/workflows/issue122-reconcile-219-218.yml .github/workflows/issue122-union72-full-gates.yml
          git diff --binary 3dc8007c2cf993d4e1aee81c5884ee3f0a13e28e "$GITHUB_SHA" -- engine/reference-effect-plans.cjs engine/pokeca_reference_effect_runtime.cjs scripts/lib/shared-effect-engine-worker.cjs scripts/build-intake-verification-fixtures.cjs tests/test_control_013_browser.py tests/atomic-official-to-battle.test.cjs > /tmp/qualified-source.patch
          test -s /tmp/qualified-source.patch
          git apply --3way /tmp/qualified-source.patch
          git diff --check
          git diff --cached --check
          # A new grammar can intentionally make old blocked evidence compilable.
          # The builder checks every prior record for immutability before writing.
          # Candidate data is isolated; restore the original release before intake.
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          node tests/issue122-attack-promotion-order.test.cjs
      - name: Verify manually reconciled exact source families
        run: |
          grep -q 'TRAINER_TOP_SELECT_DISCARD' engine/reference-effect-plans.cjs
          grep -q 'MASS_SEARCH_DUPLICATE_GROUP' engine/pokeca_reference_effect_runtime.cjs
          grep -q 'pokemonOrBasicEnergy' engine/reference-effect-plans.cjs
          grep -q 'NO_MIXED_SEARCH_BOTH_CATEGORY_FIXTURE' scripts/lib/shared-effect-engine-worker.cjs
          grep -q 'opponentHandTrainerCount' engine/reference-effect-plans.cjs
          grep -q 'ATTACK_BASIC_ENERGY_MOVE' engine/pokeca_reference_effect_runtime.cjs
          grep -q 'ABILITY_TYPED_COST_DRAW_LIMIT' engine/reference-effect-plans.cjs
          grep -q 'SUPPORTER_NON_RULE_DISCARD_DRAW' engine/pokeca_reference_effect_runtime.cjs
      - name: Verify merged Crobat and named discard source families
        run: |
          grep -q 'ABILITY_EVOLVE_MULTI_COUNTERS' engine/reference-effect-plans.cjs
          grep -q 'ATTACK_NAMED_DISCARD_BENCH' engine/reference-effect-plans.cjs
          grep -q 'ATTACK_OPTIONAL_RETURN_POKEMON' engine/pokeca_reference_effect_runtime.cjs
          grep -q 'NO_EVOLVED_SOURCE_FULL_LINE' scripts/lib/shared-effect-engine-worker.cjs
          grep -q 'ensure(deckIndex,source,2)' scripts/lib/shared-effect-engine-worker.cjs
      - name: Require previous and newly composed source families in the same candidate
        run: |
          grep -q 'namedBenchChain' scripts/lib/shared-effect-engine-worker.cjs
          grep -q 'ownDiscardNamedCard' engine/reference-effect-plans.cjs || grep -q 'ownDiscardName' engine/reference-effect-plans.cjs
          grep -q 'nameExact' engine/reference-effect-plans.cjs
          grep -q 'MASS_ATTACHED_ENERGY_MOVE' engine/pokeca_reference_effect_runtime.cjs
          grep -q 'MASS_MILL_COUNT_DAMAGE' engine/pokeca_reference_effect_runtime.cjs
          grep -q 'MASS_COUNTER_GRAMMAR' engine/pokeca_reference_effect_runtime.cjs
          grep -q 'evolutionTransferFallback' engine/reference-effect-plans.cjs
          grep -q 'drawIfHand' engine/pokeca_reference_effect_runtime.cjs
      - name: Verify source and resume exact saved official evidence
        run: |
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          python -m py_compile tests/test_control_013_browser.py
          # Start from the persisted, verified 91-print checkpoint, not an older snapshot.
          node tests/issue122-ability-cost-draw.test.cjs
          python -m unittest discover -s tests -p test_restore_official_intake_evidence.py
          node tests/intake-checkpoint-recovery-contract.test.cjs
          node tests/issue122-official-facts-refresh.test.cjs
          # The atomic pipeline repairs uncompiled evidence after restoring the release baseline.
          node tests/control-014-official-parser.test.cjs
          node tests/atomic-official-to-battle.test.cjs
          node tests/issue122-counter-picker-ui.test.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining IDs through existing atomic official-to-battle pipeline
        run: |
          node scripts/run-atomic-official-battle-intake.cjs
          mkdir -p artifacts
          # Previous two passes both proved the same nine exact IDs. Repeat
          # only if the required checkpoint IDs are missing; keep final full
          # regression, exact-record comparison and every browser slot gate.
          if ! node -e 'const a=require("node:assert/strict"),r=require("./work/card-auto-connect/candidate.json");for(const id of ["46447","46280","46328","49652","48433","48444","48462","47736","47814"])a(r.qualified.map(String).includes(id),id)'; then
            mv work/card-auto-connect artifacts/first-pass-intake
            node scripts/run-atomic-official-battle-intake.cjs
          fi
      - name: Preserve every prior proven record and calculate exact unique new IDs
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process');
          const path='data/effect-extensions/compiled.json',base='8c9e1753cf475659071d5d462293db71bf637cb8';
          const read=(ref,p=path)=>JSON.parse(execFileSync('git',['show',ref+':'+p],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const prior=read(base).records, rows=JSON.parse(fs.readFileSync(path,'utf8')).records;
          const current=new Map(rows.map(r=>[String(r.officialCardId),r]));
          assert.equal(current.size,rows.length);
          for(const old of prior)assert.deepEqual(current.get(String(old.officialCardId)),old,'PUBLISHED_RECORD_CHANGED:'+old.officialCardId);
          const oldIds=new Set(prior.map(r=>String(r.officialCardId)));
          const added=[...current.keys()].filter(id=>!oldIds.has(id)).sort();
          const qualified=read('236c2ee0567530c2aae901c660b361be0717e9f4','reports/official-effect-continuation/union72-exact-delta.json').added.map(String);
          const unionRows=new Map(read('236c2ee0567530c2aae901c660b361be0717e9f4').records.map(r=>[String(r.officialCardId),r]));
          assert.equal(new Set(qualified).size,72);
          const required=qualified.filter(id=>!oldIds.has(id));assert.equal(required.length,9);
          for(const id of qualified)assert.deepEqual(current.get(id),unionRows.get(id),'QUALIFIED_RECORD_CHANGED:'+id);
          for(const id of required)assert(added.includes(id),'MISSING_PRIOR_QUALIFIED:'+id);
          fs.mkdirSync('artifacts',{recursive:true});
          fs.writeFileSync('artifacts/exact-release-delta.json',JSON.stringify({base,added,count:added.length},null,2));
          console.log('EXACT_CONSOLIDATED_DELTA',added);

          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: Verify candidate exact-print browser gameplay
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/intake-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE="8c9e1753cf475659071d5d462293db71bf637cb8"
          export POKECA_INTAKE_LOCAL_CANDIDATE=1
          export POKECA_BROWSER_SHARD_COUNT=4
          export POKECA_BROWSER_SLOTS_ONLY=1
          pids=()
          mkdir -p artifacts
          for shard in 0 1 2 3; do
            POKECA_BROWSER_SHARD_INDEX="$shard" POKECA_INTAKE_ARTIFACT="all-remaining-$shard" python tests/test_control_013_browser.py > "artifacts/all-remaining-shard-$shard.log" 2>&1 &
            pids+=("$!")
          done
          rv=0
          for pid in "${pids[@]}"; do wait "$pid" || rv=1; done
          for logfile in artifacts/all-remaining-shard-*.log; do tail -n 25 "$logfile"; done
          test "$rv" -eq 0
          test -s work/card-auto-connect/browser/example-decks.json
          unset POKECA_BROWSER_SLOTS_ONLY
          POKECA_BROWSER_SHARD_INDEX=0 POKECA_INTAKE_ARTIFACT=union72-full-ai python tests/test_control_013_browser.py > artifacts/union72-full-ai.log 2>&1 || { tail -n 40 artifacts/union72-full-ai.log; exit 1; }
          tail -n 10 artifacts/union72-full-ai.log
          node -e 'const r=require("./artifacts/union72-full-ai-browser.json");require("node:assert/strict").equal(r.expandedAIMatch.finished,true)'
      - name: Persist battle-qualified candidate on isolated branch only
        if: success()
        run: |
          git diff --check
          mkdir -p reports/official-effect-continuation
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/reconcile-219-218-candidate.json
          cp artifacts/exact-release-delta.json reports/official-effect-continuation/reconcile-219-218-exact-delta.json
          cp work/card-auto-connect/execution-gaps.json reports/official-effect-continuation/reconcile-219-218-execution-gaps.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reference-effects/plans.json scripts/build-intake-verification-fixtures.cjs tests/atomic-official-to-battle.test.cjs tests/issue122-attack-promotion-order.test.cjs engine/reference-effect-plans.cjs engine/pokeca_reference_effect_runtime.cjs scripts/lib/shared-effect-engine-worker.cjs tests/test_control_013_browser.py data/effect-extensions/intake.json data/effect-extensions/compiled.json data/effect-extensions/evidence data/official-effect-intake ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Integrate qualified nine with latest published eighteen, preserving all records' | git commit-tree "$tree" -p "$GITHUB_SHA" -p 8c9e1753cf475659071d5d462293db71bf637cb8)"
          checkpoint="battle/issue122-reconciled-219-218-$GITHUB_RUN_ID"
          git branch "$checkpoint" "$commit"
          git bundle create artifacts/qualified-checkpoint.bundle "$checkpoint" "^$GITHUB_SHA" "^8c9e1753cf475659071d5d462293db71bf637cb8"
          printf '%s\n' "$commit" > artifacts/qualified-checkpoint-sha.txt
          git fetch origin battle/issue122-union72-full-gates-20261126
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ] &&
             git push origin "$commit:refs/heads/battle/issue122-union72-full-gates-20261126"; then
            echo 'Verified checkpoint advanced #218.' >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin "$commit:refs/heads/$checkpoint"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue122-reconcile-219-218-evidence
          path: |
            work/card-auto-connect/
            artifacts/all-remaining-*
            artifacts/union72-full-ai*
            artifacts/control-013-ai-policy-failure.json
            artifacts/control-013-browser-failure.json
            artifacts/qualified-checkpoint.bundle
            artifacts/qualified-checkpoint-sha.txt
            artifacts/exact-release-delta.json
            data/effect-extensions/compiled.json
            data/effect-extensions/intake.json
            data/reference-effects/plans.json
            reports/official-effect-continuation/
            data/official-effect-intake/checkpoint.json
            test-results/
          if-no-files-found: warn
          retention-days: 90
