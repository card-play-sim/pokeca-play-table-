name: Refresh deduplicated deck-picker PWA release
on:
  push:
    branches:
      - fix/deck-search-collapse-reprints-20261122
    paths:
      - ui/deck-builder.js
      - ui/deck-editor.css
      - deck-builder.html
      - .github/workflows/deck-reprint-release.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deck-search-collapse-reprints-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and validate PWA release manifest
        run: |
          node --check ui/deck-builder.js
          node scripts/build-pwa-release.cjs
          node scripts/build-pwa-release.cjs --check
      - name: Commit generated service worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh PWA after collapsing search reprints"
            git push origin HEAD:fix/deck-search-collapse-reprints-20261122
          fi
