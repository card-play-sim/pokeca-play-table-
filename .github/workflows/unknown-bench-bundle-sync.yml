name: Synchronize reviewed bench-search release artifacts
on:
  push:
    branches: [automation/reviewed-bench-search-next-20261128]
    paths: ['.github/workflows/unknown-bench-bundle-sync.yml']
permissions:
  contents: write
concurrency:
  group: unknown-bench-bundle-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'card-play-sim/pokeca-play-table-' && github.ref == 'refs/heads/automation/reviewed-bench-search-next-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify only derived release files
        run: |
          set -euo pipefail
          node --check scripts/lib/shared-effect-engine-worker.cjs
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
          node tests/fixture-reservation-fallback.test.cjs
          git diff --check
          git diff --exit-code -- . ':!ui/engine.bundle.js' ':!sw.js' ':!data/reference-effects/plans.json'
      - name: Persist derived files on exact working branch only
        run: |
          set -euo pipefail
          branch=automation/reviewed-bench-search-next-20261128
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add ui/engine.bundle.js sw.js data/reference-effects/plans.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate verified bench-search runtime bundle and PWA'
          git push origin "HEAD:refs/heads/$branch"
