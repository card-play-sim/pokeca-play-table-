name: IMG-LEDGER-002 official ID join audit
on:
  workflow_dispatch:
    inputs:
      formal_catalog_path:
        description: 'Read-only extracted formal catalog path (1945 records); must exist in checkout'
        required: true
        default: 'data/formal-1945-original/card_catalog.json'
  pull_request:
    paths:
      - 'scripts/img-ledger-002-audit.cjs'
      - 'tests/img-ledger-002-audit.test.cjs'
      - '.github/workflows/img-ledger-002.yml'
jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/img-ledger-002-audit.test.cjs
      - name: Audit source availability
        id: sources
        shell: bash
        run: |
          echo 'Formal 1945 source is external and READ-ONLY. Never substitute derived data.'
          if [ -f data/formal-1945-original/card_catalog.json ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: formal 1945 original not present in checkout' | tee formal-source-blocked.txt
          fi
      - name: Audit full official-ID join
        if: steps.sources.outputs.available == 'true'
        run: |
          git fetch origin 9bab9d4b5ce8116e169fed6c4cadce2d5f382b58
          git show 9bab9d4b5ce8116e169fed6c4cadce2d5f382b58:data/official-image-registry.json > /tmp/img-ledger-v247.json
          node scripts/img-ledger-002-audit.cjs /tmp/img-ledger-v247.json data/formal-1945-original/card_catalog.json reports/img-ledger-002.json data/fixed-deck-preview-bindings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: img-ledger-002-evidence
          path: |
            reports/img-ledger-002.json
            formal-source-blocked.txt
          if-no-files-found: warn
