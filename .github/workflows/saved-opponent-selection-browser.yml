name: Saved deck opponent selection Android Chromium
on:
  pull_request:
    paths:
      - 'ui/deck-home.js'
      - 'ui/deck-home.css'
      - 'index.html'
      - 'tests/test_saved_opponent_selection_browser.py'
      - '.github/workflows/saved-opponent-selection-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-opponent-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify explicit opponent choice and real 60-card AI match on Pixel 5
        env:
          POKECA_TEST_URL: http://127.0.0.1:8765/
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/saved-opponents-server.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:8765/ >/dev/null
          python tests/test_saved_opponent_selection_browser.py
      - name: Preserve Pixel 5 match evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-opponent-mobile-match
          path: artifacts/saved-opponent-selection-browser.json
          if-no-files-found: warn
          retention-days: 14
