name: 条件付きダメージ軽減2系統・全残件検証
on:
  push:
    branches: [battle/issue122-conditional-reduction-20261128]
    paths: ['.github/workflows/issue122-conditional-reduction.yml']
  workflow_dispatch:
concurrency:
  group: issue122-conditional-reduction
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          git merge-base --is-ancestor 19ef51d7c9612f79b41a85ab77e48a6179431c19 HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\"  return {mechanic:'PASSIVE_ROCKET_TEAM_ATTACK_GATE',commands:['ADD_STATE'],required:Number(rocketGate[1])};\\n const incomingReduction=generic.match(/^このポケモンが受けるワザのダメージは「-([1-9][0-9]{0,2})」される。$/);\",\"to\":\"  return {mechanic:'PASSIVE_ROCKET_TEAM_ATTACK_GATE',commands:['ADD_STATE'],required:Number(rocketGate[1])};\\n const conditionalReduction=generic.match(/^(このポケモンにエネルギーがついているなら、このポケモンが受ける|このポケモンのHPがまんたんの状態なら、このポケモンが相手のポケモンから受ける)ワザのダメージは「-([1-9][0-9]{0,2})」される。$/);\\n if(kind==='ABILITY'&&conditionalReduction)\\n  return {mechanic:'PASSIVE_INCOMING_ATTACK_DAMAGE_REDUCTION',commands:['PREVENT_DAMAGE'],amount:Number(conditionalReduction[2]),condition:conditionalReduction[1].startsWith('このポケモンにエネルギー')?'hasEnergy':'fullHp',sharedWording:true};\\n const incomingReduction=generic.match(/^このポケモンが受けるワザのダメージは「-([1-9][0-9]{0,2})」される。$/);\"},{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" if(kind==='ABILITY'&&generic==='自分の番に、このカードを手札から出して進化させたとき、1回使える。相手のベンチポケモンを1匹選び、バトルポケモンと入れ替える。')\",\"to\":\" const evolveLowHpSwitch=generic.match(/^自分の番に、このカードを手札から出して進化させたとき、1回使える。相手のベンチの残りHPが「([1-9]\\\\d{0,2})」以下のポケモンを1匹選び、バトルポケモンと入れ替える。$/);\\n if(kind==='ABILITY'&&evolveLowHpSwitch)\\n  return {mechanic:'ABILITY_EVOLVE_FORCE_SWITCH',commands:['FORCE_SWITCH'],origin:'evolve',maxRemainingHp:Number(evolveLowHpSwitch[1]),sharedWording:true};\\n if(kind==='ABILITY'&&generic==='自分の番に、このカードを手札から出して進化させたとき、1回使える。相手のベンチポケモンを1匹選び、バトルポケモンと入れ替える。')\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"  const reduction=enabledAbilities(g,mon)\\n   .filter(a=>a.plan.mechanic==='PASSIVE_INCOMING_ATTACK_DAMAGE_REDUCTION')\\n   .reduce((sum,a)=>sum+a.plan.amount,0);\",\"to\":\"  const reduction=enabledAbilities(g,mon)\\n   .filter(a=>a.plan.mechanic==='PASSIVE_INCOMING_ATTACK_DAMAGE_REDUCTION'&&(!a.plan.condition||a.plan.condition==='hasEnergy'&&(mon.energyCards||[]).length>0||a.plan.condition==='fullHp'&&(mon.damage||0)===0))\\n   .reduce((sum,a)=>sum+a.plan.amount,0);\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\" if(m==='STRETCHER')cardRequest('cards',p.discard.filter(c=>c.kind==='pokemon'||basicEnergy(c)),1,1);\\n if(['SWITCH','BOSS','ABILITY_EVOLVE_FORCE_SWITCH'].includes(m))cardRequest('bench',m==='SWITCH'?p.bench:o.bench,1,1);\\n if(m==='ENERGY_SWITCH'){\",\"to\":\" if(m==='STRETCHER')cardRequest('cards',p.discard.filter(c=>c.kind==='pokemon'||basicEnergy(c)),1,1);\\n if(['SWITCH','BOSS','ABILITY_EVOLVE_FORCE_SWITCH'].includes(m)){\\n  const pool=m==='SWITCH'?p.bench:o.bench;\\n  cardRequest('bench',m==='ABILITY_EVOLVE_FORCE_SWITCH'&&effect.plan.maxRemainingHp?pool.filter(c=>c.hp-(c.damage||0)>0&&c.hp-(c.damage||0)<=effect.plan.maxRemainingHp):pool,1,1);\\n }\\n if(m==='ENERGY_SWITCH'){\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\" if(m==='ABILITY_EVOLVE_FORCE_SWITCH')assert(opponent(g,actor).bench.length>0,'NO_OPPONENT_BENCH');\\n if(m==='ABILITY_SEARCH_TYPED_EVOLUTION')assert(p.deck.length>0,'ABILITY_SEARCH_DECK_EMPTY');\",\"to\":\" if(m==='ABILITY_EVOLVE_FORCE_SWITCH')assert(opponent(g,actor).bench.some(c=>!a.plan.maxRemainingHp||(c.hp-(c.damage||0)>0&&c.hp-(c.damage||0)<=a.plan.maxRemainingHp)),'NO_OPPONENT_BENCH');\\n if(m==='ABILITY_SEARCH_TYPED_EVOLUTION')assert(p.deck.length>0,'ABILITY_SEARCH_DECK_EMPTY');\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"  case 'SWITCH':chooseBenchSwitch(g,actor,p,ids('bench')[0]);break;\\n  case 'ABILITY_EVOLVE_FORCE_SWITCH':case 'BOSS':chooseBenchSwitch(g,actor,o,ids('bench')[0]);break;\\n  case 'REPELLENT':assert(o.bench.length>0,'NO_OPPONENT_BENCH');g.pendingReferenceChoice={kind:'SWITCH',playerId:o.id,options:o.bench.map(id)};break;\",\"to\":\"  case 'SWITCH':chooseBenchSwitch(g,actor,p,ids('bench')[0]);break;\\n  case 'ABILITY_EVOLVE_FORCE_SWITCH':{\\n   const chosen=o.bench.find(c=>id(c)===ids('bench')[0]);\\n   assert(chosen&&(!plan.maxRemainingHp||(chosen.hp-(chosen.damage||0)>0&&chosen.hp-(chosen.damage||0)<=plan.maxRemainingHp)),'SWITCH_BENCH_TARGET_INVALID');\\n   chooseBenchSwitch(g,actor,o,id(chosen));break;\\n  }\\n  case 'BOSS':chooseBenchSwitch(g,actor,o,ids('bench')[0]);break;\\n  case 'REPELLENT':assert(o.bench.length>0,'NO_OPPONENT_BENCH');g.pendingReferenceChoice={kind:'SWITCH',playerId:o.id,options:o.bench.map(id)};break;\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"  }\\n  if(m==='PASSIVE_ACTIVE_HIT_RETALIATION'){\\n    const attacker=records.get('45152'),attackIndex=attacker?.attacks.findIndex(a=>a.plan?.mechanic==='VANILLA_DAMAGE'&&Number(a.damage)>0);\",\"to\":\"  }\\n  if(m==='PASSIVE_ACTIVE_HIT_RETALIATION'||m==='PASSIVE_INCOMING_ATTACK_DAMAGE_REDUCTION'&&e.plan.condition){\\n    const attacker=records.get('45152'),attackIndex=attacker?.attacks.findIndex(a=>a.plan?.mechanic==='VANILLA_DAMAGE'&&Number(a.damage)>0);\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    }\\n    return {port:port(game),sourceId:frame.sourceId,kind:'attack',trigger};\",\"to\":\"    }\\n    if(m==='PASSIVE_INCOMING_ATTACK_DAMAGE_REDUCTION'&&e.plan.condition){\\n      const [own,other]=game.players,defender=other.active;\\n      for(const c of [...own.active.energyCards])if(c.isSpecial){own.active.energyCards.splice(own.active.energyCards.indexOf(c),1);own.deck.push(c);}\\n      if(e.plan.condition==='hasEnergy'&&!defender.energyCards.length){\\n        const i=other.deck.findIndex(c=>c.kind==='energy'&&!c.isSpecial);\\n        if(i<0)return {blocked:'NO_CONDITIONAL_REDUCTION_ENERGY'};\\n        defender.energyCards.push(other.deck.splice(i,1)[0]);\\n      }\\n      if(e.plan.condition==='fullHp')assert.equal(defender.damage,0);\\n    }\\n    return {port:port(game),sourceId:frame.sourceId,kind:'attack',trigger};\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    verifyPrintedAttack(before, after, t.trigger, Number(t.trigger.damage), e.plan.amount);\\n  }\",\"to\":\"    verifyPrintedAttack(before, after, t.trigger, Number(t.trigger.damage), e.plan.amount);\\n    if(e.plan.condition){\\n      const start=JSON.parse(JSON.stringify(before)),side=start.players[1],mon=side.active;\\n      if(e.plan.condition==='hasEnergy'){\\n        assert(mon.energyCards.length>0);side.deck.push(...mon.energyCards.splice(0));mon.energies=[];\\n      }else{assert.equal(mon.damage,0);mon.damage=10;}\\n      const retry=port(start),action=t.action||o.action;\\n      assert(retry.dispatch('you',action).ok);\\n      const result=retry.getSnapshot();\\n      verifyPrintedAttack(start,result,t.trigger,Number(t.trigger.damage),0);\\n      assert.deepEqual(Array.from(S.identities(start)),Array.from(S.identities(result)));\\n      assert(retry.restoreSession(retry.getResumeSnapshot()).ok);\\n      assert.equal(JSON.stringify(retry.getSnapshot()),JSON.stringify(result));\\n    }\\n  }\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\" }\\n if(m==='ATTACK_DISCARD_DEFENDER_ENERGY'&&plan.defenderEx)\",\"to\":\" }\\n if(m==='ABILITY_EVOLVE_FORCE_SWITCH'&&plan.maxRemainingHp){\\n  reserve(r=>mon(r,null,0)&&!r.abilities.length&&r.facts.hp<=plan.maxRemainingHp,'bench',1);\\n  reserve(r=>mon(r,null,0)&&!r.abilities.length&&r.facts.hp>plan.maxRemainingHp,'bench',1);\\n }\\n if(m==='ATTACK_DISCARD_DEFENDER_ENERGY'&&plan.defenderEx)\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    assert.deepEqual(S.identities(before),S.identities(after));\\n    const closed=JSON.parse(JSON.stringify(before));closed.referenceActionSequence++;\",\"to\":\"    assert.deepEqual(S.identities(before),S.identities(after));\\n    if(e.plan.maxRemainingHp){\\n      const threshold=e.plan.maxRemainingHp;\\n      const selected=other.bench.find(c=>c.id===action.selections.bench[0]);\\n      const excluded=other.bench.find(c=>c.hp-(c.damage||0)>threshold&&c.hp>threshold);\\n      assert(selected&&selected.hp-(selected.damage||0)>0&&selected.hp-(selected.damage||0)<=threshold,'LOW_HP_SWITCH_POSITIVE_FIXTURE');\\n      assert(excluded,'LOW_HP_SWITCH_NEGATIVE_FIXTURE');\\n      const invalid={...action,selections:{...action.selections,bench:[excluded.id]}};\\n      const denied=port(before);assert.equal(denied.dispatch('you',invalid).ok,false);\\n      assert.equal(JSON.stringify(denied.getSnapshot()),JSON.stringify(before));\\n      const boundary=JSON.parse(JSON.stringify(before)),card=boundary.players[1].bench.find(c=>c.id===excluded.id);\\n      card.damage=card.hp-threshold;\\n      const replay=port(boundary);assert(replay.dispatch('you',invalid).ok);\\n      const result=replay.getSnapshot();assert.equal(result.players[1].active.id,excluded.id);\\n      assert.equal(result.players[1].active.hp-result.players[1].active.damage,threshold);\\n      assert.deepEqual(Array.from(S.identities(boundary)),Array.from(S.identities(result)));\\n      assert(replay.restoreSession(replay.getResumeSnapshot()).ok);\\n      assert.equal(JSON.stringify(replay.getSnapshot()),JSON.stringify(result));\\n    }\\n    const closed=JSON.parse(JSON.stringify(before));closed.referenceActionSequence++;\"}]")
          for change in changes:
              p=Path(change['path'])
              s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          git add engine scripts
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Print exact evolution target diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def visit(x,p):
              if isinstance(x,dict):
                  slot=x.get('slot')
                  if isinstance(slot,str) and any(slot.startswith(i+':') for i in ('47057','49089','50376','50781')) and x.get('status') in ('FAILED','BLOCKED'):
                      print(p,json.dumps(x,ensure_ascii=False)[:5000])
                  for v in x.values(): visit(v,p)
              elif isinstance(x,list):
                  for v in x: visit(v,p)
          for p in pathlib.Path('work/card-auto-connect').rglob('*.json'):
              try: visit(json.loads(p.read_text()),str(p))
              except (ValueError,OSError): pass
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          // 50781 has a separate unsupported named next-turn attack; retain it unresolved.
          const required=["47057","49089","50376","45941","46151","48736"].filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,added,missing,count:added.length};fs.writeFileSync('artifacts/conditional-reduction-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          export POKECA_BROWSER_SHARD_COUNT=4
          export POKECA_BROWSER_SLOTS_ONLY=1
          pids=()
          for shard in 0 1 2 3; do
            POKECA_BROWSER_SHARD_INDEX="$shard" POKECA_INTAKE_ARTIFACT="conditional-reduction-$shard" python tests/test_control_013_browser.py >"artifacts/conditional-reduction-$shard.log" 2>&1 &
            pids+=("$!")
          done
          rv=0
          for pid in "${pids[@]}"; do wait "$pid" || rv=1; done
          for f in artifacts/conditional-reduction-*.log; do tail -n 15 "$f"; done
          test "$rv" = 0
          unset POKECA_BROWSER_SLOTS_ONLY
          POKECA_BROWSER_SHARD_INDEX=0 POKECA_INTAKE_ARTIFACT=conditional-reduction-full-ai python tests/test_control_013_browser.py >artifacts/conditional-reduction-full-ai.log 2>&1 || { tail -n 30 artifacts/conditional-reduction-full-ai.log; exit 1; }
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/conditional-reduction-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/conditional-reduction-candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified conditional attack reduction'
          ref="HEAD:refs/heads/battle/issue122-conditional-reduction-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-reduction-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
