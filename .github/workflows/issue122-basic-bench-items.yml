name: グッズ共通ベンチ検索・対象限定対戦検証
on:
  push:
    branches: [battle/issue122-basic-bench-items-20261128]
    paths: ['.github/workflows/issue122-basic-bench-items.yml']
  workflow_dispatch:
concurrency:
  group: issue122-basic-bench-items
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INTAKE_LIMIT: '10000'
      POKECA_ENGINE_SHARDS: '4'
      POKECA_INTAKE_LOCAL_CANDIDATE: '1'
      POKECA_INTAKE_EXACT_TARGETS: '47099,48678,49382,46220,49374'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate common source and preserve published baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58e9c7d89ee6e9ece08abc64fa5cecc5baf5af7c HEAD
          git fetch origin main
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"engine/reference-effect-plans.cjs\",\"from\":\" const generic=text.normalize('NFKC');\",\"to\":\" const generic=text.normalize('NFKC');\\n if(kind==='MAIN'&&entry.category==='item'){\\n  const bench=generic.match(/^自分の山札からたねポケモン(?:の「(ホップ)のポケモン」)?を(1枚|[2-5]枚まで|好きなだけ)選び、ベンチに出す。そして山札を切る。$/);\\n  if(bench)return {mechanic:'SEARCH_BASIC_TO_BENCH_ATTACK',commands:['SEARCH_DECK','BENCH_FROM_ZONE','SHUFFLE_DECK'],limit:bench[2]==='好きなだけ'?5:parseInt(bench[2],10),...(bench[1]?{team:bench[1]}:{}),trainer:true,batchSearch:true,sharedWording:true};\\n }\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\"   if(m==='TRAINER_SEARCH_TERA')assert(p.deck.length>0,'NO_DECK_SEARCH_POSSIBLE');\",\"to\":\"   if(m==='SEARCH_BASIC_TO_BENCH_ATTACK'&&r.mainPlan.trainer)assert(p.deck.length>0&&p.bench.length<5,'NO_BASIC_BENCH_SEARCH_POSSIBLE');\\n   if(m==='TRAINER_SEARCH_TERA')assert(p.deck.length>0,'NO_DECK_SEARCH_POSSIBLE');\"},{\"path\":\"engine/pokeca_reference_effect_runtime.cjs\",\"from\":\" switch(m){\\n  case 'ATTACK_NAMED_DISCARD_BENCH':{\",\"to\":\" if(m==='SEARCH_BASIC_TO_BENCH_ATTACK'&&plan.trainer){\\n  assert(card.kind==='trainer'&&card.cardType==='ITEM'&&p.bench.length<5,'INVALID_BASIC_BENCH_ITEM');\\n  searchSelectedDeck(g,actor,p,ids('cards'),{destination:'bench'});\\n  return;\\n }\\n switch(m){\\n  case 'ATTACK_NAMED_DISCARD_BENCH':{\"},{\"path\":\"scripts/lib/shared-effect-engine-worker.cjs\",\"from\":\"    assert(after.history.slice(before.history.length).some(event => event.details?.command === \\\"SHUFFLE_DECK\\\"));\\n    const replay = port(before);\\n    for (const ids of [[chosen[0], chosen[0]], [own.active.id]]) {\",\"to\":\"    assert(after.history.slice(before.history.length).some(event => event.details?.command === \\\"SHUFFLE_DECK\\\"));\\n    if(e.plan.trainer){\\n      assert.equal(action.type,'play_item');\\n      assert(after.players[0].discard.some(c=>c.id===action.cardId));\\n      assert.equal(after.players[1].active.damage,before.players[1].active.damage);\\n      assert.equal(after.turnPlayer,before.turnPlayer);\\n      assert(!after.history.slice(before.history.length).some(ev=>ev.type==='attack'));\\n      assert.deepEqual(S.identities(before),S.identities(after));\\n      const saved=port(after);assert(saved.restoreSession(saved.getResumeSnapshot()).ok);assert.deepEqual(saved.getSnapshot(),after);\\n    }\\n    const replay = port(before);\\n    for (const ids of [[chosen[0], chosen[0]], [own.active.id]]) {\"},{\"path\":\"tests/test_control_013_browser.py\",\"from\":\"    assert set(selected)<=bench_ids and set(selected).isdisjoint(deck_ids)\\n    assert any(ev.get('details',{}).get('command')=='SHUFFLE_DECK' for ev in events)\",\"to\":\"    assert set(selected)<=bench_ids and set(selected).isdisjoint(deck_ids)\\n    assert any(ev.get('details',{}).get('command')=='SHUFFLE_DECK' for ev in events)\\n    if f['e']['plan'].get('trainer'):\\n     assert option['action']['type']=='play_item'\\n     assert any(c['id']==option['action']['cardId'] for c in after['players'][0]['discard'])\\n     assert after['players'][1]['active']['damage']==before['players'][1]['active']['damage']\\n     assert after['turnPlayer']==before['turnPlayer']\\n     assert not any(ev['type']=='attack' for ev in events)\\n     source=[c for c in before['players'][0]['deck'] if c['id'] in selected]\\n     printed=await page.evaluate(\\\"cards=>cards.map(c=>Pokeca.getReferenceEffectRecord(c))\\\",source)\\n     assert all(c['facts']['basic'] and (not f['e']['plan'].get('team') or c['name'].startswith(f['e']['plan']['team']+'の')) for c in printed)\"}]")
          for change in changes:
              p=Path(change['path']); s=p.read_text()
              assert s.count(change['from'])==1,change['path']
              p.write_text(s.replace(change['from'],change['to']))
          PY
          git add engine scripts tests
          node --check engine/reference-effect-plans.cjs
          node --check engine/pokeca_reference_effect_runtime.cjs
          node --check scripts/lib/shared-effect-engine-worker.cjs
          mkdir -p artifacts
          node scripts/build-effect-extensions.cjs
          node scripts/sync-reference-effects.cjs
          node scripts/build-pwa-release.cjs
          git restore --source=HEAD -- data/effect-extensions/compiled.json
      - name: Execute all remaining prints with final regression
        run: node scripts/run-atomic-official-battle-intake.cjs
      - name: Print exact evolution target diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def visit(x,p):
              if isinstance(x,dict):
                  slot=x.get('slot')
                  if isinstance(slot,str) and any(slot.startswith(i+':') for i in ('47099','48678','49382','46220','49374')) and x.get('status') in ('FAILED','BLOCKED'):
                      print(p,json.dumps(x,ensure_ascii=False)[:5000])
                  for v in x.values(): visit(v,p)
              elif isinstance(x,list):
                  for v in x: visit(v,p)
          for p in pathlib.Path('work/card-auto-connect').rglob('*.json'):
              try: visit(json.loads(p.read_text()),str(p))
              except (ValueError,OSError): pass
          PY
      - name: Preserve every published record and recover exact previously qualified IDs
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const p='data/effect-extensions/compiled.json',base=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const read=(ref,path=p)=>JSON.parse(execFileSync('git',['show',ref+':'+path],{encoding:'utf8',maxBuffer:64*1024*1024}));
          const before=read(base).records,rows=JSON.parse(fs.readFileSync(p)).records,now=new Map(rows.map(r=>[String(r.officialCardId),r])),old=new Set(before.map(r=>String(r.officialCardId)));
          assert.equal(rows.length,now.size);for(const r of before)assert.deepEqual(now.get(String(r.officialCardId)),r,'PUBLISHED_RECORD_CHANGED:'+r.officialCardId);
          const required=[];
          const targets=["47099","48678","49382","46220","49374"].filter(id=>!old.has(id));
          const added=[...now.keys()].filter(id=>!old.has(id)).sort();
          const candidate=require('./work/card-auto-connect/candidate.json');
          const verified=new Set(candidate.qualified.map(String));
          for(const id of added)assert(verified.has(id),'NEW_PRINT_WITHOUT_CURRENT_ENGINE_RECEIPT:'+id);
          const missing=required.filter(id=>!now.has(id));
          const out={base,required,targets,added,missing,unresolvedTargets:targets.filter(id=>!now.has(id)),count:added.length};fs.writeFileSync('artifacts/basic-bench-items-exact-delta.json',JSON.stringify(out,null,2)+'\n');
          console.log('EXECUTION_PROOF_EXACT_DELTA',JSON.stringify(out));
          assert.equal(missing.length,0,'PREVIOUSLY_QUALIFIED_PRINT_MISSING');
          console.log('TARGET_RECOVERY',required.length-missing.length,'of',required.length,'; minimum 30 print target:',added.length>=30);
          assert(added.length>0,'NO_NEW_PRINT_QUALIFIED');
          NODE
          node scripts/build-effect-extensions.cjs --check
          node scripts/sync-reference-effects.cjs --check
          node scripts/build-pwa-release.cjs --check
      - name: All exact new slots in Chromium and completed imported-deck match
        run: |
          set -euo pipefail
          pip install playwright==1.56.0
          bash scripts/install-ci-chromium.sh
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/union-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export POKECA_TEST_URL=http://127.0.0.1:8765/
          export POKECA_INTAKE_PREFIX=work/card-auto-connect/browser
          export POKECA_INTAKE_RELEASE_BASE=$(git rev-parse HEAD)
          test -s "$POKECA_INTAKE_PREFIX/example-decks.json" || { echo "EXACT_CANDIDATE_DECK_MANIFEST_MISSING"; exit 1; }
          bash scripts/run-intake-candidate-browser-shards.sh basic-bench-items
      - name: Save verified candidate without overwriting main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp artifacts/basic-bench-items-exact-delta.json reports/official-effect-continuation/
          cp work/card-auto-connect/candidate.json reports/official-effect-continuation/basic-bench-items-candidate.json
          git add engine scripts tests data/effect-extensions data/official-effect-intake data/reference-effects/plans.json ui/engine.bundle.js sw.js reports/ij-effect-coverage.json reports/official-effect-continuation
          git diff --cached --check
          git commit -m 'checkpoint: verified item bench-search effects'
          ref="HEAD:refs/heads/battle/issue122-basic-bench-items-qualified-$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "$ref"; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basic-bench-items-evidence
          path: |
            artifacts/
            work/card-auto-connect/
          if-no-files-found: warn
