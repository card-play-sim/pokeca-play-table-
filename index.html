<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d32"><title>ポケカ・プレイテーブル</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="ui/mobile.css?build=198"></head>
<body>
<div class="app" id="app">
<header class="topbar"><div class="brand"><span class="brand-mark">◈</span><div><h1>PLAY TABLE</h1><small>ポケカ · <strong id="build-revision">装着エネルギー表示 v198</strong></small></div></div><div class="top-actions"><button id="demo-open" aria-label="架空カードのAI試験対戦を開始">AI試験対戦</button><button id="history-open" aria-label="履歴を開く">履歴 <span id="history-count">0</span></button><button id="menu-open" aria-label="メニューを開く">⋯</button></div></header>
<div class="turnbar"><span class="live-dot"></span><strong id="turn-label"></strong><span id="game-note">実証・練習盤面</span></div>
<main class="table" aria-label="対戦盤面">
<section class="side opponent" aria-label="相手の場">
<div class="side-meta"><span class="player-label">相手</span><div class="opponent-hand-summary" aria-label="相手の手札枚数"><span class="opponent-hand-label">相手の手札</span><strong id="opponent-hand-count" aria-live="polite">0枚</strong><div id="opponent-hand" aria-hidden="true"></div></div><div id="opponent-effects" class="scope-effects" aria-label="相手側の制限"></div></div>
<div class="bench" id="opponent-bench" aria-label="相手ベンチ"></div>
<div class="active-row"><div class="zone-rail" id="opponent-left"></div><div class="active-slot" id="opponent-active" aria-label="相手バトル場"></div><div class="zone-rail" id="opponent-right"></div></div>
</section>
<button class="stadium" id="stadium" aria-label="スタジアムの詳細"><span class="stadium-label">STADIUM</span><span class="stadium-art" id="stadium-art" aria-hidden="true"></span><span id="stadium-name">スタジアムなし</span></button>
<section class="side self" aria-label="自分の場">
<div class="active-row"><div class="zone-rail" id="self-left"></div><div class="active-slot" id="self-active" data-drop-zone="active" aria-label="自分バトル場"></div><div class="zone-rail" id="self-right"></div></div>
<div class="bench" id="self-bench" data-drop-zone="bench" aria-label="自分ベンチ"></div>
<div class="self-meta"><span class="player-label">自分</span><div id="self-effects" class="scope-effects" aria-label="自分側の制限"></div><div class="limits" id="limits" aria-label="この番の使用状況"></div></div>
</section>
</main>
<div class="actionbar"><span id="interaction-hint" role="status">カードをタップで操作・長押しで詳細</span><button id="attack-button" class="action-attack">ワザを使う</button><button id="ability-button" class="action-ability">特性を使う</button><button id="draw-button">1枚引く</button><button id="end-turn" class="primary">番を終える →</button></div>
<section class="hand-panel" aria-label="自分の手札"><div class="hand-heading"><strong>手札 <span id="hand-count"></span></strong><span>横にスライド · 上へドラッグ</span></div><div id="self-hand" class="hand" tabindex="0" aria-label="自分の手札・横スクロール"></div></section>
<footer><span id="save-status" role="status">保存準備中</span> · 操作練習 <button id="practice-info">?</button></footer>
</div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" aria-label="閉じる">✕</button></div><div id="sheet-content"></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">確認</h2><p id="confirm-message"></p><div class="confirm-actions"><button id="confirm-cancel">キャンセル</button><button id="confirm-ok" class="primary">実行する</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><div id="animation-layer" aria-hidden="true"></div>
<script src="ui/engine.bundle.js?build=188"></script><script src="ui/card-art.js?build=188"></script><script src="ui/verified-card-art.js?build=193"></script><script src="ui/session-storage.js?build=188"></script><script src="ui/mobile.js?build=198"></script>
<script>if(location.protocol==="https:"&&"serviceWorker" in navigator){let refreshing=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!refreshing){refreshing=true;location.reload();}});navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>{reg.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{});});}).catch(()=>{});}</script></body></html>
